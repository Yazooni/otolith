 {q:'Most common cause of persistent inspiratory stridor in INFANTS:',c:['Laryngomalacia','Subglottic stenosis','Croup','Vascular ring'],a:0,e:'Laryngomalacia: &gt;70% of persistent inspiratory stridor in infants; flaccid epiglottis/arytenoids; mild stridor worse supine/at rest/sleep; benign; not a wheeze (no respiratory meds); diagnosed only by visualizing the larynx during active respiration; resolves by 1-1.5 years.',s:'Slides 40, 42'},
 {q:'Laryngomalacia stridor is typically worse when:',c:['Lying on the back, at rest or sleeping','Crying','Upright and active','Feeding only'],a:0,e:'"Worse when lying on their backs or at rest, sleeping." Benign; rarely affects feeding/breathing.',s:'Slide 42'},
 {q:'How is laryngomalacia diagnosed?',c:['Only by visualization of the larynx during active respiration','Lateral neck x-ray thumb sign','Steeple sign','Response to albuterol'],a:0,e:'"Diagnosis is made ONLY by visualization of the larynx during active respiration." No respiratory medications.',s:'Slide 42'},
 {q:'A former preemie with prolonged intubation has BIPHASIC stridor. Likely diagnosis and definitive test?',c:['Subglottic stenosis; bronchoscopy','Laryngomalacia; observation','Croup; steroids','Epiglottitis; x-ray'],a:0,e:'Subglottic stenosis: narrowing just below the vocal cords; congenital or prolonged/repeated intubation; biphasic stridor (mainly inspiratory); definitive diagnosis by bronchoscopy.',s:'Slide 43'},
 {q:'Most common cause of sub-acute upper airway obstruction in toddlers and older children:',c:['Hypertrophied tonsils and adenoids','Laryngomalacia','Choanal atresia','Vocal cord paralysis'],a:0,e:'Toddlers and older children: hypertrophied tonsils/adenoids most common. Infants: laryngomalacia most common. Newborn list includes choanal atresia, micrognathia, macroglossia, laryngeal web, vocal cord paralysis, subglottic stenosis.',s:'Slides 40-41'},
 {q:'A young child has foul-smelling unilateral nasal drainage. Most likely?',c:['Nasal foreign body','Allergic rhinitis','Viral URI','Choanal atresia bilateral'],a:0,e:'Foreign bodies: ears, nose (nasal drainage, malodorous), ingestion; remove promptly.',s:'Slides 9, 38'},
]);
addN('4.14',[
 {h:'Pediatric ear',b:'<b>Preauricular sinus</b>: congenital remnant, can infect; bilateral + branchial cleft + renal = <b>branchio-oto-renal</b>.<br><b>Microtia</b>: ↑inner ear malformations, hearing loss.<br><b>Auricular hematoma</b> → permanent deformity if untreated.<br><b>Basilar skull fracture</b> (temporal): Battle sign, hemotympanum.<br><b>Otitis externa</b>: white malodorous discharge, red canal, pain on pinna movement; Pseudomonas, S. aureus; fluoroquinolone drops; dry with rubbing alcohol.<br><b>Mastoiditis</b>: AOM into mastoid cells; ear "down and out"; admit, IV antibiotics.<br><b>Cholesteatoma</b>: most common/severe TM mass; trapped epithelium; progressive hearing loss; white mass; remove.<br>Syndromes: Treacher Collins (maxillary hypoplasia, micrognathia, auricular deformity); Apert/Crouzon (craniosynostosis).',s:'Slides 5-15'},
 {h:'Pediatric nose',b:'Sinuses: maxillary + ethmoid partly at birth; sphenoid ~5 y; frontal 7-8 y.<br><b>URI</b>: rhinovirus most common; 7-8/yr; infants 1-3 mo obligate nose breathers; 5-7 d; secretion color ≠ bacterial; supportive; NO OTC decongestant/antihistamine/cough suppressant; hand washing. &gt;7-10 d → sinusitis, treat. Complications: Pott\'s puffy tumor (frontal erosion, doughy, painful), epidural, periorbital, orbital abscess.<br><b>Choanal atresia</b>: bony 90%; can\'t pass catheter; CT; bilateral → newborn distress, paradoxical cyanosis (better crying) → oral airway; unilateral → persistent unilateral drainage.<br>Dermoid (firm, central dimple); encephalocele. <b>Polyps → CF workup.</b> Septal hematoma → saddle nose. Epistaxis: saline gel, stop picking.',s:'Slides 17-25'},
 {h:'Pediatric throat',b:'Tonsils/adenoids grow until 8-10 y then shrink. Pierre Robin: micrognathia + cleft. High-arched palate: trisomy 13/18, pacifier/thumb.<br><b>Pharyngitis</b>: mostly viral; GAS most common bacterial (uncommon &lt;3 y); gonorrhea in teens; EBV/CMV. Rapid test + PCR/culture backup. Scarlet fever: circumoral pallor, strawberry tongue, fine rash. Tx amoxicillin → prevents rheumatic fever. Uvulitis: GAS. Tonsillectomy: &gt;6/1 yr or 5/yr ×2.',f:'Tonsillectomy counts differ from Strabbing (7/1 yr, 5/yr ×2, 3/yr ×3).',s:'Slides 27-33'},
 {h:'Acute airway obstruction (Nelson table)',b:'<table><tr><th></th><th>Age</th><th>Key</th><th>Film</th><th>Tx</th></tr><tr><td>Croup (parainfluenza)</td><td>6 mo-3 y</td><td>URI, barky cough, stridor, nontoxic</td><td>Steeple</td><td>Dexamethasone, racemic epi, cool mist</td></tr><tr><td>Epiglottitis</td><td>2-6 y</td><td>High fever, rapid, no cough, drooling, tripod, toxic</td><td>Thumb</td><td>Intubate, antibiotics</td></tr><tr><td>Bacterial tracheitis</td><td>any</td><td>High fever, rapid, no URI, toxic</td><td>Ragged trachea</td><td>Intubate, antibiotics</td></tr><tr><td>Retropharyngeal abscess</td><td>&lt;6 y</td><td>Insidious, drooling, arched neck</td><td>Thick retropharynx</td><td>Antibiotics, drainage</td></tr><tr><td>PTA</td><td>&gt;8 y</td><td>Trismus, hot-potato voice, asymmetric tonsil</td><td>None needed</td><td>Antibiotics, drainage</td></tr></table><b>Supraglottic</b>: quiet stridor, muffled, dysphagia, drooling, tripod, toxic, no bark. <b>Subglottic</b>: loud stridor, hoarse, bark, no drooling, nontoxic (unless tracheitis).',s:'Slides 34-39'},
 {h:'Subacute obstruction, laryngomalacia, SGS',b:'Infancy: <b>laryngomalacia most common</b> (&gt;70% persistent inspiratory stridor; floppy epiglottis/arytenoids; worse supine/asleep; benign; no resp meds; diagnose only by visualizing larynx in active breathing; resolves 1-1.5 y). Toddlers/older: <b>hypertrophied tonsils/adenoids most common</b>.<br><b>Subglottic stenosis</b>: congenital or prolonged intubation; <b>biphasic</b> stridor; bronchoscopy.',s:'Slides 40-43'},
]);
addQ('4.17',[
 {q:'Which list contains AUTOIMMUNE causes of oral cavity lesions on Dr. Strabbing\'s slide?',c:['Behçet syndrome, lupus, Crohn disease, pemphigoid, lichen planus, aphthous ulceration, erythema multiforme','HSV, CMV, Coxsackie, syphilis','Vitamin B, C, iron, folate deficiency','Necrotizing sialometaplasia'],a:0,e:'Autoimmune: Behçet\'s, lupus, Crohn\'s, pemphigoid, lichen planus, aphthous ulceration, erythema multiforme (objective: autoimmune differential). Infection list: HSV, actinomycosis, CMV, VZV, Coxsackie, syphilis, candidiasis, cryptosporidium, histoplasma.',s:'Slides 3-4, 18'},
 {q:'Which is a TRAUMA-induced oral lesion on the slide?',c:['Necrotizing sialometaplasia','Lichen planus','Leukoplakia','Erythema multiforme'],a:0,e:'Other categories: neoplasm; trauma-induced (necrotizing sialometaplasia); malnourishment (vitamin B, C, iron, folate deficiency).',s:'Slide 5'},
 {q:'Per Dr. Strabbing\'s differential, the MOST LIKELY causes of an oral cavity lesion are:',c:['Aphthous ulcer, HSV, trauma, malignancy','VZV, autoimmune disease, fungal, malnourishment','Syphilis, TB, histoplasmosis','Lichen planus only'],a:0,e:'Most likely: aphthous ulcer, HSV, trauma, malignancy. Less likely: VZV, autoimmune, fungal, malnourishment. Must rule out: malignancy, immunosuppression, bacterial/fungal disease, some autoimmune diseases.',s:'Slide 6'},
 {q:'Primary herpetic gingivostomatitis presents with:',c:['Multiple small vesicles at many oral sites rupturing within 24 hours into ulcers (heal 7-14 days), with fever, arthralgia, malaise, headache, cervical LAD','A single painless ulcer','White plaques that scrape off','A red velvety patch'],a:0,e:'Primary HSV gingivostomatitis: multiple small vesicles, rupture in 24 h → ulcers healing 7-14 d; systemic symptoms; highest infectivity when vesicles rupture.',s:'Slide 7'},
 {q:'Average incubation time of HSV per the slide:',c:['7 days','24 hours','30 days','6 months'],a:0,e:'HSV transmitted by direct contact with body fluid; average incubation ~7 days; then dormant until reactivation.',s:'Slide 7'},
 {q:'When is HSV most infective?',c:['When the vesicles rupture','During latency','After crusting','Only during the prodrome'],a:0,e:'"Highest infectivity rate when vesicles rupture."',s:'Slide 7'},
 {q:'Recurrent (reactivated) HSV lesions typically erupt on:',c:['The mucocutaneous junction of the lips, hard palate and other attached gingiva, after a tingling/burning prodrome','Buccal mucosa and soft palate only','The lateral tongue as a white plaque','The tonsils only'],a:0,e:'Reactivation triggers: UV light, stress, infection, immunosuppression. Vesicles on lips\' mucocutaneous junction, hard palate, attached gingiva; prodrome of tingling/itching/burning; vesicles → ulcers → crusting in 7-14 d.',s:'Slide 8'},
 {q:'Best specimen and test for diagnosing HSV oral lesions:',c:['Fluid from an UNRUPTURED vesicle, tested by PCR (much better than culture)','Scraping of a crusted lesion for culture','Serology only','Biopsy of normal mucosa'],a:0,e:'Obtain fluid from an unruptured vesicle (most likely to contain virus); PCR is much better than culture.',s:'Slide 8'},
 {q:'Which statement about HSV treatment is correct?',c:['Valacyclovir/famciclovir inhibit viral DNA polymerase, suppress/control symptoms but do not cure (1 week); acyclovir 5% cream during prodrome may shorten or abort reactivation','Antivirals cure HSV','Antibiotics are first line','Steroids alone are curative'],a:0,e:'Supportive (antipyretics, analgesics, hydration); valacyclovir/famciclovir inhibit DNA polymerase, control not cure (1 wk); 5% acyclovir cream in prodrome for 1 wk may shorten/abort.',s:'Slide 9'},
 {q:'Oral varicella zoster lesions typically involve:',c:['Buccal mucosa and hard palate; resemble aphthous ulcers','Lateral tongue white plaques','The lips only','The gums only as red patches'],a:0,e:'Primary = chickenpox; secondary = shingles. Oral involvement: buccal mucosa and hard palate; lesions resemble aphthous ulcers. Most common dermatome affected: V3. Prevent with vaccination; severe → valacyclovir/famciclovir.',s:'Slides 11-12'},
 {q:'The most common trigeminal dermatome affected by oral varicella zoster per the slide:',c:['V3','V1','V2','C2'],a:0,e:'"Most common dermatome affected is V3."',s:'Slide 12'},
 {q:'Oral candidiasis typically occurs in which settings?',c:['Immunocompromised state, oral trauma, or recent antibiotic use','Healthy adults without risk factors','Only in newborns','After tonsillectomy only'],a:0,e:'Candida is normal oral flora; infection typically in immunocompromise, oral trauma, or recent antibiotics.',s:'Slide 13'},
 {q:'A white plaque that can be scraped off to reveal a beefy red base is:',c:['Pseudomembranous candidiasis (thrush), the most common form','Leukoplakia','Lichen planus','Erythroplakia'],a:0,e:'Thrush = most common form; scrapes off revealing beefy red base. Leukoplakia does NOT scrape off. Atrophic candidiasis: erythematous patch on lateral tongue. Angular cheilitis: oral commissure (poor closure, ill-fitting dentures).',s:'Slides 14-15, 20'},
 {q:'On scrapings of oral candidiasis you expect:',c:['Pseudohyphae, hyphae and yeast all on the same slide','Multinucleated giant cells only','Gram-positive cocci','Koilocytes'],a:0,e:'Scrapings: pseudohyphae, hyphae and yeast present on the same slide.',s:'Slide 16'},
 {q:'Treatment ladder for oropharyngeal candidiasis:',c:['Mild acute: topical nystatin; mild chronic: nystatin + clotrimazole troche; refractory/immunocompromised without systemic: nystatin + oral fluconazole; systemic: amphotericin B ± fluconazole','Oral fluconazole for everyone first','Amphotericin for mild thrush','No treatment'],a:0,e:'Exactly as listed on slide 17.',s:'Slide 17'},
 {q:'Erythema multiforme on Dr. Strabbing\'s autoimmune list includes which severe form?',c:['Stevens-Johnson syndrome','Pemphigus vulgaris','Discoid lupus','Kawasaki disease'],a:0,e:'Erythema multiforme: multiforme minor, Stevens-Johnson syndrome. Pemphigoid group: bullous pemphigoid, cicatricial pemphigoid, pemphigus vulgaris. Lupus: SLE, discoid. Also lichen planus, Behçet\'s, Kawasaki.',s:'Slide 18'},
 {q:'The most common NONTRAUMATIC ulceration of the oral cavity is:',c:['Aphthous ulcer (diagnosis of exclusion, by appearance/course)','HSV','Squamous cell carcinoma','Behçet ulcer'],a:0,e:'Aphthous ulcers: most common nontraumatic oral ulceration; etiology unclear; diagnosis of exclusion based on appearance and course.',s:'Slide 19'},
 {q:'Compare leukoplakia and erythroplakia:',c:['Leukoplakia: white plaque that can\'t be scraped off, 5-20% malignant potential (hyperkeratosis, atypia). Erythroplakia: red velvety patch, 60-90% malignant potential, surgical excision','Both scrape off','Leukoplakia has the higher malignant potential','Erythroplakia is always benign'],a:0,e:'Objective: compare/contrast. Leukoplakia: white, not scrapable, 5-20% malignant, hyperkeratosis + atypia. Erythroplakia: red soft velvety, 60-90% malignant, excise.',s:'Slides 20-21'},
 {q:'Which oral lesion carries the HIGHER malignant potential?',c:['Erythroplakia','Leukoplakia','Aphthous ulcer','Thrush'],a:0,e:'Erythroplakia (60-90%) &gt; leukoplakia (5-20%).',s:'Slides 20-21'},
 {q:'On Dr. Strabbing\'s oral cancer list, basal cell carcinoma is more common on the:',c:['Upper lip','Lower lip','Tongue','Floor of mouth'],a:0,e:'Types: SCC; basal cell (more common on upper lip); verrucous (SCC variant); salivary malignancy; lymphoma; sarcomas; melanoma.',s:'Slide 23'},
 {q:'Verrucous carcinoma is:',c:['A variant of squamous cell carcinoma','A salivary gland tumor','A melanoma variant','A lymphoma'],a:0,e:'"Verrucous carcinoma: variant of squamous cell carcinoma."',s:'Slide 23'},
 {q:'Burning mouth syndrome\'s three major features:',c:['Intense oral pain, altered taste, xerostomia','White plaques, fever, adenopathy','Ulcers, uveitis, genital ulcers','Bleeding gums, petechiae, fatigue'],a:0,e:'Burning mouth syndrome: intense oral pain, altered taste, xerostomia.',s:'Slide 24'},
]);
addN('4.17',[
 {h:'Oral lesion differential',b:'<b>Infection</b>: HSV, actinomycosis, CMV, VZV, Coxsackie, syphilis, candidiasis, cryptosporidium, histoplasma (fungal usually immunocompromised).<br><b>Autoimmune</b>: Behçet\'s, lupus (SLE, discoid), Crohn\'s, pemphigoid (bullous, cicatricial; pemphigus vulgaris), lichen planus, aphthous, erythema multiforme (minor, SJS), Kawasaki.<br><b>Other</b>: neoplasm; trauma (necrotizing sialometaplasia); malnourishment (B vitamins, C, iron, folate).<br>Most likely: aphthous, HSV, trauma, malignancy. Less likely: VZV, autoimmune, fungal, malnourishment. Must rule out: malignancy, immunosuppression, bacterial/fungal, some autoimmune.',s:'Slides 3-6, 18'},
 {h:'HSV + VZV',b:'<b>HSV</b>: contact with body fluids, incubation ~7 d, then dormant. Primary gingivostomatitis: many small vesicles → rupture in 24 h → ulcers heal 7-14 d; fever, arthralgia, malaise, HA, cervical LAD; most infectious at rupture. Reactivation (UV, stress, infection, immunosuppression): prodrome tingling/burning; lips\' mucocutaneous junction, hard palate, attached gingiva. Dx: fluid from <b>unruptured</b> vesicle, <b>PCR</b> &gt; culture. Tx: supportive; valacyclovir/famciclovir (DNA polymerase; control not cure, 1 wk); acyclovir 5% cream in prodrome.<br><b>VZV</b>: chickenpox → shingles; buccal mucosa + hard palate, look like aphthae; most common dermatome V3; vaccine; severe → valacyclovir/famciclovir.',s:'Slides 7-12'},
 {h:'Candidiasis',b:'Normal flora; infects with immunocompromise, oral trauma, antibiotics. <b>Pseudomembranous (thrush)</b> most common: white plaque scrapes off → beefy red base. <b>Atrophic</b>: erythematous patch, lateral tongue. <b>Angular cheilitis</b>: commissure (poor closure, dentures). Scrapings: pseudohyphae + hyphae + yeast. Tx: mild acute nystatin; mild chronic + clotrimazole troche; refractory/immunocompromised nystatin + oral fluconazole; systemic amphotericin B ± fluconazole.',s:'Slides 13-17'},
 {h:'Aphthae, premalignant lesions, cancer, burning mouth',b:'<b>Aphthous</b>: most common nontraumatic ulcer; diagnosis of exclusion.<br><b>Leukoplakia</b>: white, NOT scrapable, 5-20% malignant; hyperkeratosis + atypia. <b>Erythroplakia</b>: red velvety, 60-90% malignant; excise.<br><b>Oral cancer</b>: 30% of H&amp;N cancers; non-healing ulcer, pain, trismus, dysphagia. Types: SCC, basal cell (upper lip), verrucous (SCC variant), salivary, lymphoma, sarcoma, melanoma.<br><b>Burning mouth</b>: intense pain, altered taste, xerostomia.',s:'Slides 19-24'},
]);

// ===== 4.15 Oral Health Articles #1-4 (required readings, "will be tested on") =====
// A1 = Hopkins et al, Oral Health and CVD (Am J Med 2024); A2 = Park et al, Korea cohort (Eur Heart J 2019);
// A3 = Herrera et al, EFP-WONCA consensus summary (Eur J Gen Pract 2024); A4 = Stephens et al, Dental Problems in Primary Care (AFP 2018)
addQ('4.15',[
 {q:'Periodontitis is best defined as:',c:['A chronic, bacterially induced inflammatory disease destroying the tooth-supporting apparatus (connective tissue, alveolar bone), with periodontal pockets and bleeding on probing','Inflammation limited to the gums that never affects bone','A viral infection of the dental pulp','Tooth enamel erosion from acid'],a:0,e:'A3: chronic inflammatory NCD with destruction of the periodontium incl. alveolar bone, pockets, bleeding on probing. A1: bacterially induced inflammatory disease destroying connective tissue and bone supporting the teeth (about half of US adults have mild-moderate disease).',s:'A3 abstract; A1 p304'},
 {q:'Per the EFP-WONCA consensus, periodontitis is INDEPENDENTLY associated with which conditions?',c:['Cardiovascular disease, diabetes, COPD, obstructive sleep apnea, and COVID-19 complications','Asthma, cystic fibrosis, sarcoidosis','Only dental caries','Hypothyroidism and gout'],a:0,e:'A3: periodontitis is independently associated with CVD, diabetes, COPD, OSA and COVID-19 complications; periodontal treatment has been associated with improved systemic outcomes.',s:'A3 abstract'},
 {q:'What does the EFP-WONCA consensus recommend for family doctors and oral health professionals?',c:['Collaborate: early case detection of periodontitis in primary medical care and of systemic NCDs in dental settings','Family doctors should avoid discussing oral health','Dentists should manage diabetes alone','Only periodontists should screen for CVD'],a:0,e:'A3: closer collaboration between OHPs and family doctors; early case detection of periodontitis in primary care and of NCDs in dental care; raise awareness among family doctors; share evidence with funders, patients, public.',s:'A3 abstract/conclusion'},
 {q:'Per the consensus plain-language summary, optimal periodontal treatment improves:',c:['Diabetes outcomes and surrogate measures of cardiovascular risk','Hard CV endpoints like MI in large RCTs','Asthma control','Hearing'],a:0,e:'A3: periodontal treatment improves diabetes outcomes and surrogate CV risk measures. A1: no well-powered studies show effects on hard CV endpoints.',s:'A3 summary; A1 p306'},
 {q:'Which oral bacteria are proposed to link periodontitis and CVD by activating platelets (local thrombus, pro-inflammatory cytokines)?',c:['Streptococcus mutans and Streptococcus sanguinis','Pseudomonas and Staph aureus','Candida albicans','Moraxella catarrhalis'],a:0,e:'A1 pathophysiology: platelet activation by S. mutans and S. sanguinis → localized thrombus and pro-inflammatory cytokines → inflammation, atherogenesis, thrombogenesis; plus systemic inflammation (IL-1, IL-6, TNF-α, CRP).',s:'A1 p304'},
 {q:'Which systemic inflammatory mediators are associated with both periodontitis and increased CV risk?',c:['IL-1, IL-6, TNF-α and C-reactive protein','IgE and histamine','Leptin and ghrelin only','Insulin and glucagon only'],a:0,e:'A1: elevated IL-1, IL-6, TNF-α and CRP; CRP downregulates nitric oxide → endothelial apoptosis; TNF promotes pulmonary vein arrhythmogenicity and abnormal Ca handling (AF).',s:'A1 p304-305'},
 {q:'How might periodontitis contribute to hypertension per Article 1?',c:['Systemic mediators (CRP, IL-6) impair endothelial function and primed immune cells are recruited to perivascular tissue; BP improves after periodontal therapy in cohorts','Direct bacterial invasion of the kidney','Salt in plaque','It does not; no association exists'],a:0,e:'A1: periodontitis ↔ CRP/IL-6 → endothelial dysfunction; primed immune cells → perivascular recruitment → HTN and atherosclerosis; prospective cohorts show BP improvement after periodontal therapy.',s:'A1 p305'},
 {q:'Which finding links periodontitis to atrial fibrillation in Article 1?',c:['Higher AF risk in periodontitis patients (persisting after adjustment) and AF associated with plaque, bleeding on probing and periodontal inflamed surface area','AF causes periodontitis directly','No relationship found','Only seen in children'],a:0,e:'A1: periodontitis associated with higher AF risk after adjustment; AF associated with plaque, BOP, periodontal inflamed surface area; atria infiltrated by inflammatory cells; ↑CRP, TNF-α, IL-6.',s:'A1 p305'},
 {q:'Evidence that periodontitis contributes to atherosclerosis includes:',c:['Periodontopathic/oral bacteria found in atherosclerotic plaques, S. mutans prevalent in thrombus tissue, and improved flow-mediated dilation after periodontal treatment','Absence of bacteria in plaques','Periodontal therapy worsening endothelial function','Only animal data'],a:0,e:'A1: oral bacteria found in most atherosclerotic plaque specimens; S. mutans most prevalent in thrombus specimens; Tonetti: improved FMD 6 months after periodontal treatment in CAD patients.',s:'A1 p305'},
 {q:'The relationship between periodontitis and type 2 diabetes is described as:',c:['Bidirectional: diabetics more likely to develop periodontitis, and periodontitis worsens glycemic control; treating periodontitis lowers HbA1c','Unidirectional from diabetes only','Nonexistent','Protective'],a:0,e:'A1: causal relationship with T2DM well established and bidirectional; RCTs show periodontal treatment improves glycemic control (↓HbA1c); oxidative stress is a major shared link.',s:'A1 p305-306'},
 {q:'Periodontitis and hyperlipidemia per Article 1:',c:['Bidirectional; hyperlipidemia dysregulates immunity (WBC hyperactivity, oxygen radicals) and intensive periodontal therapy lowered total and LDL cholesterol','No relationship','Statins cause periodontitis','Only triglycerides are affected and never improve'],a:0,e:'A1: bidirectional; periodontitis patients have higher cholesterol/TG; hyperlipidemia → WBC hyperactivity, oxygen radicals; periodontitis cytokines ↑HPA axis (cortisol, glucagon); 2 months of intensive periodontal therapy ↓total and LDL cholesterol.',s:'A1 p306'},
 {q:'What does Article 1 conclude about periodontal therapy and HARD cardiovascular endpoints (MI, stroke, CV death)?',c:['No well-powered studies have shown an effect yet; therapy may improve the CV risk profile','Proven to reduce MI by half','Proven to increase stroke','Irrelevant to CV risk'],a:0,e:'A1 management: no well-powered studies on hard endpoints; associations suggest improved risk profile; dose-response between periodontitis severity and CV risk (Taiwan); daily brushing and regular cleaning linked to lower risk.',s:'A1 p306'},
 {q:'In the Korean nationwide cohort (Article 2), which oral health problems were associated with HIGHER cardiovascular event risk?',c:['Periodontal disease, more dental caries, and more tooth loss','Only gingival recession','Only orthodontic braces','None'],a:0,e:'A2: in ~248,000 healthy adults ≥40 y (median 9.5 y follow-up), periodontal disease, more caries and more tooth loss were associated with more major CV events (cardiac death, MI, stroke, heart failure).',s:'A2 abstract'},
 {q:'Which oral hygiene behaviors were associated with LOWER cardiovascular risk in the Korean cohort?',c:['More frequent daily tooth brushing and regular (≥ yearly) dental visits for professional cleaning','Mouthwash only','Avoiding dentists','Brushing once a week'],a:0,e:'A2: each additional daily brushing and regular professional cleaning (once a year or more) were each associated with significantly lower CV risk after adjustment; improved hygiene attenuated risk from periodontal disease and caries.',s:'A2 abstract'},
 {q:'Per Article 2, how much lower was CV risk with one more daily tooth brushing and with yearly professional cleaning?',c:['About 9% and 14% lower, respectively','About 50% and 75%','About 1% and 2%','No difference'],a:0,e:'A2 (also quoted in A1): one more brushing per day → 9% lower risk; regular professional cleaning ≥ yearly → 14% lower risk; brushing ≥3×/day vs ≤1×/day ~19% lower.',ly:1,s:'A2 abstract, discussion; A1 p306'},
 {q:'In the Korean study, improved oral hygiene modified the CV risk associated with which oral conditions, and why not the other?',c:['Periodontal disease and dental caries (reflect current, partly reversible inflammatory burden), but NOT tooth loss (irreversible result of past infection)','Tooth loss only','All three equally','None'],a:0,e:'A2: interaction limited to periodontal disease and caries, not tooth loss. Tooth loss reflects past severe infection (irreversible) → importance of EARLY intervention before disease develops.',s:'A2 discussion'},
 {q:'Per Article 2, after multivariable adjustment the association between periodontal disease and CV events:',c:['Lost statistical significance (age, HTN, diabetes, smoking were strong confounders), while caries and tooth loss remained significant','Became stronger','Was unchanged','Reversed'],a:0,e:'A2 discussion: periodontal disease–CV association lost significance after adjustment (shared risk factors); caries and tooth loss remained significant. AHA: causal evidence is weak.',s:'A2 discussion'},
 {q:'Proposed mechanisms by which good oral hygiene may lower CV risk (Article 2):',c:['Less chronic inflammation (lower CRP/interleukins), modification of risk factors like diabetes and dyslipidemia, and altered oral microbiota','Lower salt intake','Better sleep','Reduced cholesterol absorption from toothpaste'],a:0,e:'A2: ↓inflammation (CRP, interleukins; cf. IL-1β/canakinumab), modification of diabetes/dyslipidemia, altered oral microbiota (oral bacteria found in plaques).',s:'A2 discussion'},
 {q:'Why did systemic antibiotic trials (e.g., against Chlamydia) fail to show CV benefit, per Article 2?',c:['Systemic antibiotics may prevent bacteremia but don\'t fix chronic periodontitis, where bacteria live in a biofilm','Antibiotics cause MI','They were never given','Because periodontitis is viral'],a:0,e:'A2: systemic antibiotics are not expected to ameliorate biofilm-based chronic periodontitis.',s:'A2 discussion'},
 {q:'Professional dental cleaning differs from tooth brushing because it:',c:['Removes mineralized plaque (tartar) by supragingival scaling/professional mechanical plaque removal','Only whitens teeth','Removes enamel','Is the same thing'],a:0,e:'A2 introduction: brushing removes soft deposits; professional cleaning (scaling) by a dentist/hygienist removes mineralized plaque (tartar). Guidelines: brush ≥2×/day and regular professional cleaning.',s:'A2 introduction'},
 {q:'Per AFP Article 4, what is the most common chronic disease worldwide, and what is the most common chronic condition in American children?',c:['Dental caries; early childhood caries','Asthma; obesity','Periodontitis; asthma','Gingivitis; ADHD'],a:0,e:'A4: dental caries = most common chronic disease worldwide; early childhood caries = most common chronic condition in American children.',s:'A4 p655'},
 {q:'Which organism is primarily responsible for dental caries?',c:['Streptococcus mutans (acid production in biofilm, fueled by sugar)','Porphyromonas only','Candida','Actinomyces israelii'],a:0,e:'A4: acid from oral bacteria (primarily S. mutans) in the adherent biofilm; sugar → acidic environment → polymicrobial biofilm damaging the tooth.',s:'A4 p655'},
 {q:'Early childhood caries is defined as:',c:['At least one decayed (cavitated or noncavitated) lesion, or a missing/filled tooth due to caries, in a child younger than 6','Any tooth decay before age 12','Decay of permanent molars','Gum bleeding in toddlers'],a:0,e:'A4 definition: ≥1 decayed lesion and a missing or filled tooth (due to caries) in a child &lt;6 y. Risk: bottles of milk, formula or juice after teeth erupt. First sign: opaque white spots → cavitation.',s:'A4 p655-656'},
 {q:'How do prescription drugs that reduce saliva increase caries risk in adults?',c:['Saliva remineralizes teeth, reduces bacteria and neutralizes acid; less saliva → more enamel erosion/caries','Saliva causes caries','They add sugar','They kill S. mutans'],a:0,e:'A4: saliva remineralizes, reduces bacteria, raises pH. Dry-mouth drugs: SSRIs/TCAs, antihistamines, antihypertensives, antipsychotics, cannabinoids, decongestants, diuretics, muscle relaxants, opioids, protease inhibitors, PPIs, ADHD stimulants.',s:'A4 p656, Table 2'},
 {q:'Which medication class is associated with GINGIVAL HYPERPLASIA in the AFP table?',c:['Calcium channel blockers (also immunosuppressants, phenytoin)','PPIs','Opioids','Diuretics'],a:0,e:'A4 Table 2: gingival hyperplasia → CCBs, immunosuppressive agents, phenytoin. Stomatitis → chemotherapy, immunosuppressants, inhaled corticosteroids. Sugar-containing → antacids, cough syrups/drops, vitamins.',s:'A4 Table 2'},
 {q:'A patient has transient tooth pain with hot/cold drinks that resolves spontaneously. Diagnosis and treatment?',c:['Reversible pulpitis; remove caries and place a filling','Irreversible pulpitis; root canal','Dental abscess; I&amp;D','Pericoronitis; irrigation'],a:0,e:'A4: reversible pulpitis (hot/cold sensitivity, transient) → filling. Irreversible pulpitis (persistent, poorly localized pain) → root canal or extraction. Apical periodontitis → severe localized pain; abscess → I&amp;D.',s:'A4 p656, Table 1'},
 {q:'Treatment of choice for a dental abscess:',c:['Incision and drainage (root canal or extraction may follow)','Oral antibiotics alone','Observation','Topical steroid'],a:0,e:'A4: "Incision and drainage is the preferred treatment for dental abscess." Pain: NSAIDs, acetaminophen, judicious opioids. Antibiotics if cellulitis/extraoral manifestations pending specialist.',s:'A4 p656, Table 1'},
 {q:'A dental infection with fever and regional lymphadenopathy suggests:',c:['Progressing infection that can spread through head and neck fascial planes; true emergency if airway compromised; antibiotics if cellulitis/extraoral signs','A simple cavity','Gingivitis','Normal teething'],a:0,e:'A4: fever + regional LAD = progressing infection (fascial planes); airway compromise → emergency. Antibiotics (amoxicillin, amox/clav, clindamycin, penicillin) pending specialist.',s:'A4 p657, Table 3'},
 {q:'Which is a risk factor for periodontal disease per Article 4?',c:['Smoking, diabetes, HIV infection, certain medications, genetic susceptibility','Fluoride use','Regular flossing','Young age'],a:0,e:'A4: risk factors smoking, diabetes, HIV, certain medications, genetics. Nearly half of US adults have periodontal disease; associated with diabetes, CVD, adverse pregnancy outcomes, ischemic vascular disease.',s:'A4 p657'},
 {q:'A patient has swollen, red gums that bleed easily with brushing; no bone loss. Diagnosis and management?',c:['Gingivitis; reversible with regular dental cleaning, proper brushing and flossing (± chlorhexidine rinse)','Periodontitis; extraction','Pericoronitis; antibiotics','Leukoplakia; biopsy'],a:0,e:'A4: gingivitis = gum inflammation, bleeds with brushing/flossing; prevented or reversed with cleaning, brushing, flossing; chlorhexidine (Peridex) helps reverse. Periodontitis = progression to the periodontal ligament ± alveolar bone.',s:'A4 p657'},
 {q:'Periodontitis is most common in which group, and how is it treated?',c:['Men 30-50 years; scaling and root planing (± chlorhexidine and antibiotics for chronic disease)','Children; fluoride','Elderly women; extraction only','Teens; braces'],a:0,e:'A4: most common in men 30-50; halitosis, red swollen bleeding gums, pain with eating, loose/sensitive teeth; treat with scaling and root planing; chlorhexidine + antibiotics an option for chronic disease.',s:'A4 p657'},
 {q:'Pericoronitis is:',c:['A localized infection within a gingival flap over a partially erupted or impacted wisdom tooth; treat by removing trapped debris (chlorhexidine, dental referral if needed)','Inflammation of the tooth pulp','A fractured crown','Tooth avulsion'],a:0,e:'A4: pericoronitis = infection in a gingival flap over a partially erupted/impacted wisdom tooth; remove trapped debris/irrigation; antibiotics for concurrent cellulitis; chlorhexidine and dental referral if conservative measures fail.',s:'A4 p657, Table 1'},
 {q:'Ellis classification: a fractured tooth with hot/cold sensitivity and exposed yellowish dentin but no pulp is:',c:['Class 2: urgent dental assessment','Class 1: no urgent evaluation','Class 3: urgent root canal','Not a fracture'],a:0,e:'A4: Class 1 = enamel only, not urgent. Class 2 = extends to dentin, hot/cold sensitivity → urgent dental assessment. Class 3 = exposed pulp → urgent root canal. All fractures need imaging and dental co-management.',s:'A4 p658, Figure 7'},
 {q:'An Ellis class 3 dental fracture involves:',c:['Exposed pulp; requires urgent root canal','Enamel only','Dentin only','The gums only'],a:0,e:'Class 3 injuries have exposed pulp and require an urgent root canal.',s:'A4 p658'},
 {q:'A tooth that is tender to percussion after trauma with no displacement, fracture or mobility is a:',c:['Dental concussion: pain control, soft diet, dental referral','Intrusive luxation: oral surgeon now','Avulsion: reimplant','Lateral luxation: splint immediately'],a:0,e:'A4: concussion = trauma without displacement, tender to percussion; pain control, soft diet, referral. Subluxation (mobile, not dislodged) managed the same.',s:'A4 p658'},
 {q:'Which luxation injury "jams" the tooth into the socket and needs immediate oral and maxillofacial surgery evaluation?',c:['Intrusive luxation','Subluxation','Extrusive luxation','Concussion'],a:0,e:'A4: intrusive luxation (associated alveolar fracture) → immediate OMFS. Lateral luxation (alveolar bone fracture) → immediate splinting. Extrusive luxation (partial avulsion) → dental evaluation within 24 h.',s:'A4 p658-659'},
 {q:'An extrusive luxation (partial avulsion) should have dental evaluation within:',c:['24 hours','1 week','1 month','Only if painful'],a:0,e:'A4: extrusive luxation → dental evaluation within 24 hours.',s:'A4 p658'},
 {q:'A teenager knocks out a PERMANENT incisor 10 minutes ago. Best management?',c:['Immediate reimplantation: handle by the crown, rinse briefly in cold water, reposition, bite on a washcloth; if not possible, store in pasteurized milk and seek immediate dental care','Scrub the root clean and save for a dentist next week','Store dry in a tissue','Discard; avulsed teeth cannot be saved'],a:0,e:'A4: immediate reimplantation is preferred for avulsed permanent teeth; after one hour periodontal ligament cells become nonviable. Handle by crown only; brief cold water rinse; reposition; washcloth bite; else pasteurized milk + immediate dental care.',s:'A4 p659'},
 {q:'Why is timing critical for reimplanting an avulsed permanent tooth?',c:['After about one hour, periodontal ligament cells become nonviable and reimplantation likely fails','Enamel dissolves in air after 5 minutes','The pulp regrows','Bacteria cannot reach the socket'],a:0,e:'A4: after 1 hour PDL cells are nonviable.',s:'A4 p659'},
 {q:'Recommended storage medium for an avulsed tooth when immediate reimplantation is not feasible:',c:['Pasteurized milk','Tap water for several hours','Dry gauze','Alcohol'],a:0,e:'A4: place in pasteurized milk (clinically recommended) and seek immediate dental care.',s:'A4 p659'},
 {q:'Fluoride varnish recommendation per Article 4:',c:['Apply when the first primary tooth erupts, then twice yearly in all infants and young children','Only after age 6','Once in a lifetime','Only for adults with caries'],a:0,e:'A4 (SORT B): fluoride varnish at first tooth eruption, then twice yearly. Fluoride supplements from 6 months if water source is fluoride deficient (SORT B).',s:'A4 p659, SORT'},
 {q:'When should fluoride supplements be prescribed for children?',c:['Beginning at 6 months of age if the primary water source is fluoride-deficient','At birth for all infants','Never; only toothpaste','Only after permanent teeth erupt'],a:0,e:'A4: fluoride supplements from 6 months if water is fluoride deficient.',s:'A4 p659'},
 {q:'Correct amount of fluoride toothpaste by age per Article 4:',c:['&lt;2 years: a smear of low-fluoride toothpaste; 2-5 years: pea-sized amount','No toothpaste before age 6','Full brush-length at all ages','Pea-sized from birth'],a:0,e:'A4: under 2 → smear of low-fluoride toothpaste; 2-5 → pea-sized fluoride toothpaste; adults help young children clean. Other measures: professional topical fluoride, pit/fissure sealants.',s:'A4 p659'},
 {q:'Per Article 4, where can primary care physicians have the GREATEST impact on oral health?',c:['Prevention: counseling on diet, oral hygiene, smoking cessation, fluoride; fluoride varnish; screening; oral exam at every wellness visit','Performing root canals','Extracting teeth','Prescribing antibiotics for all toothaches'],a:0,e:'A4: prevention is where primary care has the greatest impact; examine teeth, gums, mucosa at all child and adult wellness visits (incl. prenatal); partner with dental professionals.',s:'A4 p659, SORT'},
 {q:'A typical adult has how many permanent teeth, and a child how many primary teeth?',c:['32 permanent; 20 primary','28 permanent; 24 primary','32 permanent; 32 primary','20 permanent; 10 primary'],a:0,e:'A4: primary teeth erupt 6 months-2 years (20 total: per arch 4 incisors, 2 canines, 4 molars); permanent replacement begins ~6 y, done by ~18 y; 32 permanent (per arch 4 incisors, 2 canines, 4 premolars, 6 molars). Enamel is the hardest substance in the body.',s:'A4 p654'},
 {q:'What anchors a tooth root to the alveolar bone?',c:['Periodontal ligament (root covered by cementum)','Enamel','Pulp','Gingival epithelium only'],a:0,e:'A4 anatomy: crown enamel (hardest), dentin protecting pulp; root has pulp + dentin with outer cementum; held by periodontal ligaments fused to alveolar bone; vessels and nerves enter via apical foramen.',s:'A4 p654, Figure 1'},
]);
addN('4.15',[
 {h:'Article 3: EFP-WONCA consensus (Herrera 2024)',b:'Periodontitis = chronic inflammatory NCD destroying the periodontium (alveolar bone loss, pockets, bleeding on probing). <b>Independently associated with CVD, diabetes, COPD, OSA, COVID-19 complications.</b> Periodontal treatment improves diabetes outcomes and surrogate CV-risk measures. Family doctors + oral health professionals should collaborate: detect periodontitis in primary care and NCDs in dental care; raise awareness; share evidence with funders, patients, public.',s:'Article 3'},
 {h:'Article 1: Oral health and CVD (Hopkins 2024, Am J Med)',b:'Periodontitis = bacterially induced inflammation destroying tooth-supporting connective tissue + bone (~half of US adults mild-moderate).<br><b>Mechanisms</b>: platelet activation by <b>S. mutans and S. sanguinis</b> (thrombus, cytokines); systemic inflammation (IL-1, IL-6, TNF-α, CRP).<br><b>HTN</b>: CRP/IL-6 endothelial dysfunction, primed immune cells; BP improves after therapy.<br><b>AF</b>: ↑risk with periodontitis; plaque/BOP associations; atrial inflammation; CRP ↓NO; TNF → pulmonary vein arrhythmogenicity.<br><b>CAD</b>: worse dentition in MI; oral bacteria in plaques; S. mutans in thrombi; ↑FMD after treatment.<br><b>Diabetes</b>: bidirectional; treatment ↓HbA1c; oxidative stress link.<br><b>Lipids</b>: bidirectional; therapy ↓total/LDL.<br><b>Bottom line</b>: no well-powered data on hard endpoints (MI, stroke, CV death); therapy may improve risk profile; daily brushing + regular cleaning associated with lower risk.',s:'Article 1'},
 {h:'Article 2: Korean cohort (Park 2019, Eur Heart J)',b:'~248,000 healthy adults ≥40 y, median 9.5 y. Periodontal disease, more caries, more tooth loss → more CV events (cardiac death, MI, stroke, HF). <b>More daily brushing and ≥ yearly professional cleaning → lower CV risk</b> (≈9% per extra daily brushing; ≈14% with regular cleaning). Hygiene attenuated risk from periodontal disease and caries but NOT tooth loss (irreversible) → intervene early. Periodontal disease association lost significance after adjustment (age, HTN, DM, smoking confounders); caries and tooth loss remained. Mechanisms: ↓inflammation, risk-factor modification, oral microbiota. Systemic antibiotics fail (biofilm). Professional cleaning removes tartar.',s:'Article 2'},
 {h:'Article 4: Dental problems in primary care (AFP 2018)',b:'<b>Anatomy</b>: 20 primary (6 mo-2 y), 32 permanent (~6-18 y); enamel hardest; dentin, pulp; root cementum; periodontal ligament → alveolar bone.<br><b>Caries</b>: most common chronic disease worldwide; S. mutans acid in sugar-fed biofilm; <b>early childhood caries</b> most common chronic condition in US kids (&lt;6 y; bottles of milk/formula/juice; white spots → cavitation). Dry-mouth drugs ↑caries.<br><b>Pulp</b>: reversible pulpitis (transient hot/cold) → filling; irreversible (persistent) → root canal/extraction; abscess → <b>I&amp;D</b>; fever + LAD = spreading infection; antibiotics (amoxicillin, amox/clav, clindamycin, penicillin) if cellulitis.<br><b>Periodontal</b>: ~half of adults; risks smoking, DM, HIV, meds, genetics. Gingivitis (red, swollen, bleeds) reversible with cleaning/brushing/flossing, chlorhexidine. Periodontitis (men 30-50; halitosis, loose teeth) → scaling + root planing. Pericoronitis (flap over partially erupted wisdom tooth) → remove debris.<br><b>Drugs</b>: gingival hyperplasia = CCBs, immunosuppressants, phenytoin.<br><b>Trauma</b>: Ellis 1 enamel (not urgent), 2 dentin + hot/cold (urgent dental), 3 pulp (urgent root canal); image all fractures. Concussion/subluxation: analgesia, soft diet, referral. Extrusive → dentist within 24 h. Lateral → immediate splint. Intrusive → immediate OMFS. <b>Avulsed permanent tooth → immediate reimplantation</b> (crown only, brief cold rinse, washcloth bite); PDL dies after ~1 h; else pasteurized milk.<br><b>Prevention</b>: fluoride varnish at first tooth then twice yearly; supplements from 6 mo if water deficient; smear toothpaste &lt;2 y, pea-sized 2-5 y; sealants; oral exam at all wellness visits.',s:'Article 4'},
]);

// ===== 4.18 Kelly - Sleep Disordered Breathing =====
addQ('4.18',[
 {q:'Which two components govern the quality/duration of sleep and alertness?',c:['The circadian system (~24.2-hour oscillation, tau) and sleep homeostasis (sleep pressure)','REM and NREM only','Melatonin and cortisol only','The pons and thalamus only'],a:0,e:'Circadian system: one oscillation every ~24.2 h (tau), independent of the sleep-wake cycle, cued by light/eating times. Sleep homeostasis: pressure builds with time awake, falls after sufficient sleep.',s:'Slide 5'},
 {q:'The master circadian rhythm generator is the:',c:['Suprachiasmatic nucleus of the anterior hypothalamus (receives retinal light input)','Pineal gland','Pons','Thalamus'],a:0,e:'SCN in the anterior hypothalamus = biological clock; receives light signals from the retina. Pineal gland secretes melatonin at night (inhibited by blue light).',s:'Slide 6'},
 {q:'Melatonin secretion from the pineal gland is inhibited by:',c:['Blue light exposure','Darkness','Caffeine','REM sleep'],a:0,e:'Pineal gland secretes melatonin at night for sleep onset; inhibited by blue light.',s:'Slide 6'},
 {q:'Which brain structure initiates REM sleep and sends inhibitory signals down the spinal cord causing atonia?',c:['Pons','Thalamus','Suprachiasmatic nucleus','Pineal gland'],a:0,e:'Pons: initiates REM, signals visual thalamic nuclei and cortex, sends inhibitory signals down the cord → temporary skeletal muscle atonia. Thalamus generates many NREM EEG rhythms.',s:'Slide 7'},
 {q:'Which NREM stage is deep sleep with slow EEG waves and difficult awakening?',c:['Stage 3','Stage 1','Stage 2','REM'],a:0,e:'Stage 1: sleep onset, slow rolling eye movements. Stage 2: easy awakening. Stage 3: deep, slow waves, hard to awaken.',s:'Slide 8'},
 {q:'During REM sleep, which muscles are spared from atonia?',c:['Heart, diaphragm, extraocular and smooth muscle','Accessory muscles of respiration','All skeletal muscle including the diaphragm','Pharyngeal dilators only'],a:0,e:'REM atonia affects skeletal muscles including accessory respiratory muscles; heart, diaphragm, extraocular and smooth muscle preserved.',s:'Slide 9'},
 {q:'How do REM episodes change across the night (per the hypnogram)?',c:['REM episodes get longer as the night progresses','REM is longest at sleep onset','REM disappears after midnight','REM duration is constant'],a:0,e:'"Episodes of REM get longer as the night progresses."',s:'Slides 9-10'},
 {q:'During REM sleep, brain activity is:',c:['At least as active as when awake','Minimal','Absent','Only in the thalamus'],a:0,e:'Sleep is an active, regulated process; during REM the brain is at least as active as when awake.',s:'Slide 3'},
 {q:'An APNEA is defined as:',c:['Cessation of airflow by ≥90% for more than 10 seconds','Decrease in airflow by ≥50%','Any snoring','Oxygen desaturation of 4%'],a:0,e:'Apnea: ≥90% airflow reduction for &gt;10 s. Hypopnea: ≥50% decrease or any decrease causing an arousal.',s:'Slide 14'},
 {q:'A HYPOPNEA is defined as:',c:['Decrease in airflow by ≥50%, or any decrease in airflow that causes an arousal','Complete cessation for 10 s','An effort-related arousal without airflow change','Any O2 saturation &lt;90%'],a:0,e:'Hypopnea: ≥50% decrease in airflow or any decrease that causes an arousal.',s:'Slide 14'},
 {q:'A PSG shows an AHI of 22 events/hour. Severity?',c:['Moderate sleep-disordered breathing','Mild','Severe','Normal'],a:0,e:'AHI: normal 0-5; mild 5-15; moderate 15-30; severe &gt;30.',s:'Slide 15'},
 {q:'The Respiratory Disturbance Index (RDI) differs from the AHI by also counting:',c:['Respiratory effort-related arousals','Leg movements','Snoring episodes','Awakenings from noise'],a:0,e:'RDI = apneas + hypopneas + respiratory effort-related arousals per hour of sleep. AHI = apneas + hypopneas per hour.',s:'Slide 15'},
 {q:'Crescendo snoring with a NORMAL AHI, no change in alveolar ventilation and no significant desaturations describes:',c:['Upper airway resistance syndrome','Severe OSA','Central sleep apnea','Obesity hypoventilation'],a:0,e:'UARS: crescendo snoring, normal AHI, no ventilation change, no significant desaturation.',s:'Slide 16'},
 {q:'On polysomnography, an OBSTRUCTIVE apnea shows:',c:['Absent airflow while thoracic and abdominal respiratory effort continue','Absent airflow AND absent effort','Normal airflow with arousals','Crescendo-decrescendo breathing without pauses'],a:0,e:'OSA = respiratory effort against an obstructed airway: no air movement despite effort; possible desaturation; events more prominent in REM. CSA: no effort and no airflow.',s:'Slides 17-19'},
 {q:'On polysomnography, a CENTRAL apnea shows:',c:['Cessation of both airflow and respiratory effort (rib cage/abdomen flat)','Paradoxical effort without airflow','Normal effort with snoring','Airflow with absent effort'],a:0,e:'Central apnea: no airflow and no thoracoabdominal effort (onset of central apnea), followed by a marked increase in ventilation.',s:'Slides 19, 33'},
 {q:'OSA events are more prominent during which sleep stage, and CSA events during which?',c:['OSA in REM; CSA in NREM','OSA in NREM; CSA in REM','Both in REM','Both in NREM'],a:0,e:'OSA events more prominent in REM (atonia of accessory/upper airway muscles); CSA events more common in NREM.',s:'Slides 17, 34'},
 {q:'"Obstructive Sleep Apnea Syndrome" (OSAS) means:',c:['OSA occurring WITH symptoms, classically excessive daytime sleepiness','Any OSA on PSG regardless of symptoms','Central apnea with obesity','Snoring without apneas'],a:0,e:'Not all OSA patients have symptoms; OSAS = OSA plus symptoms (classically EDS). Common and underdiagnosed; prevalence rises with age; daytime symptoms and multisystem dysfunction.',s:'Slide 20'},
 {q:'Which is a listed risk factor for OSA?',c:['Retrognathia or micrognathia','Underweight','Tall stature','Female sex before menopause'],a:0,e:'Risk factors: BMI &gt;30, weight gain, ↑neck circumference, (male) gender, ethnicity (greatest in Black, Hispanic, Asian populations), upper airway/craniofacial disorders (retrognathia, micrognathia), CHF, diabetes, CKD, CVA, hypothyroidism, alcohol/sedatives.',s:'Slide 22'},
 {q:'Which comorbidity is listed as a risk factor for OSA?',c:['Hypothyroidism','Asthma','Hypertension medications only','Anemia'],a:0,e:'Comorbidities listed: CHF, diabetes, CKD, CVA, hypothyroidism.',s:'Slide 22'},
 {q:'STOP-BANG: how many points suggest OSA risk warranting sleep clinic referral?',c:['3 or more','1 or more','5 or more','All 8'],a:0,e:'One point each; ≥3 suggests risk for OSA → referral to sleep clinic.',s:'Slide 23'},
 {q:'Which item is part of STOP-BANG?',c:['Neck circumference: shirt collar &gt;17 in (43 cm) males, &gt;16 in (41 cm) females','Mallampati score','Epworth score &gt;10','Nocturia'],a:0,e:'STOP-BANG: Snoring loudly, Tired/sleepy, Observed stop breathing/choking, Pressure (treated HTN), BMI &gt;35, Age &gt;50, Neck collar &gt;17 in M / &gt;16 in F, Gender male.',s:'Slide 23'},
 {q:'In STOP-BANG, the BMI and age thresholds are:',c:['BMI &gt;35 kg/m²; age &gt;50 years','BMI &gt;30; age &gt;40','BMI &gt;25; age &gt;65','BMI &gt;40; age &gt;60'],a:0,e:'BMI &gt;35 and age &gt;50 (note the risk-factor slide lists BMI &gt;30 as a general OSA risk factor).',s:'Slides 22-23'},
 {q:'Which symptom is typical of OSAS?',c:['Morning headache, waking unrefreshed, nocturia, morning dry mouth','Cataplexy','Hypnagogic hallucinations only','Leg crawling sensations'],a:0,e:'OSAS symptoms: EDS, waking unrefreshed, morning headache, irritability/depression, cognitive impairment, ↓libido, morning dry mouth, nocturia or enuresis.',s:'Slide 24'},
 {q:'Epworth Sleepiness Scale: normal and upper limit of normal?',c:['Normal ≤6; upper limit of normal ≤10 (OSAS average ~16)','Normal ≤15','Normal ≤2; abnormal &gt;3','Normal ≥10'],a:0,e:'ESS: normal ≤6, ULN ≤10, OSAS average 16. Rates chance of dozing (0-3) in 8 situations.',s:'Slide 25'},
 {q:'Which history question is especially helpful in suspected OSA?',c:['"Have you ever been told that you stop breathing when you sleep?" (bed partner input)','"Do your legs feel restless?"','"Do you fall asleep when laughing?"','"Do you have fevers?"'],a:0,e:'Additional history: witnessed apneas, loud disruptive snoring (bed partner), and history of hypertension, CHF or atrial fibrillation.',s:'Slide 26'},
 {q:'Which physical exam finding suggests OSA?',c:['Low soft palate (Mallampati 3-4), large uvula, large neck circumference','Clubbing','Wheezing','Small tongue with high palate (Mallampati 1)'],a:0,e:'Exam: BMI, neck circumference, large uvula, low soft palate (Mallampati 3-4), craniofacial abnormality, hypertension, lower extremity edema.',s:'Slide 27'},
 {q:'Gold standard for diagnosing OSA:',c:['Polysomnogram','History and physical','STOP-BANG','Epworth score'],a:0,e:'Diagnosis requires measuring obstructive breathing pattern and associated abnormalities; PSG is the gold standard; H&amp;P is insufficient.',s:'Slide 28'},
 {q:'Pathophysiology of end-organ damage in OSAS:',c:['Repeated apnea/hypopnea → intermittent desaturation → oxidative stress and ischemia-reperfusion injury (sympathetic activation, endothelial dysfunction)','Chronic hypercapnia only','Allergic inflammation','Viral myocarditis'],a:0,e:'Repeated apneas/hypopneas → frequent desaturation, poor O<sub>2</sub> delivery → oxidative stress, ischemia-reperfusion injury; figure: sympathetic activation, systemic inflammation, insulin resistance, endothelial dysfunction → HTN, CAD, AF, stroke, etc.',s:'Slides 29-30'},
 {q:'Which is a MEDICAL treatment option for OSA on Dr. Kelly\'s slide?',c:['Positive airway pressure (CPAP/BiPAP), oral appliance, or GLP-1 agonist weight loss (tirzepatide)','Hypoglossal nerve stimulator','Bariatric surgery','Theophylline'],a:0,e:'Behavioral: weight loss, lifestyle/diet, avoid alcohol/sedatives/caffeine. Medical: PAP (CPAP/BiPAP), oral appliance, GLP-1 agonist (tirzepatide). Surgical: upper airway surgery, hypoglossal nerve stimulation, bariatric surgery.',s:'Slide 31'},
 {q:'Which is a SURGICAL treatment option for OSA on the slide?',c:['Hypoglossal nerve stimulation device','Oral appliance','CPAP','Tirzepatide'],a:0,e:'Surgical: upper airway surgery, hypoglossal nerve stimulation, bariatric surgery.',s:'Slide 31'},
 {q:'Compared with OSA, central sleep apnea patients:',c:['Snore less prominently and are less likely to be obese; risk factors CHF, neuromuscular disease, high altitude','Are more obese and snore louder','Never have daytime sleepiness','Have events mostly in REM'],a:0,e:'CSA: events in NREM; EDS and witnessed apneas; snoring less prominent; less obese. Risks: CHF, neuromuscular disease, ascent to altitude.',s:'Slide 34'},
 {q:'Treatment of central sleep apnea:',c:['Noninvasive ventilation with a set backup respiratory rate','CPAP alone always','Oral appliance','Hypoglossal stimulation'],a:0,e:'CSA treatment: noninvasive ventilation with a set backup respiratory rate.',s:'Slide 34'},
 {q:'Obesity hypoventilation syndrome ("Pickwickian") is defined by:',c:['Morbid obesity with chronic hypoventilation and daytime PaCO<sub>2</sub> &gt;45 mmHg without underlying lung disease','Daytime PaO<sub>2</sub> &lt;80','Nocturnal desaturations only','Obesity with asthma'],a:0,e:'OHS: morbid obesity + chronic hypoventilation with daytime hypercapnia (PaCO<sub>2</sub> &gt;45 during the day) without lung disease; OSAS present in the majority; treat with noninvasive ventilation.',s:'Slide 35'},
 {q:'Cheyne-Stokes respiration is:',c:['Cyclic crescendo-decrescendo breathing with recurrent apneas, driven by rising alveolar PCO<sub>2</sub>; mostly CHF, stroke or sedatives','Obstructive apneas with snoring','Rapid shallow breathing from acidosis','Normal REM breathing only'],a:0,e:'Cheyne-Stokes: crescendo-decrescendo with apneas; rise in alveolar PCO<sub>2</sub> drives resumed ventilation (delay at chemoreceptor); mostly CHF, central neurologic disease (stroke), sedatives; may occur in normal people.',s:'Slide 36'},
 {q:'Per the slide, which population has the greatest ethnic risk for OSA?',c:['Black, Hispanic and Asian populations','Only White populations','Only Native American','Ethnicity has no effect'],a:0,e:'"Ethnicity with greatest risk in Black, Hispanic and Asian populations."',s:'Slide 22'},
 {q:'Which other common sleep-related conditions are listed alongside sleep-disordered breathing?',c:['Insomnia, restless leg syndrome, narcolepsy, parasomnias','Asthma, COPD, bronchiectasis','GERD, IBS, migraine','Epilepsy only'],a:0,e:'Covered SDB: OSA, CSA, OHS, Cheyne-Stokes. Other conditions: insomnia, RLS, narcolepsy, parasomnias. More than 70 sleep disorders exist.',s:'Slide 13'},
]);
addN('4.18',[
 {h:'Sleep physiology',b:'Active, regulated; REM brain ≥ awake activity; small sleep losses matter. Functions: restoration, energy conservation, memory consolidation, predator protection, brain development, emotional discharge.<br><b>Circadian</b> (~24.2 h tau; light/meal cues) + <b>homeostatic sleep pressure</b>.<br><b>SCN</b> (anterior hypothalamus, retinal input) = master clock. <b>Pineal</b>: melatonin at night, inhibited by blue light. <b>Pons</b>: initiates REM, spinal inhibition → atonia. <b>Thalamus</b>: NREM EEG rhythms.<br>NREM 1 (rolling eyes) · 2 (easy waking) · 3 (deep, slow waves). REM: dreaming, atonia incl. accessory muscles; heart, diaphragm, EOM, smooth muscle spared; REM periods lengthen through the night.',s:'Slides 3-12'},
 {h:'Definitions + indices',b:'<b>Apnea</b>: ≥90% airflow drop &gt;10 s. <b>Hypopnea</b>: ≥50% drop or any drop causing arousal. <b>AHI</b> (apneas+hypopneas/h): normal 0-5, mild 5-15, moderate 15-30, severe &gt;30. <b>RDI</b> adds respiratory effort-related arousals.<br><b>UARS</b>: crescendo snoring, normal AHI, no ventilation change, no significant desaturations.<br>PSG: <b>OSA</b> = effort continues, no airflow (REM-predominant). <b>CSA</b> = no effort and no airflow (NREM-predominant).',s:'Slides 14-19, 33-34'},
 {h:'OSA syndrome: risk + evaluation',b:'OSAS = OSA + symptoms (EDS). Common, underdiagnosed, ↑with age.<br><b>Risks</b>: BMI &gt;30, weight gain, neck circumference, male, Black/Hispanic/Asian, retro/micrognathia, CHF, DM, CKD, CVA, hypothyroid, alcohol/sedatives.<br><b>STOP-BANG</b> (≥3 → sleep clinic): Snoring, Tired, Observed apnea, Pressure, BMI &gt;35, Age &gt;50, Neck &gt;17 in M / &gt;16 in F, Gender male.<br><b>Symptoms</b>: EDS, unrefreshed, morning headache, irritability/depression, cognitive impairment, ↓libido, dry mouth, nocturia/enuresis. <b>ESS</b>: normal ≤6, ULN ≤10, OSAS ~16. Ask about witnessed apneas, snoring (bed partner), HTN/CHF/AF. <b>Exam</b>: BMI, neck, large uvula, Mallampati 3-4, craniofacial, HTN, edema. <b>PSG = gold standard</b>.',s:'Slides 20-28'},
 {h:'OSA consequences + treatment',b:'Intermittent hypoxia → oxidative stress, ischemia-reperfusion; sympathetic activation, inflammation, endothelial dysfunction → cardiovascular, metabolic, neuro consequences.<br>Tx: <b>behavioral</b> (weight loss, avoid alcohol/sedatives/caffeine); <b>medical</b> (CPAP/BiPAP, oral appliance, tirzepatide GLP-1); <b>surgical</b> (upper airway surgery, hypoglossal nerve stimulation, bariatric).',s:'Slides 29-32'},
 {h:'CSA, OHS, Cheyne-Stokes',b:'<b>CSA</b>: NREM events; EDS, witnessed apneas; less snoring, less obese; CHF, neuromuscular disease, altitude; NIV with backup rate.<br><b>OHS (Pickwickian)</b>: morbid obesity + daytime PaCO<sub>2</sub> &gt;45 without lung disease; most have OSAS; NIV.<br><b>Cheyne-Stokes</b>: crescendo-decrescendo with apneas; rising P<sub>A</sub>CO<sub>2</sub> restarts breathing (chemoreceptor delay); CHF, stroke, sedatives; can be normal.',s:'Slides 34-36'},
]);

// ===== 4.20 Hughes Periorbital/Orbital Cellulitis · 4.08 Strabbing External Ear =====
addQ('4.20',[
 {q:'Which structure anatomically separates preseptal (periorbital) cellulitis from orbital cellulitis?',c:['The orbital septum (a fascial layer)','The lamina papyracea','The tarsal plate','The periosteum of the maxilla'],a:0,e:'Preseptal = tissues anterior to the orbital septum (anterior eyelid). Orbital = orbit contents posterior to the septum (fat, bone, ocular muscles). Neither involves the globe. Lamina papyracea separates ethmoids from orbit.',s:'Handout p1-2; slides 3, 10'},
 {q:'Which statement is TRUE for both preseptal and orbital cellulitis?',c:['Neither involves the globe itself','Both always require IV antibiotics','Both cause proptosis','Both are usually from hematogenous spread'],a:0,e:'"Neither infection involves the globe itself."',s:'Handout p2; slide 3'},
 {q:'Of infections in this periocular region, the large majority are:',c:['Preseptal only','Orbital','Cavernous sinus thrombosis','Subperiosteal abscess'],a:0,e:'About 90% of these infections are preseptal only.',s:'Handout p2; slide 3'},
 {q:'Who most commonly gets periorbital/orbital cellulitis?',c:['Preteens, boys more than girls in childhood','Elderly women only','Infants only','Adult women'],a:0,e:'Most commonly the young, primarily preteens; children more often male; no gender difference in adulthood; can occur from infants to elderly.',s:'Handout p2; slide 8'},
 {q:'Chandler classification: a patient has complete ophthalmoplegia, visual loss and marked proptosis. Which stage?',c:['Stage IV: orbital abscess','Stage II: orbital cellulitis','Stage III: subperiosteal abscess','Stage V: cavernous sinus thrombosis'],a:0,e:'I preseptal (lid edema); II orbital cellulitis (proptosis, chemosis, ↓EOM, possible vision loss); III subperiosteal abscess (proptosis, visual loss); IV orbital abscess (complete ophthalmoplegia, visual loss, marked proptosis); V cavernous sinus thrombosis (bilateral signs, vision loss, meningitis).',s:'Handout p2; slide 9'},
 {q:'Chandler stage V (cavernous sinus thrombosis) is distinguished by:',c:['Bilateral signs; may lead to vision loss and meningitis','Eyelid edema only','Unilateral proptosis only','Normal vision'],a:0,e:'Stage V: bilateral signs; may lead to loss of vision and meningitis.',s:'Handout p2; slide 9'},
 {q:'Chandler stage I is:',c:['Preseptal cellulitis: inflammatory edema of the eyelids','Orbital abscess','Subperiosteal abscess','Orbital cellulitis with proptosis'],a:0,e:'Stage I = preseptal cellulitis = inflammatory eyelid edema.',s:'Handout p2; slide 9'},
 {q:'Most orbital cellulitis spreads directly from which sinus, and why?',c:['Ethmoid sinus, through the thin, perforated lamina papyracea (vessel openings allow tracking)','Sphenoid sinus via the optic canal','Maxillary sinus via the nasolacrimal duct','Frontal sinus via the cribriform plate'],a:0,e:'Most orbital infections spread directly from the sinuses, most commonly the ethmoids just medial, separated by the lamina papyracea, which has holes for vessels. Frontal and maxillary sinuses also abut the orbit.',s:'Handout p2'},
 {q:'Per Dr. Hughes\' slides, what proportion of orbital cellulitis arises from sinusitis?',c:['About 90% (most)','About 10%','None','About half from bug bites'],a:0,e:'Orbital pathogenesis: sinusitis (90%); other: post-op, peribulbar anesthesia, dacryocystitis, orbital fracture with FB, hematogenous spread.',s:'Slide 13'},
 {q:'Which is a typical source of PRESEPTAL cellulitis (not usually orbital)?',c:['Bug bites','Peribulbar anesthesia','Hematogenous spread','Orbital fracture with foreign body'],a:0,e:'Preseptal: sinusitis, local trauma, bug bites, acute dacryocystitis, post-op infection, foreign body. Peribulbar anesthesia, orbital fracture with FB and hematogenous spread are listed for orbital.',s:'Handout p2; slides 12-13'},
 {q:'Most common pathogen in preseptal disease per the handout?',c:['Staphylococcus aureus, mostly community-acquired MRSA','Pseudomonas','Haemophilus influenzae type b','Aspergillus'],a:0,e:'Most are Staph aureus, most of it CA-MRSA in preseptal disease; Streptococcal species more common in orbital cellulitis; both can have either. Anaerobes (especially oral source) and fungi (more with orbital) possible.',s:'Handout p2-3; slide 14'},
 {q:'Anaerobes should be suspected as a cause of orbital/periorbital cellulitis especially when the infection seeds from:',c:['An oral (dental) source','A bug bite','A surgical wound on the scalp','The middle ear only'],a:0,e:'"Anaerobes might be the villain especially if seeding from an oral source."',s:'Handout p3'},
 {q:'A 9-year-old has a red, swollen upper eyelid after a mosquito bite, with normal, painless eye movements, normal vision, no proptosis and no chemosis. Diagnosis?',c:['Preseptal (periorbital) cellulitis','Orbital cellulitis','Orbital abscess','Cavernous sinus thrombosis'],a:0,e:'Preseptal: red/swollen lids, NO swelling beyond lid margin, NO proptosis, eye movement painful +/−, NO vision change, chemosis +/−, fever/leukocytosis ++/−. Orbital: all +++ (proptosis, painful EOM, vision change, chemosis).',s:'Handout p3; slide 16'},
 {q:'Which finding most strongly points to ORBITAL rather than preseptal cellulitis?',c:['Proptosis with painful eye movements and vision change','Red swollen eyelid','Mild fever','History of insect bite'],a:0,e:'Proptosis, swelling beyond lid margin, painful EOM and vision loss (all +++) are features of orbital cellulitis and absent in preseptal.',s:'Handout p3; slide 16'},
 {q:'The most common complications of orbital cellulitis are:',c:['Subperiosteal abscess and orbital abscess','Cavernous sinus thrombosis and central retinal artery occlusion','Meningitis and brain abscess','Glaucoma and cataract'],a:0,e:'Most common: subperiosteal and orbital abscess (can develop rapidly → frequent visual acuity and light reflex checks). Rare: cavernous sinus thrombosis, central retinal artery occlusion. Others: vision loss, brain abscess. Preseptal complications are rare (if the diagnosis is right).',s:'Handout p3; slide 17'},
 {q:'A patient on treatment for orbital cellulitis has worsening symptoms. What study does the handout recommend?',c:['Contrast-enhanced CT of the orbits and sinuses (or repeat CT) to detect an abscess','Plain skull films','Repeat blood cultures only','Ultrasound of the neck'],a:0,e:'Any worsening should lead to contrast-enhanced CT of orbits and sinuses (or repeat CT) to detect abscess (objective: CT indications).',s:'Handout p3'},
 {q:'How can preseptal vs orbital cellulitis be distinguished with certainty?',c:['CT (or MRI); CT more commonly due to availability','Blood cultures','CBC','History alone in every case'],a:0,e:'"CT scan or MRI is the only way to absolutely be sure"; more commonly CT. Many patients are young and nonverbal. Blood cultures recommended though &lt;30% positive; CBC.',s:'Handout p3; slide 18'},
 {q:'An infant has preseptal cellulitis. Management?',c:['Admit, regardless','Oral antibiotics at home','Observation only','IV antibiotics only if febrile'],a:0,e:'Infants with periorbital cellulitis need admission regardless. Children/adults can be observed with frequent office rechecks and oral antibiotics if reliable; 7-10 days.',s:'Handout p4; slide 19'},
 {q:'Duration of therapy for preseptal cellulitis in a reliable older child:',c:['7-10 days of oral antibiotics with frequent rechecks','1 day','6 weeks IV','No antibiotics'],a:0,e:'Oral antibiotics appropriate for the suspected agent, frequent rechecks; 7-10 days.',s:'Handout p4; slide 19'},
 {q:'Which is TRUE of orbital cellulitis management?',c:['All need admission, IV antibiotics, ENT and ophthalmology consults, and recurrent vision/pupil exams','Oral outpatient antibiotics are adequate','Only ophthalmology needs to be consulted','Surgery is never needed'],a:0,e:'Orbital: all admit, all IV antibiotics for suspected source (~7 days), all ENT + Ophtho consult, recurrent vision/pupil exams; may need decompressive surgery or abscess drainage.',s:'Handout p4; slide 20'},
 {q:'When can a patient with orbital cellulitis switch from IV to oral antibiotics?',c:['After being afebrile for 48 hours, to complete a 7-10 day (or longer) course','After the first dose','After 24 hours regardless of fever','Never'],a:0,e:'Maintain IV antibiotics until afebrile 48 hours, then oral to complete 7-10 days or longer depending on signs/symptoms.',s:'Handout p4'},
 {q:'A patient with orbital cellulitis suddenly loses vision. Immediate intervention?',c:['Lateral canthotomy/cantholysis','Wait for repeat CT in 48 hours','Add oral antibiotics','Warm compresses'],a:0,e:'"Immediate canthotomy/cantholysis is indicated if vision is lost."',s:'Handout p4'},
 {q:'Which is an indication for surgical drainage in orbital cellulitis?',c:['Afferent pupillary defect develops','Mild eyelid erythema','Fever on day 1','Positive blood culture alone'],a:0,e:'Surgical drainage: decreased vision; afferent pupillary defect; proptosis progressing despite antibiotics; abscess not smaller on CT after 48-72 h of antibiotics (craniotomy if brain abscess not responding); drainable collection on CT in patients &gt;16 years; suspected retained FB.',s:'Handout p4'},
 {q:'Orbital cellulitis outcomes per Dr. Hughes:',c:['Vision loss in 3-11% even if treated, death in 1-2%','No risk of vision loss','Death in 50%','Always resolves without antibiotics'],a:0,e:'Vision loss 3-11% (even if treated), death 1-2% → orbital cellulitis is sight- and life-threatening.',s:'Handout p3; slide 17'},
]);
addN('4.20',[
 {h:'Definitions + anatomy',b:'<b>Preseptal (periorbital)</b>: tissues anterior to the <b>orbital septum</b> (anterior eyelid). <b>Orbital</b>: orbit contents posterior to septum (fat, bone, muscles). Neither involves the globe. ~90% preseptal only. Preseptal rarely spreads to orbit (penetrating injury can infect both). Most common in preteens; boys &gt; girls in childhood.',s:'Handout p1-2; slides 3, 8, 10'},
 {h:'Chandler classification',b:'I preseptal (lid edema) · II orbital cellulitis (proptosis, chemosis, ↓EOM, ± vision loss) · III subperiosteal abscess (proptosis, vision loss) · IV orbital abscess (complete ophthalmoplegia, vision loss, marked proptosis) · V cavernous sinus thrombosis (bilateral; vision loss, meningitis).',s:'Handout p2; slide 9'},
 {h:'Sources + microbiology',b:'<b>Preseptal</b>: sinusitis (some/most), trauma, bug bites, acute dacryocystitis, post-op, FB.<br><b>Orbital</b>: sinusitis (90%), mostly <b>ethmoids</b> through the perforated <b>lamina papyracea</b>; frontal/maxillary also; ophthalmic surgery, peribulbar anesthesia, orbital fracture/FB, spread from tooth/middle ear/face, dacryocystitis, hematogenous.<br><b>Bugs</b>: S. aureus (mostly CA-MRSA in preseptal), Strep spp. more in orbital, S. pneumoniae, anaerobes (oral source), fungi (more orbital).',s:'Handout p2-3; slides 12-14'},
 {h:'Distinguishing features',b:'<table><tr><th></th><th>Red/swollen lids</th><th>Swelling beyond lid margin</th><th>Proptosis</th><th>Painful EOM</th><th>Vision change</th><th>Chemosis</th><th>Fever/WBC</th></tr><tr><td>Preseptal</td><td>+++</td><td>−</td><td>−</td><td>±</td><td>−</td><td>±</td><td>++/−</td></tr><tr><td>Orbital</td><td>+++</td><td>+++</td><td>+++</td><td>+++</td><td>+++</td><td>+++</td><td>+++</td></tr></table>',s:'Handout p3; slide 16'},
 {h:'Complications + diagnosis',b:'Preseptal: rare. Orbital: most common = subperiosteal + orbital abscess (rapid) → frequent visual acuity + light reflex checks; vision loss 3-11%, death 1-2%; rare cavernous sinus thrombosis, central retinal artery occlusion; brain abscess.<br>Dx: H&amp;P (young pts nonverbal); <b>CT or MRI</b> only way to be sure (CT more available); worsening → contrast CT orbits + sinuses; CBC; blood cultures (&lt;30% positive).',s:'Handout p3; slides 17-18'},
 {h:'Treatment',b:'<b>Preseptal</b>: infants ALWAYS admit; children/adults oral antibiotics + frequent rechecks if reliable; 7-10 days.<br><b>Orbital</b>: all admit; all IV antibiotics (~7 d); all ENT + Ophtho; IV until afebrile 48 h then PO to finish 7-10 d+; serial vision + pupil exams; decompression/drainage as needed; <b>vision lost → immediate canthotomy/cantholysis</b>.<br><b>Surgical drainage when</b>: ↓vision; afferent pupillary defect; progressing proptosis despite antibiotics; abscess not smaller on CT after 48-72 h (brain abscess not responding → craniotomy); drainable collection on CT in pts &gt;16 y; suspected retained FB.',s:'Handout p4; slides 19-20'},
]);
addQ('4.08',[
 {q:'Which part of the external auditory canal produces cerumen and has thick adherent skin?',c:['The cartilaginous outer one-third','The bony inner two-thirds','The tympanic membrane','The entire canal equally'],a:0,e:'Cartilaginous (outer 1/3): thick adherent skin, cerumen production. Bony (inner 2/3): thin skin, sensitive to palpation, susceptible to trauma.',s:'Slide 3'},
 {q:'How is the adult external auditory canal straightened for examination?',c:['Pull the pinna backward and upward','Pull the pinna downward','Press the tragus forward','Tilt the head toward the examined ear'],a:0,e:'"EAC can be straightened by pulling pinna backward and upward."',s:'Slide 3'},
 {q:'Perichondritis of the auricle: common pathogens and risk?',c:['Pseudomonas aeruginosa, S. aureus, Streptococcus; risk of cauliflower ear','Candida; risk of perforation','HSV; facial palsy','Aspergillus; hearing loss'],a:0,e:'Perichondritis = infection of auricular cartilage; Pseudomonas, S. aureus, Strep; risk of cauliflower ear.',s:'Slide 5'},
 {q:'A patient has painful vesicles in the ear canal/auricle and an ipsilateral facial nerve palsy. Diagnosis?',c:['Ramsay Hunt syndrome (herpes zoster oticus)','Bell\'s palsy alone','Necrotizing otitis externa','Perichondritis'],a:0,e:'Ramsay Hunt syndrome = herpes zoster with a facial nerve palsy (objective: recognize herpes zoster oticus).',f:'Slide 6 says the pathophysiology is "primary infection or reactivation of <b>HSV</b>." Herpes zoster (Ramsay Hunt) is classically varicella-zoster virus (VZV) reactivation. Know the slide\'s definition: herpes zoster + facial palsy.',s:'Slides 6, 15'},
 {q:'Which is a cause of external auditory canal obstruction on Dr. Strabbing\'s slide?',c:['Keratosis obliterans','Otosclerosis','Cholesteatoma of the middle ear','Ménière disease'],a:0,e:'EAC obstruction: cerumen, foreign body, keratosis obliterans, polyps.',s:'Slide 7'},
 {q:'A child has an unknown object in the ear canal. Correct approach?',c:['Do NOT irrigate; remove under an operating otoscope or microscope with a Hartman or alligator forceps','Irrigate with warm water immediately','Irrigate to make plant matter swell out','Instill mineral oil and irrigate'],a:0,e:'If you don\'t know what the object is, DO NOT IRRIGATE; TM status may be unknown; plant materials/insects swell. Use operating otoscope/microscope + Hartman or alligator forceps (objective: FB management).',s:'Slide 9'},
 {q:'Why are plant materials in the ear canal a particular problem with irrigation?',c:['They swell','They dissolve','They become radiopaque','They are always sterile'],a:0,e:'"Plant materials or insects will swell."',s:'Slide 9'},
 {q:'Keratosis obliterans is:',c:['An external auditory canal cholesteatoma from blockage of the EAC with accumulation of epithelial debris','A fungal otitis externa','A middle ear tumor','Herpes zoster of the canal'],a:0,e:'Keratosis obliterans = EAC cholesteatoma caused by canal blockage permitting accumulation of epithelial debris.',s:'Slide 10'},
 {q:'Which physical findings fit bacterial acute otitis externa?',c:['Swollen canal, variable erythema, watery scant exudate, pronounced tenderness','Bulging TM with fever','Normal canal with vertigo','Vesicles with facial palsy'],a:0,e:'AOE history: pain, tenderness, itching, hearing loss. Exam: swollen EAC, variable erythema, watery scant exudate, pronounced tenderness.',s:'Slide 12'},
 {q:'The most common form of bacterial acute otitis externa, and its optimal management?',c:['Diffuse ("swimmer\'s ear"); ototopical agents','Furunculosis; systemic antibiotics','Necrotizing; urgent referral','Otomycosis; antifungals'],a:0,e:'Diffuse AOE (swimmer\'s ear) is most common; optimally managed with ototopical agents.',s:'Slide 16'},
 {q:'An abscess in the lateral portion of the external auditory canal that may require systemic antibiotics is:',c:['Furunculosis','Diffuse otitis externa','Keratosis obliterans','Perichondritis'],a:0,e:'Furunculosis: abscess in lateral EAC; may require systemic antibiotics.',s:'Slide 17'},
 {q:'A diabetic with severe otitis externa: what form must you worry about, and what is the management?',c:['Necrotizing otitis externa; can be fatal, urgent referral to a specialist','Furunculosis; oral antibiotics','Diffuse swimmer\'s ear; drops only','Otomycosis; vinegar drops'],a:0,e:'Necrotizing AOE occurs in diabetic/immunocompromised patients, can be fatal, requires urgent specialist referral.',s:'Slide 18'},
 {q:'Which is a risk factor for acute otitis externa?',c:['Alkalinization of the external auditory canal','Acidification of the canal','Cold dry weather','Cerumen'],a:0,e:'Risk factors: summer (year-round in tropics), high temperature, humidity, prolonged water exposure, alkalinization of the EAC, canal trauma.',s:'Slide 19'},
 {q:'The three principles of treating bacterial acute otitis externa are:',c:['Clean the canal, topical therapy, suitable pain management','Systemic antibiotics, steroids, surgery','Irrigation, ear plugs, antihistamines','Observation, warm oil, cotton swabs'],a:0,e:'Clean the canal (aural toilet: suction/microscopic removal, irrigation, dry mopping), topical therapy, pain management.',s:'Slides 20-21'},
 {q:'Topical therapy for uncomplicated AOE should cover:',c:['Gram-positive and gram-negative organisms, especially Pseudomonas (aminoglycosides or fluoroquinolones)','Fungi only','Anaerobes only','Viruses'],a:0,e:'Topical antibiotics covering Gram + and −, especially pseudomonads (aminoglycosides, fluoroquinolones). Systemic antibiotics generally not needed for uncomplicated cases.',s:'Slide 22'},
 {q:'Why is a wick placed in a swollen ear canal for 48-72 hours?',c:['To improve delivery of topical medication','To drain pus from the middle ear','To prevent water entry permanently','To straighten the canal for surgery'],a:0,e:'Stenting a swollen EAC with a wick for 48-72 h may improve topical medication delivery.',s:'Slide 22'},
 {q:'Why is routine use of neomycin ear drops not recommended?',c:['High risk of sensitization (increasing incidence; cross-reactivity with other aminoglycosides)','Ototoxicity in every patient','No activity against Pseudomonas','It is a steroid'],a:0,e:'Neomycin sensitization is increasing due to long-standing use, cross-reacts with other aminoglycosides; routine use not recommended.',s:'Slide 24'},
 {q:'Prophylaxis for recurrent otitis externa:',c:['Dry the ear after swimming; ½ alcohol (if TM intact) or water + ½ vinegar solution','Cotton swab cleaning daily','Oral antibiotics before swimming','Ear candles'],a:0,e:'Aural hygiene, dry ear after swimming, solution of ½ alcohol (if TM intact) or H<sub>2</sub>O and ½ vinegar.',s:'Slide 23'},
]);
addN('4.08',[
 {h:'EAC anatomy + auricle',b:'Cartilaginous outer 1/3: thick adherent skin, cerumen. Bony inner 2/3: thin, tender, trauma-prone. Straighten adult canal: pinna <b>backward and upward</b>.<br><b>Perichondritis</b>: auricular cartilage infection; Pseudomonas, S. aureus, Strep; cauliflower ear risk.<br><b>Ramsay Hunt</b>: herpes zoster + facial nerve palsy.',f:'Slide 6 attributes Ramsay Hunt to HSV; classically it is VZV reactivation.',s:'Slides 3-6'},
 {h:'Canal obstruction + foreign bodies',b:'Causes: cerumen, FB, keratosis obliterans (EAC cholesteatoma from blocked canal debris), polyps.<br><b>FB</b>: unknown object → <b>DO NOT IRRIGATE</b> (TM status unknown; plants/insects swell). Operating otoscope/microscope + Hartman or alligator forceps.',s:'Slides 7-10'},
 {h:'Otitis externa',b:'Types: allergic, eczematoid, bacterial, fungal (otomycosis), viral (herpes zoster).<br><b>Bacterial AOE</b>: pain, tenderness, itching, hearing loss; swollen canal, variable erythema, watery scant exudate, pronounced tenderness.<br>Forms: <b>diffuse/swimmer\'s</b> (most common; ototopicals), <b>furunculosis</b> (lateral canal abscess; ± systemic abx), <b>necrotizing</b> (diabetic/immunocompromised; can be fatal; urgent referral).<br>Risk: summer, heat, humidity, water exposure, <b>alkalinized canal</b>, trauma.<br>Tx: clean canal (suction, irrigation, dry mop), topical gram+/− incl. Pseudomonas (aminoglycoside, fluoroquinolone), pain control; wick 48-72 h; no systemic abx if uncomplicated. Avoid routine neomycin (sensitization). Prophylaxis: dry ears; ½ alcohol (TM intact) or water + ½ vinegar.',s:'Slides 11-24'},
]);

// ===== 4.21 Hughes - Chest Trauma (handout + Parts 1-4 slides) =====
const H21='Handout',P1='Pt1 slide',P2='Pt2 slide',P3='Pt3 slide',P4='Pt4 slide';
// ---------- 4.21.1 ATLS ----------
addO('4.21.1',[
