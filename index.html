<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Otolith Isles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--sky1:#7ec8ff;--sky2:#cfeaff;--ink:#14213d;--ink2:#3a4a6b;--panel:#fffaf0;--panel2:#f3ead7;--line:#2a2f45;--grass:#5fbf4a;--grassD:#3f8f33;--dirt:#8a5a35;--gold:#f6c343;--gem:#3ee0d0;--red:#e5484d;--good:#2fb36b;--bad:#e5484d;--card:#ffffff;--shadow:0 4px 0 #2a2f45;--px:'Press Start 2P',monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky1),var(--sky2));min-height:100vh;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.px{font-family:var(--px);letter-spacing:.02em}
#top{position:sticky;top:0;z-index:30;background:#1d2440;color:#fff;border-bottom:4px solid #0d1226;display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap}
#top .logo{font-family:var(--px);font-size:13px;color:#ffe48a;text-shadow:2px 2px 0 #7a3b00;white-space:nowrap}
#top .stat{display:flex;align-items:center;gap:6px;background:#2c3560;border:2px solid #0d1226;border-radius:6px;padding:4px 8px;font-weight:800;font-size:14px}
#top .stat i{font-style:normal}
#hearts{letter-spacing:1px}
#syncPill{font-size:12px;padding:4px 8px;border-radius:6px;border:2px solid #0d1226;font-weight:800}
#syncPill.ok{background:#1f7a4a}#syncPill.warn{background:#9a6b00}#syncPill.bad{background:#a22}
#top .sp{flex:1}
#tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 10px 0;background:#2c3560;position:sticky;top:0;z-index:25;scrollbar-width:thin}
#tabs button{flex:none;background:#495488;color:#e8ecff;border:2px solid #0d1226;border-bottom:none;border-radius:8px 8px 0 0;padding:8px 12px;font-weight:800;font-size:13px}
#tabs button.on{background:var(--panel);color:var(--ink)}
#desc{background:var(--panel);border-bottom:3px solid var(--line);padding:8px 14px;font-size:14px;color:var(--ink2);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:14px}
.pane{display:none}.pane.on{display:block}
.card{background:var(--panel);border:3px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.btn{background:#ffd34d;border:3px solid var(--line);border-radius:8px;box-shadow:0 3px 0 var(--line);padding:8px 14px;font-weight:900;color:var(--ink)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.blue{background:#7cc7ff}.btn.green{background:#7be08f}.btn.gray{background:#d9d4c7}.btn.red{background:#ff8f8f}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2);font-size:13px}
canvas{image-rendering:pixelated;display:block}
#mapWrap{position:relative;border:3px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow);background:#9fd8ff;touch-action:none}
#mapCv{width:100%;height:min(72vh,720px);cursor:grab}
#mapTip{position:absolute;pointer-events:none;background:#fffaf0;border:3px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;max-width:280px;display:none;box-shadow:var(--shadow);z-index:3}
#mapLegend:empty{display:none}
#mapLegend{position:absolute;left:10px;bottom:10px;background:rgba(255,250,240,.92);border:2px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;max-width:60%}
#mapZoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
#mapZoom button{width:40px;height:40px;font-size:20px;font-weight:900;background:#fffaf0;border:3px solid var(--line);border-radius:8px}
/* island view */
#isle{position:fixed;inset:0;z-index:50;background:#000;display:none}
#isle.on{display:block}
#isleCv{width:100vw;height:100vh;touch-action:none}
#isleHud{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;padding:10px;pointer-events:none;flex-wrap:wrap}
#isleHud>*{pointer-events:auto}
.hudBox{background:rgba(20,24,46,.86);color:#fff;border:3px solid #0d1226;border-radius:10px;padding:8px 12px;font-weight:800}
.hudBox .t1{font-family:var(--px);font-size:11px;color:#ffe48a;line-height:1.5}
.hudBox .t2{font-size:12px;color:#c9d2ff;font-weight:700}
#isleBack{background:#ffd34d;color:var(--ink)}
#dpad{position:absolute;right:16px;bottom:16px;display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px 56px;gap:4px;opacity:.9}
#dpad button{background:rgba(255,250,240,.9);border:3px solid #0d1226;border-radius:10px;font-size:20px;font-weight:900}
#isleMsg{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(20,24,46,.9);color:#fff;border:3px solid #0d1226;border-radius:10px;padding:8px 14px;font-weight:800;font-size:14px;max-width:70vw;text-align:center;display:none}
/* battle overlay */
#battle{position:fixed;inset:0;z-index:70;background:rgba(8,10,24,.78);display:none;overflow-y:auto}
#battle.on{display:block}
#bWrap{max-width:860px;margin:16px auto;padding:0 10px}
#bStage{width:100%;height:230px;border:3px solid var(--line);border-radius:12px 12px 0 0;background:#9fd8ff}
#bCard{background:var(--panel);border:3px solid var(--line);border-top:none;border-radius:0 0 12px 12px;padding:14px;box-shadow:var(--shadow)}
.qtag{display:inline-block;font-size:11px;font-weight:800;background:#e7f0ff;border:2px solid #9cb3e6;border-radius:6px;padding:2px 6px;margin:0 6px 6px 0;color:#24407a}
.qtag.off{background:#fff1c2;border-color:#e0b53a;color:#6b4b00}
.qstem{font-size:17px;font-weight:700;line-height:1.45;margin:6px 0 12px}
.qstem table{border-collapse:collapse;font-size:14px;margin:8px 0}.qstem td,.qstem th{border:1px solid #999;padding:3px 6px}
.ch{display:block;width:100%;text-align:left;background:#fff;border:3px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px;font-weight:700;box-shadow:0 3px 0 var(--line)}
.ch:hover{background:#fffbe8}
.ch .k{display:inline-block;width:26px;height:26px;line-height:22px;text-align:center;border:2px solid var(--line);border-radius:6px;margin-right:8px;background:#ffe48a;font-family:var(--px);font-size:10px}
.ch.right{background:#d6f7df;border-color:#1f7a4a}.ch.wrong{background:#ffe0e0;border-color:#a22}
.ch[disabled]{cursor:default;opacity:1;color:var(--ink)}
.qimg{display:block;max-width:100%;max-height:340px;border:3px solid var(--line);border-radius:10px;margin:4px 0 10px;cursor:zoom-in}
.qimg.big{max-height:none}
.expl{margin-top:10px;background:#fff;border:3px dashed #9cb3e6;border-radius:10px;padding:10px 12px;font-size:14.5px;line-height:1.5}
.expl b.v{font-family:var(--px);font-size:11px}
.flag{background:#ffecec;border:3px solid #d33;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13.5px}
.cite{font-size:12px;color:#5a6a8a;font-weight:700;margin-top:6px}
.saInput{width:100%;min-height:80px;border:3px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px}
/* notes */
.nlec{margin-bottom:10px}
.nlec>summary{cursor:pointer;font-weight:900;font-size:16px;padding:10px 12px;background:#fff;border:3px solid var(--line);border-radius:10px;list-style:none}
.nlec[open]>summary{border-radius:10px 10px 0 0}
.nbody{background:#fff;border:3px solid var(--line);border-top:none;border-radius:0 0 10px 10px;padding:10px 14px}
.tome{border-bottom:2px dashed #d7cdb6;padding:10px 0}
.tome:last-child{border-bottom:none}
.tome h4{margin:0 0 6px;font-size:15.5px}
.tome .tb{font-size:14.5px;line-height:1.55}
.tome .tb ul{margin:4px 0;padding-left:20px}
.tome .tb table{border-collapse:collapse;font-size:13.5px;margin:6px 0}.tome .tb td,.tome .tb th{border:1px solid #bbb;padding:3px 6px;vertical-align:top}
.abx{color:#6a7896;font-size:.88em;font-weight:600}
/* shop */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.item{background:#fff;border:3px solid var(--line);border-radius:10px;padding:10px;text-align:center;box-shadow:0 3px 0 var(--line);position:relative}
.item canvas{margin:0 auto 6px;background:linear-gradient(#bfe6ff,#e9f7ff);border:2px solid #c9d6ee;border-radius:8px}
.item .nm{font-weight:900;font-size:14px}
.item .ds{font-size:12px;color:var(--ink2);min-height:32px}
.item .pr{font-weight:900;margin:6px 0}
.item.own{background:#f2fff4}
.item.eq{outline:4px solid #ffd34d}
.rar{position:absolute;top:6px;left:6px;font-size:10px;font-weight:900;padding:2px 5px;border-radius:5px;color:#fff}
.r1{background:#8a94a8}.r2{background:#2f9e5a}.r3{background:#2f6fd0}.r4{background:#8a3fd0}.r5{background:#e08a00}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:#fff;border:2px solid var(--line);border-radius:20px;padding:5px 12px;font-weight:800;font-size:13px}
.chip.on{background:#ffd34d}
/* stars */
.stars{color:#f6b500;letter-spacing:1px}
.bar{height:12px;background:#e3dccb;border:2px solid var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#5fdc7a,#2fb36b)}
table.lb{width:100%;border-collapse:collapse;background:#fff;border:3px solid var(--line);border-radius:10px;overflow:hidden}
table.lb td,table.lb th{padding:8px;border-bottom:2px solid #eee;text-align:left;font-size:14px}
table.lb tr.me{background:#fff7d1}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:#1d2440;color:#fff;border:3px solid #0d1226;border-radius:10px;padding:8px 14px;font-weight:800;box-shadow:0 4px 0 #0d1226;animation:tin .25s ease-out}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#modal{position:fixed;inset:0;z-index:95;background:rgba(8,10,24,.7);display:none;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
#modalBox{background:var(--panel);border:3px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px}
input[type=text],input[type=password],select{font:inherit;border:3px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:700}
#fxLayer{position:fixed;inset:0;pointer-events:none;z-index:20}
#homeCv{width:100%;height:min(66vh,620px);border:3px solid var(--line);border-radius:10px;background:#9fd8ff;touch-action:none}
.pal{display:flex;gap:6px;flex-wrap:wrap}
.pal button{border:3px solid var(--line);border-radius:8px;background:#fff;padding:4px;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:800;min-width:58px}
.pal button.on{background:#ffd34d}
.pal canvas{width:32px;height:32px}
@media (max-width:640px){#top .logo{font-size:10px}#bStage{height:170px}.qstem{font-size:16px}#dpad{grid-template-columns:50px 50px 50px;grid-template-rows:50px 50px 50px}}
</style></head>
<body>
<div id="top">
 <div class="logo">OTOLITH ISLES</div>
 <div class="stat" title="Shards (spend in the Shop)">◆ <i id="hShards">0</i></div>
 <div class="stat" title="Level">LV <i id="hLv">1</i></div>
 <div class="stat" title="Hearts" id="hearts">♥♥♥♥♥</div>
 <div class="stat" title="Daily streak">🔥 <i id="hStreak">0</i></div>
 <div class="sp"></div>
 <div id="syncPill" class="warn">Browser save</div>
 <button class="btn gray" id="btnAcct" style="padding:4px 10px">Account</button>
 <button class="btn gray" id="btnMute" style="padding:4px 10px" title="Sound on/off">🔊</button>
</div>
<div id="tabs"></div>
<div id="desc"></div>
<main>
 <section class="pane" id="p-map"></section>
 <section class="pane" id="p-off"></section>
 <section class="pane" id="p-notes"></section>
 <section class="pane" id="p-quiz"></section>
 <section class="pane" id="p-home"></section>
 <section class="pane" id="p-shop"></section>
 <section class="pane" id="p-medals"></section>
 <section class="pane" id="p-board"></section>
 <section class="pane" id="p-save"></section>
</main>
<div id="isle"><canvas id="isleCv"></canvas>
 <div id="isleHud"><button class="btn" id="isleBack">⟵ Sky Map</button><div class="hudBox" id="isleInfo"></div><div class="hudBox" id="isleProg"></div></div>
 <div id="dpad"><span></span><button data-d="up" title="Up-left">▲</button><span></span><button data-d="left">◀</button><button data-d="act" title="Interact">●</button><button data-d="right">▶</button><span></span><button data-d="down">▼</button><span></span></div>
 <div id="isleMsg"></div>
</div>
<div id="battle"><div id="bWrap"><canvas id="bStage"></canvas><div id="bCard"></div></div></div>
<div id="modal"><div id="modalBox"></div></div>
<div id="toast"></div>
<canvas id="fxLayer"></canvas>
<script>
// ===== VOX: voxel textures, iso cube sprites, pixel sprites =====
const VOX=(()=>{
 function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
 function hex(c){c=c.replace('#','');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
 function rgb(a){return`rgb(${a[0]|0},${a[1]|0},${a[2]|0})`}
 function jit(c,r,amt){return c.map(v=>Math.max(0,Math.min(255,v+(r()-.5)*amt)))}
 // material defs: top / side base colors, pattern kind
 const MAT={
  grass:{t:'#5fbf4a',s:'#8a5a35',k:'grass',n:'Grass'},
  dirt:{t:'#8a5a35',s:'#8a5a35',k:'noise',n:'Dirt'},
  stone:{t:'#8d939c',s:'#80868f',k:'stone',n:'Stone'},
  cobble:{t:'#7a7f88',s:'#6f747d',k:'cobble',n:'Cobble'},
  sand:{t:'#ecd9a0',s:'#e2cc8e',k:'noise',n:'Sand'},
  snow:{t:'#f4f8ff',s:'#8a5a35',k:'snow',n:'Snow'},
  ice:{t:'#a8dcff',s:'#94cdf5',k:'ice',n:'Ice'},
  redsand:{t:'#d9824a',s:'#c46f3c',k:'strata',n:'Red Mesa'},
  sandstone:{t:'#e6c98a',s:'#d8b874',k:'strata',n:'Sandstone'},
  log:{t:'#b38550',s:'#6b4a2b',k:'log',n:'Log'},
  plank:{t:'#c49a5c',s:'#b88c4f',k:'plank',n:'Planks'},
  leaves:{t:'#3f9a3a',s:'#358a31',k:'leaves',n:'Leaves'},
  pine:{t:'#2f6e45',s:'#285f3b',k:'leaves',n:'Pine'},
  bloom:{t:'#f6a8c8',s:'#ea93b6',k:'leaves',n:'Bloom'},
  moss:{t:'#6a9a3a',s:'#5d4a35',k:'grass',n:'Moss'},
  mush:{t:'#c94a4a',s:'#e8dcc8',k:'mush',n:'Shroom'},
  myc:{t:'#7a5f9a',s:'#5d4a5a',k:'grass',n:'Duskgrass'},
  basalt:{t:'#3d3f4a',s:'#34363f',k:'stone',n:'Basalt'},
  obsid:{t:'#2a1f3d',s:'#22182f',k:'crystal',n:'Obsidian'},
  iron:{t:'#d8dde3',s:'#c7cdd5',k:'metal',n:'Iron Block'},
  gold:{t:'#f6c343',s:'#e3ac2a',k:'metal',n:'Gold Block'},
  crystal:{t:'#7ff0e6',s:'#5dd8cf',k:'crystal',n:'Crystal'},
  amethyst:{t:'#b07ef0',s:'#9a66df',k:'crystal',n:'Amethyst'},
  brick:{t:'#b5523b',s:'#a84a34',k:'brick',n:'Brick'},
  glass:{t:'#d9f3ff',s:'#c6ebff',k:'glass',n:'Glass'},
  lantern:{t:'#ffd36b',s:'#f2b84a',k:'lamp',n:'Lantern'},
  water:{t:'#4aa3e8',s:'#3f8fd0',k:'water',n:'Water'},
  coral:{t:'#ff7f6a',s:'#f06a55',k:'leaves',n:'Coral'},
  quartz:{t:'#f2ede4',s:'#e6dfd2',k:'plank',n:'Quartz'},
  bone:{t:'#ece3c8',s:'#ddd3b5',k:'noise',n:'Bone'},
  w_red:{t:'#d94040',s:'#c53636',k:'wool',n:'Red Wool'},w_blue:{t:'#3b6fd8',s:'#335fc0',k:'wool',n:'Blue Wool'},
  w_yel:{t:'#f2d03b',s:'#dcbb2c',k:'wool',n:'Yellow Wool'},w_wht:{t:'#f2f2f2',s:'#e0e0e0',k:'wool',n:'White Wool'},
  w_blk:{t:'#2a2a33',s:'#22222a',k:'wool',n:'Black Wool'},w_pur:{t:'#8a4ad8',s:'#7a3fc4',k:'wool',n:'Purple Wool'},
  w_pnk:{t:'#f28ab8',s:'#e078a6',k:'wool',n:'Pink Wool'},w_org:{t:'#f28a2e',s:'#dd7a24',k:'wool',n:'Orange Wool'},
  w_grn:{t:'#4ab84a',s:'#3fa53f',k:'wool',n:'Green Wool'},w_cyn:{t:'#2ec4c4',s:'#27aeae',k:'wool',n:'Cyan Wool'},
  oreGem:{t:'#8d939c',s:'#80868f',k:'ore',o:'#3ee0d0',n:'Gem Ore'},
  oreGold:{t:'#8d939c',s:'#80868f',k:'ore',o:'#f6c343',n:'Gold Ore'},
  oreRuby:{t:'#7a7f88',s:'#6f747d',k:'ore',o:'#ff4a6a',n:'Ruby Ore'},
  oreAme:{t:'#3d3f4a',s:'#34363f',k:'ore',o:'#c08aff',n:'Amethyst Ore'},
 };
 const TEX={};
 function makeTex(id,face){
  const m=MAT[id],c=document.createElement('canvas');c.width=c.height=8;const x=c.getContext('2d');
  const r=rng([...id+face].reduce((a,ch)=>a*31+ch.charCodeAt(0),7));
  const base=hex(face==='t'?m.t:m.s);
  for(let i=0;i<8;i++)for(let j=0;j<8;j++){
   let col=jit(base,r,26);const k=m.k;
   if(k==='grass'&&face==='s'){col=j<2||(j<3&&r()<.5)?jit(hex(m.t),r,24):jit(base,r,24)}
   if(k==='snow'&&face==='s'){col=j<2||(j<3&&r()<.5)?jit(hex(m.t),r,10):jit(base,r,24)}
   if(k==='stone'&&r()<.12)col=col.map(v=>v-28);
   if(k==='cobble'){const e=(i%4===0||j%3===0);col=e?col.map(v=>v-35):col}
   if(k==='strata'&&face==='s'){col=jit(base.map(v=>v+((j%3===0)?-22:(j%3===1?10:0))),r,10)}
   if(k==='log'){if(face==='s')col=jit(base.map(v=>v+(i%3===0?-18:0)),r,14);else{const d=Math.hypot(i-3.5,j-3.5);col=d>3.2?jit(hex(m.s),r,10):jit(base.map(v=>v-(Math.round(d)%2)*18),r,10)}}
   if(k==='plank'){col=jit(base.map(v=>v-(j%4===3?26:0)-((i===(j<4?2:6))&&j%4!==3?14:0)),r,12)}
   if(k==='leaves'){col=r()<.18?col.map(v=>v-40):(r()<.1?col.map(v=>v+30):col)}
   if(k==='mush'){if(face==='t'){col=r()<.18?[240,236,226]:jit(base,r,16)}else col=jit(base,r,10)}
   if(k==='crystal'){col=jit(base.map(v=>v+((i+j)%5===0?40:(i-j+8)%6===0?-25:0)),r,10)}
   if(k==='metal'){col=jit(base.map(v=>v+(i===0||j===0?28:(i===7||j===7?-30:0))),r,8)}
   if(k==='brick'){const row=j>>1,off=(row%2)*2;const e=(j%2===1)||((i+off)%4===0);col=e?[200,190,175].map(v=>v+(r()-.5)*10):col}
   if(k==='glass'){const e=i===0||j===0||i===7||j===7;col=e?base.map(v=>v-40):(r()<.06?[255,255,255]:base);}
   if(k==='lamp'){const e=i===0||j===0||i===7||j===7;col=e?[90,60,30]:jit(base.map(v=>v+((i>2&&i<5&&j>2&&j<5)?30:0)),r,12)}
   if(k==='water'){col=jit(base.map(v=>v+((i+j*2)%6===0?28:0)),r,8)}
   if(k==='wool'){col=jit(base,r,12);if((i+j)%3===0)col=col.map(v=>v-10)}
   if(k==='ore'&&r()<.16)col=jit(hex(m.o),r,30);

const ISLES={};
function genIsland(L){

 for(let x=0;x<N;x++){T[x]=[];for(let y=0;y<N;y++){const dx=x-cx,dy=y-cy,a=Math.atan2(dy,dx),d=Math.hypot(dx,dy);

 spawn=spawn||{x:10,y:10};
 const free=()=>{for(let k=0;k<400;k++){const x=1+(r()*(N-2))|0,y=1+(r()*(N-2))|0;const t=tile(x,y);if(t&&t.h&&t.walk&&!t.ex.length&&!t.obj&&Math.abs(x-spawn.x)+Math.abs(y-spawn.y)>2)return{x,y,t}}return null};

 for(let i=0;i<nTree;i++){const p=free();if(!p)continue;const z=p.t.h;
  if(B.tree==='cactus'){const hh=2+((r()*2)|0);for(let k=0;k<hh;k++)p.t.ex.push({z:z+k,m:'leaves',sm:.7})}

  else{p.t.ex.push({z,m:'log'},{z:z+1,m:'log'},{z:z+2,m:B.tree},{z:z+3,m:B.tree});[[1,0],[-1,0],[0,1],[0,-1]].forEach(([a,b])=>{const t=tile(p.x+a,p.y+b);if(t)t.ex.push({z:z+2,m:B.tree,air:1})})}
  p.t.walk=false}
 // rocks / small deco
 for(let i=0;i<5;i++){const p=free();if(!p)continue;p.t.ex.push({z:p.t.h,m:B.rock,sm:.55});p.t.walk=false}

async function makeCode(){const json=JSON.stringify(S);try{const cs=new CompressionStream('gzip');const buf=await new Response(new Blob([json]).stream().pipeThrough(cs)).arrayBuffer();let s='';new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return'OTI1Z:'+btoa(s)}catch(e){return'OTI1J:'+btoa(unescape(encodeURIComponent(json)))}}
async function readCode(code){code=code.trim();if(code.startsWith('OTI1Z:')){const bin=atob(code.slice(6));const u=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(ds)).text())}if(code.startsWith('OTI1J:'))return JSON.parse(decodeURIComponent(escape(atob(code.slice(6)))));throw new Error('Not an Otolith save code')}

// ===== 4.01 Laryngeal Cancer · 4.02 Pharyngeal/Adenotonsillar · 4.03 Salivary Glands · 4.16 Oral & Oropharyngeal Cancer (Strabbing) =====
addQ('4.01',[
 {q:'A 62-year-old smoker has had hoarseness for 3 weeks. Per Dr. Strabbing, what evaluation is indicated?',c:['Flexible fiberoptic laryngoscopy','Reassurance and voice rest for 3 more months','Chest x-ray only','Antibiotics and recheck'],a:0,e:'"All patients with hoarseness of more than two weeks duration should have flexible fiberoptic laryngoscopy" (objective: role of flexible laryngoscopy in hoarseness).',s:'Slide 6'},
 {q:'The two key risk factors for laryngeal carcinoma listed by Dr. Strabbing are:',c:['Tobacco and alcohol','HPV and EBV','Radiation and UV light','GERD and obesity'],a:0,e:'Risk factors for laryngeal cancer: tobacco and alcohol.',s:'Slide 4'},
 {q:'Laryngeal cancer most commonly arises from which site?',c:['The true vocal cords (glottis)','The epiglottis','The subglottis','The arytenoids'],a:0,e:'Laryngeal cancer arises from the true vocal cords (TVCs) about 75% of the time. Subsites on the slide: glottic and supraglottic cancer.',s:'Slides 3, 5'},
 {q:'Which region of the larynx has the SPARSEST lymphatic drainage?',c:['Anteriorly and at the level of the glottis','The supraglottis','The subglottis','The posterior half of the larynx'],a:0,e:'Lymphatics are sparse anteriorly and at the glottis; richer in supraglottic and subglottic regions and the posterior half. (This is why early glottic cancer tends to stay localized.)',s:'Slide 3'},
 {q:'Lesions ABOVE the level of the true vocal cords drain lymph in which direction?',c:['Superiorly','Inferiorly','Only to the contralateral neck','To the axilla'],a:0,e:'Supraglottic lesions drain superiorly; glottic and subglottic lesions drain inferiorly.',s:'Slide 3'},
 {q:'What serves as the major barrier to the spread of cancer from (and to) the glottic region?',c:['Fibroelastic membranes','The thyroid gland','The hyoid bone','The mandibular periosteum'],a:0,e:'"Fibroelastic membranes serve as the major barriers to the spread of cancer from (and to) the glottic region." (Mandibular periosteum is the only barrier mentioned for oral cavity tumors.)',s:'Slide 3'},
 {q:'Early-stage (T1 and T2) laryngeal cancer can be treated with:',c:['Either radiation therapy or surgery alone (CO<sub>2</sub> laser commonly employed)','Total laryngectomy only','Chemotherapy alone','Observation'],a:0,e:'T1/T2 laryngeal cancer: radiation OR surgery alone; CO<sub>2</sub> laser is commonly used (objective: laser for T1/T2). Laryngectomy is for advanced stages.',s:'Slides 7-8'},
 {q:'Laryngectomy is reserved for which laryngeal cancers?',c:['Advanced stages','All T1 glottic lesions','Only supraglottic T1 lesions','None; it is obsolete'],a:0,e:'"Treatment: laryngectomy for advanced stages." (First laryngectomy for cancer: Billroth, 1883.)',s:'Slide 7'},
 {q:'Typical duration of radiotherapy for laryngeal cancer per the slides:',c:['6-7 weeks','1 week','6 months','A single dose'],a:0,e:'Radiotherapy is given for 6-7 weeks (same for oral and oropharyngeal cancer in 4.16).',s:'Slide 9'},
 {q:'Which two presenting symptoms of laryngeal cancer are listed?',c:['Hoarseness and dysphagia','Epistaxis and anosmia','Otorrhea and vertigo','Trismus and halitosis'],a:0,e:'Presentation: hoarseness, dysphagia.',s:'Slide 6'},
]);
addN('4.01',[
 {h:'Laryngeal cancer (Strabbing)',b:'<ul><li>Arises from the <b>true vocal cords</b> ~75% of the time. Subsites: glottic, supraglottic.</li><li>Lymphatics <b>sparse anteriorly and at the glottis</b>; richer supraglottic, subglottic and posterior half. Above TVCs → drain <b>superiorly</b>; glottic/subglottic → drain <b>inferiorly</b>.</li><li><b>Fibroelastic membranes</b> = major barrier to spread from/to the glottis.</li><li>Risk factors: <b>tobacco, alcohol</b>.</li><li>Presentation: hoarseness, dysphagia. <b>Hoarseness &gt;2 weeks → flexible fiberoptic laryngoscopy</b>.</li><li>Tx: T1/T2 → radiation OR surgery alone (CO<sub>2</sub> laser common). Advanced → laryngectomy (Billroth 1883). RT 6-7 weeks.</li></ul>',s:'Slides 2-9'},
]);
addQ('4.02',[
 {q:'Which artery is the MAIN arterial supply of the palatine tonsil?',c:['Tonsillar artery (and ascending palatine) from the facial artery, lower pole','Ascending pharyngeal artery, upper pole','Greater palatine artery, upper pole','Dorsal lingual artery, lower pole'],a:0,e:'Facial artery → ascending palatine and tonsillar arteries = main supply, lower pole. Others: lingual → dorsal lingual (lower pole); external carotid → ascending pharyngeal (upper pole); internal maxillary → greater and descending palatine (upper pole). Objective: master the tonsil\'s arterial supply.',s:'Slide 3'},
 {q:'The ascending pharyngeal artery supplies which pole of the palatine tonsil, and from which parent vessel?',c:['Upper pole; external carotid artery','Lower pole; facial artery','Lower pole; lingual artery','Upper pole; internal carotid artery'],a:0,e:'External carotid → ascending pharyngeal → upper pole.',s:'Slide 3'},
 {q:'The dorsal lingual branch supplying the tonsil comes from which artery, to which pole?',c:['Lingual artery; lower pole','Facial artery; upper pole','Internal maxillary; upper pole','Ascending pharyngeal; lower pole'],a:0,e:'Lingual artery → dorsal lingual branch → lower pole.',s:'Slide 3'},
 {q:'The greater palatine and descending palatine arteries to the tonsil arise from which artery?',c:['Internal maxillary artery (upper pole)','Facial artery (lower pole)','Lingual artery (lower pole)','Superior thyroid artery'],a:0,e:'Internal maxillary → greater palatine and descending palatine → upper pole.',s:'Slide 3'},
 {q:'Adenoids are supplied mainly by:',c:['Ascending pharyngeal artery from the external carotid, plus minor branches from internal maxillary and facial (ascending palatine) arteries','Superior thyroid artery','Vertebral artery','Internal carotid artery directly'],a:0,e:'Adenoid supply: ascending pharyngeal (ECA) + minor internal maxillary and facial (ascending palatine) branches.',s:'Slide 4'},
 {q:'Which statement about adenoids is correct?',c:['Present at birth, enlarge in childhood, regress at puberty','Appear only after puberty','Enlarge throughout adulthood','Absent at birth and never regress'],a:0,e:'Similar to palatine tonsils: present at birth, enlarge in childhood, regress at puberty.',s:'Slide 4'},
 {q:'Most acute pharyngitis is:',c:['Viral','Group A strep','Fungal','Due to GERD'],a:0,e:'Acute pharyngitis is primarily infectious and most pathogens are viral. Non-infectious contributors: sinonasal disease, GERD, smoking, endotracheal intubation.',s:'Slide 5'},
 {q:'What is the most common cause of BACTERIAL pharyngitis?',c:['Group A beta-hemolytic streptococcus (GABHS)','Haemophilus influenzae','Corynebacterium diphtheriae','Neisseria gonorrhoeae'],a:0,e:'GABHS is the most common cause of bacterial pharyngitis.',s:'Slide 6'},
 {q:'Which test is the MOST SENSITIVE for diagnosing GABHS pharyngitis?',c:['Throat culture','Rapid antigen test','Clinical exam','Monospot'],a:0,e:'Diagnosis: clinical exam, rapid antigen test, throat culture (most sensitive). Monospot is for mononucleosis.',s:'Slide 6'},
 {q:'Why should ALL GABHS pharyngitis be treated?',c:['To prevent rheumatic fever','To prevent mononucleosis','Because it is always fatal','To prevent hearing loss'],a:0,e:'"All GABHS should be treated to prevent rheumatic fever" (objective: importance of treating GABHS).',s:'Slide 6'},
 {q:'Which is listed as an "other" infectious cause of pharyngitis on Dr. Strabbing\'s slide?',c:['Diphtheria','Rhinovirus only','Aspergillus','Mycoplasma'],a:0,e:'Other infectious causes: syphilis, pertussis, gonorrhea, diphtheria, candidiasis, acute HIV infection.',s:'Slide 7'},

addN('4.02',[
 {h:'Tonsil + adenoid anatomy (Waldeyer\'s ring)',b:'<table><tr><th>Parent</th><th>Branch</th><th>Pole</th></tr><tr><td>Lingual a.</td><td>dorsal lingual</td><td>lower</td></tr><tr><td><b>Facial a.</b></td><td>ascending palatine + <b>tonsillar a. (main)</b></td><td>lower</td></tr><tr><td>External carotid</td><td>ascending pharyngeal</td><td>upper</td></tr><tr><td>Internal maxillary</td><td>greater + descending palatine</td><td>upper</td></tr></table>Adenoids: ascending pharyngeal (ECA) + minor internal maxillary and facial (ascending palatine). Present at birth, enlarge in childhood, regress at puberty.',s:'Slides 3-4'},
 {h:'Pharyngitis',b:'Acute pharyngitis: primarily infectious (mostly viral); also sinonasal disease, GERD, smoking, intubation.<br><b>GABHS</b>: most common bacterial cause; dx clinical, rapid antigen, <b>throat culture (most sensitive)</b>; treat ALL to prevent <b>rheumatic fever</b>.<br>Other infectious: syphilis, pertussis, gonorrhea, diphtheria, candidiasis, acute HIV.<br><b>Herpangina</b> (Hand-Foot-Mouth): Coxsackie A, small vesicles/ulcers; supportive.<br><b>Mono</b> (EBV): high fever, <b>posterior triangle</b> LAD, malaise, hepatosplenomegaly; monospot, EBV panel, atypical lymphocytes.',s:'Slides 5-9'},
 {h:'Peritonsillar + parapharyngeal abscess',b:'<b>PTA</b>: infection outside the tonsillar capsule into the peritonsillar space. Unilateral otalgia, uvular deviation, odynophagia. Large/airway → urgent I&amp;D; small → antibiotics + close follow-up.<br><b>Parapharyngeal abscess</b>: trismus, fever, muffled voice, dysphagia, unilateral otalgia. Complications: aspiration, airway compromise, CN palsies, carotid blowout. Tx: external drainage, frequently tracheostomy.',s:'Slides 10, 13'},
 {h:'Tonsillectomy &amp; adenoidectomy',b:'Most common major pediatric surgery in the US (cautery, cold, coblation, laser).<br><b>Absolute</b>: OSA, possible malignancy. <b>Relative</b>: recurrent acute tonsillitis (7 in 1 yr / 5 per yr ×2 / 3 per yr ×3), PTA, chronic tonsillitis, strep carrier.<br><b>Complications</b>: immediate/delayed hemorrhage, anesthetic, dehydration, pulmonary edema (sudden relief of obstruction), velopharyngeal insufficiency, velopharyngeal stenosis.',s:'Slides 11-12'},
]);

 {q:'Which is a MALIGNANT salivary gland neoplasm on the slide?',c:['Adenoid cystic carcinoma','Oncocytoma','Pleomorphic adenoma','Monomorphic adenoma'],a:0,e:'Malignant list: mucoepidermoid carcinoma, malignant mixed tumors, adenocarcinoma, adenoid cystic carcinoma, acinic cell carcinoma, squamous cell carcinoma.',s:'Slide 12'},

]);
addN('4.03',[
 {h:'Salivary gland anatomy',b:'<b>Parotid</b> (largest, ~20 g): deep part contacts parapharyngeal space; <b>Stensen\'s duct</b> parallels zygoma → opposite <b>upper 2nd molar</b>; <b>facial nerve = most superficial</b> structure through it. Parasympathetic: <b>inferior salivatory nucleus → CN IX → otic ganglion → auriculotemporal (V3)</b>.<br><b>Submandibular</b> (~10 g): hypoglossal deep to digastric tendon; facial artery medial to posterior belly of digastric then hooks over into gland; lingual nerve between medial pterygoid and ramus, enters mouth below lower 3rd molar. Parasympathetic: <b>superior salivatory nucleus → nervus intermedius → chorda tympani</b>.<br><b>Sublingual</b>: smallest, submucosal anterior floor of mouth.<br><b>Minor</b>: 600-1000; densest in hard + soft palate.',s:'Slides 2-5'},
 {h:'Salivary disease',b:'<b>Infectious</b>: acute sialadenitis (dehydrated pts), chronic recurrent sialadenitis, mumps/viral parotitis, granulomatous (actinomycosis).<br><b>Noninfectious</b>: recurrent parotitis, sialectasis, calculi/strictures, sialolithiasis, Sjögren\'s.<br><b>Benign tumors</b>: pleomorphic adenoma, monomorphic adenoma, Warthin\'s, oncocytoma.<br><b>Malignant</b>: mucoepidermoid, malignant mixed, adenocarcinoma, adenoid cystic, acinic cell, SCC.',s:'Slides 6-12'},
]);

 {q:'Which head and neck site has the highest rate of second primaries?',c:['Oral cavity','Larynx','Nasopharynx','Parotid'],a:0,e:'"The oral cavity has the highest rate of second primaries."',s:'Slide 3'},

 {q:'The soft palate belongs to which subsite group?',c:['Oropharynx','Oral cavity','Nasopharynx','Hypopharynx'],a:0,e:'The oral cavity ends at the hard/soft palate junction; soft palate is an oropharyngeal subsite.',s:'Slides 4, 12'},
 {q:'The most common pathology of oral cancer is:',c:['Squamous cell carcinoma','Melanoma','Basal cell carcinoma','Lymphoma'],a:0,e:'Oral cancer pathology list (SCC first): SCC, verrucous carcinoma, basal cell carcinoma, salivary gland malignancies, melanoma (objective: most common types).',s:'Slide 7'},
 {q:'Which pathologies are listed for OROPHARYNGEAL cancer?',c:['Squamous cell carcinoma, lymphoepitheliomas, lymphomas','Verrucous carcinoma, melanoma, basal cell','Pleomorphic adenoma, Warthin tumor','Adenocarcinoma only'],a:0,e:'Oropharyngeal pathology: SCC, lymphoepitheliomas, lymphomas.',s:'Slide 13'},

const NM='AFP article';
addQ('4.04',[
 {q:'When an adult presents with a neck mass, what is the greatest concern?',c:['Malignancy','Congenital cyst','Viral adenitis','Thyroid hormone excess'],a:0,e:'"When an adult patient presents with a neck mass, malignancy is the greatest concern."',s:'Article p1'},
 {q:'Which are the most significant predictors of neoplasia in an adult neck mass?',c:['Patient age (most important), size and duration of the mass','Fever and sore throat','Pet exposure','Tenderness and erythema'],a:0,e:'Age, size and duration are the most significant predictors; age is most important (risk rises with age). Smoking, heavy alcohol, prior radiation ↑malignancy likelihood. Travel, trauma, insect bites, pets/farm animals suggest inflammatory/infectious causes.',s:'Article p2'},
 {q:'Which lymph node characteristics require further evaluation per the article?',c:['Fixed, firm or matted nodes, and nodes larger than 1.5 cm','Soft, mobile nodes under 1 cm','Any tender node during a cold','Nodes that shrink in 1 week'],a:0,e:'Lymph nodes are the most common site of neck masses; fixed, firm, matted or &gt;1.5 cm nodes need further evaluation.',s:'Article p2'},
 {q:'The submandibular gland lies within a triangle bounded by:',c:['The sternocleidomastoid, the posterior belly of the digastric, and the body of the mandible','The trapezius, SCM and clavicle','The hyoid, thyroid cartilage and cricoid','The mandible ramus, masseter and zygoma'],a:0,e:'Submandibular glands lie in a triangle bounded by SCM, posterior belly of digastric and mandible body; may become ptotic and prominent in older patients. Parotid tail extends below the mandible angle, inferior to the earlobe.',s:'Article p2'},
 {q:'What is the most common congenital mass of the LATERAL neck in adults?',c:['Branchial anomaly (cyst, sinus or fistula) along the SCM','Thyroglossal duct cyst','Dermoid','Thymic rest'],a:0,e:'Branchial anomalies are the most common congenital lateral neck masses: soft, slow-growing, painless, anywhere along the SCM; often prior infection/discharge/I&amp;D. CT shows cyst medial to SCM at hyoid level.',s:'Article p3'},
 {q:'Why should FNA be performed BEFORE excising a presumed branchial cleft cyst in an adult?',c:['Because cystic metastases from squamous cell carcinoma of Waldeyer\'s ring can mimic a branchial cyst','To prevent infection','FNA cures the cyst','It is never needed'],a:0,e:'FNA before excision because of possible cystic metastases from SCC within Waldeyer\'s tonsillar ring; excision with frozen sections to exclude malignancy.',s:'Article p3-4'},
 {q:'Which is TRUE about thyroglossal duct cysts in the article?',c:['May contain the patient\'s only thyroid tissue; thyroid carcinoma has been reported in them','Never related to the hyoid','Never elevate with swallowing','Always lateral'],a:0,e:'Most common congenital central neck anomaly; tract along thyroid descent from tongue base; intimately related to central hyoid; elevates with swallowing; may be the only thyroid tissue; thyroid carcinoma reported. Abnormal TFTs → thyroid scan; some advocate routine US/nuclear scan to avoid permanent hypothyroidism.',s:'Article p4'},
 {q:'Treatment of choice for a thyroglossal duct cyst per the article:',c:['Sistrunk procedure: complete excision including the central hyoid, extending to the tongue base if needed','Antibiotics alone','I&amp;D','Thyroidectomy'],a:0,e:'Sistrunk procedure = complete cyst excision with the central portion of the hyoid, extending to tongue base if necessary.',s:'Article p5'},
 {q:'Probably the most common cause of an INFLAMMATORY neck mass:',c:['Cervical adenitis','Cat-scratch disease','Tuberculosis','Kimura disease'],a:0,e:'Cervical adenitis = painful enlargement of normal nodes in response to infection/inflammation; probably the most common inflammatory neck mass; usually self-limited over weeks.',s:'Article p5'},
 {q:'Organisms most commonly cultured from neck abscesses, and treatment:',c:['Staphylococcus and Streptococcus (often polymicrobial); IV antibiotics ± surgical drainage','Mycobacteria; clarithromycin','Bartonella; observation','Fungi; amphotericin'],a:0,e:'Staph and Strep most commonly cultured (often polymicrobial); IV antibiotics; drainage may be needed.',s:'Article p5'},
 {q:'Tuberculous cervical adenitis typically presents:',c:['In older patients with TB exposure and a positive PPD; treat with antituberculous drugs for 6-12 months','In children with negative PPD; surgical curettage','With multiple tender nodes; antibiotics 10 days','Only in HIV-negative children'],a:0,e:'Mycobacterial infection: single enlarged node, rarely tender. Typical TB: older patient, TB exposure, positive PPD → antituberculous therapy 6-12 months.',s:'Article p5'},
 {q:'Atypical (nontuberculous) mycobacterial cervical adenitis typically occurs in:',c:['Children with a nonreactive PPD and no exposure; standard treatment is surgical removal with curettage','Older adults with positive PPD; 12 months of RIPE','Pregnant women; observation','Smokers; radiation'],a:0,e:'Atypical mycobacteria: children, nonreactive PPD, no exposure; untreated may drain → chronic fistula; surgical removal with curettage is standard; antibiotics for recurrence. HIV+ adults with NTM nodes: clarithromycin; surgery for resistant disease.',s:'Article p6'},
 {q:'Per the article, HIV testing should be considered in:',c:['Any adult with cervical adenopathy','Only patients with weight loss','Only children','Only those with supraclavicular nodes'],a:0,e:'"HIV infection should be considered in any adult with cervical adenopathy, and appropriate serologic testing is indicated."',s:'Article p6'},
 {q:'Cat-scratch disease (Bartonella henselae) neck adenopathy:',c:['Usually a single node that can appear days to months after the injury and resolves without treatment','Always bilateral and suppurative','Requires excision','Posterior triangle only'],a:0,e:'Cat-scratch: adenopathy days to months after injury; usually one node; returns to normal without treatment.',s:'Article p6'},
 {q:'Toxoplasmosis as a cause of a neck mass typically presents as:',c:['A single enlarged posterior triangle node with a benign course; no antibiotics needed','Bilateral jugular nodes requiring IV therapy','A thyroid nodule','A submental abscess'],a:0,e:'Toxoplasmosis: single enlarged posterior-triangle node; benign; antibiotics not needed.',s:'Article p6'},
 {q:'A patient presents months after a car crash with a pulsatile, soft, fixed neck mass with a thrill/bruit. Likely cause?',c:['Pseudoaneurysm or arteriovenous fistula from blunt trauma','Lipoma','Branchial cyst','Toxoplasmosis'],a:0,e:'Pseudoaneurysm/AV fistula from shearing blunt trauma; if missed initially → later pulsatile soft fixed mass with thrill or bruit.',s:'Article p6'},
 {q:'Castleman disease is:',c:['A benign lymphoproliferative disorder (usually mediastinal) that in the neck presents as unexplained cervical adenopathy; often needs multiple biopsies','A malignant salivary tumor','A form of TB','A congenital cyst'],a:0,e:'Castleman: benign lymphoproliferative disorder, most often mediastinal nodes; in neck = cervical adenopathy of unknown cause; multiple biopsies showing florid lymphoid hyperplasia often needed. Kimura: chronic inflammatory subcutaneous tumor-like lesion of head/neck.',s:'Article p7'},
 {q:'A soft neck mass that is isodense with fat on MRI is most consistent with:',c:['Lipoma','Neuroma','Hemangioma','Metastatic SCC'],a:0,e:'Benign neoplasms: lipomas (soft, fat signal on MRI), hemangiomas (cutaneous signs), neuromas (rarely deficits), fibromas; slow-growing, noninvasive; usually diagnosed at excision.',s:'Article p7'},
 {q:'The most common presentation of thyroid or salivary gland cancer:',c:['An asymptomatic nodule within the gland (always evaluate further)','Painful diffuse swelling','Supraclavicular node','Hoarseness only'],a:0,e:'Primary neck malignancies: thyroid, salivary, lymphoma, sarcoma. Thyroid/salivary cancer most commonly = asymptomatic nodule; further evaluation always indicated.',s:'Article p7'},
 {q:'Risk factors for mucosal head and neck cancer listed in the article:',c:['Chronic sun exposure, tobacco and alcohol, poor dentition, industrial/environmental exposures, family history','Pets and travel','Insect bites','Young age'],a:0,e:'Mucosal H&amp;N cancer (oral cavity, larynx, pharynx) risks: sun, tobacco, alcohol, poor dentition, industrial/environmental exposure, family history. Symptoms: nonhealing ulcer, persistent sore throat, dysphagia, voice change, weight loss.',s:'Article p8'},
 {q:'Per Figure 2, a metastatic node in the SUBMANDIBULAR triangle most likely comes from:',c:['Anterior two-thirds of tongue, floor of mouth, gums, cheek mucosa','Nasopharynx','Thyroid','Lower lip only'],a:0,e:'Submandibular group: anterior 2/3 tongue, floor of mouth, gums, buccal mucosa. Oral cavity cancers typically metastasize to the submandibular triangle; most other H&amp;N sites spread to the lateral neck.',s:'Article p8, Figure 2'},
 {q:'Per Figure 2, the SUBMENTAL nodes are rarely involved early EXCEPT in cancer of the:',c:['Lip','Larynx','Thyroid','Nasopharynx'],a:0,e:'Submental triangle: rarely involved early, except metastasis from lip cancer.',s:'Article Figure 2'},
 {q:'Per Figure 2, the POSTERIOR TRIANGLE nodes receive metastases from:',c:['Nasopharynx, posterior scalp, ear, temporal bone or skull base','Anterior tongue','Thyroid and pyriform sinus','Lower lip'],a:0,e:'Posterior triangle: nasopharynx, posterior scalp, ear, temporal bone, skull base.',s:'Article Figure 2'},
 {q:'Per Figure 2, the LOWER jugular chain (supraclavicular) nodes receive metastases from:',c:['Thyroid, pyriform sinuses, upper esophagus (rarely a primary below the clavicle)','Lip','Anterior tongue','Posterior scalp'],a:0,e:'Lower jugular chain/supraclavicular: thyroid, pyriform sinuses, upper esophagus; rarely primary below the clavicle. Text: palpable supraclavicular nodes → evaluate for malignancy below the clavicles (e.g., lung).',s:'Article p8, Figure 2'},
 {q:'Per Figure 2, the UPPER jugular chain (jugulodigastric/posterior auricular) nodes are classically involved by metastasis from the:',c:['Nasopharynx','Lip','Thyroid','Upper esophagus'],a:0,e:'Upper jugular chain/jugulodigastric area: metastasis from nasopharynx.',s:'Article Figure 2'},
 {q:'Per Figure 2, the MIDJUGULAR chain (deep lateral cervical) nodes receive metastases from:',c:['Any portion of the oral cavity, pharynx or larynx, especially Waldeyer\'s ring (nasopharynx, tonsil, base of tongue)','Only the lip','Only the thyroid','Only the scalp'],a:0,e:'Midjugular chain: any portion of oral cavity, pharynx or larynx, especially Waldeyer\'s ring (nasopharynx, tonsil, tongue base).',s:'Article Figure 2'},
 {q:'A patient has a neck mass with fever, pain and erythema after a recent infection. Reasonable initial management per the article text?',c:['A single course of a broad-spectrum antibiotic and reassessment in 1-2 weeks','Immediate open biopsy','Radiation','Observation for 6 months without follow-up'],a:0,e:'Inflammatory signs/recent infection → single course of broad-spectrum antibiotic, reassess in 1-2 weeks; many inflammatory nodes resolve, but close observation is required.',f:'Article text says reassess in <b>1-2 weeks</b>; the Figure 4 algorithm (also on Strabbing 4.13 slide 4) says follow-up in <b>2-4 weeks</b>. The abstract says ENT consult if persisting beyond <b>4-6 weeks</b> after one antibiotic course.',s:'Article p1, p9, Figure 4'},
 {q:'When should a neck mass undergo FNA per the article?',c:['Thyroid and salivary nodules, masses persisting beyond 4-6 weeks, or when no cause is found on initial evaluation','Only if malignant on CT','Never in adults','Only after excision'],a:0,e:'FNA for thyroid and salivary nodules; for masses persisting &gt;4-6 weeks; typically when no cause found initially. Sensitivity/specificity &gt;90% in experienced hands.',s:'Article p9'},
 {q:'Tumor seeding risk with fine-needle aspiration of head and neck masses:',c:['Exceedingly low; no cases reported with FNA (seeding linked to large-diameter needles)','High; FNA is contraindicated','Moderate; requires radiation of the tract','Unknown'],a:0,e:'Large-diameter needles have been associated with seeding; no cases with FNA; risk exceedingly low.',s:'Article p9'},
 {q:'The best imaging technique for evaluating an adult neck mass:',c:['Contrast-enhanced CT (plus a recent chest radiograph)','Plain neck film','PET only','No imaging'],a:0,e:'Contrast-enhanced CT is the best imaging technique when diagnosis is unclear; also obtain a recent chest radiograph; routine serology excludes rare metabolic causes.',s:'Article p9-10'},
 {q:'Which feature should prompt biopsy of a neck mass?',c:['Progressive growth, supraclavicular location, size &gt;3 cm, or lymphoma symptoms','A 1 cm tender node during a cold','Any mobile soft mass','A midline mass that moves with swallowing'],a:0,e:'Consider biopsy for progressive growth, supraclavicular location, size &gt;3 cm, or lymphoma symptoms. If frozen section shows metastatic carcinoma → neck dissection. Non-reactive findings → ENT for endoscopy, possible excisional biopsy/neck dissection.',s:'Article p10'},
 {q:'In the article\'s algorithm, an inflammatory mass that fails to improve after antibiotics should next get:',c:['Chest radiograph and PPD; positive PPD → treatment/subspecialist; negative PPD or neoplasm findings → contrast CT and FNA → subspecialist','Repeat antibiotics indefinitely','Radiation','Sistrunk procedure'],a:0,e:'Figure 4: no improvement → CXR + PPD → positive: treat/subspecialist; negative or neoplastic findings → contrast CT + FNA → subspecialist.',s:'Article Figure 4; Strabbing 4.13 slide 4'},
]);
addN('4.04',[
 {h:'Big picture',b:'This is the syllabus "Head &amp; Neck Lymphatic Article" (tested on <b>anatomy sites and their draining nodes</b>, Figure 2). Malignancy is the greatest concern in adults. Age (most important), size and duration predict neoplasia. Young adults: inflammatory/infectious (cervical adenitis, cat-scratch). Older adults: neoplasms. Best tools: <b>FNA</b> + <b>contrast CT</b>. ENT (endoscopy ± excisional biopsy) if mass persists &gt;4-6 weeks after one broad-spectrum antibiotic course.',s:'Article p1-2'},
 {h:'Figure 2: node groups and likely primaries (TESTED)',b:'<img class="qimg" src="'+IMG.nm_fig2+'" alt="Figure 2"><table><tr><th>Node group</th><th>Primary site</th></tr><tr><td>Submental</td><td>Rarely early, except <b>lip</b></td></tr><tr><td>Submandibular</td><td>Anterior 2/3 tongue, floor of mouth, gums, cheek mucosa (oral cavity)</td></tr><tr><td>Upper jugular / jugulodigastric (posterior auricular)</td><td>Nasopharynx</td></tr><tr><td>Midjugular (deep lateral cervical)</td><td>Any oral cavity, pharynx or larynx; esp. Waldeyer\'s ring (nasopharynx, tonsil, base of tongue)</td></tr><tr><td>Lower jugular / supraclavicular</td><td>Thyroid, pyriform sinuses, upper esophagus; rarely below clavicle (text: evaluate below clavicles, e.g., lung)</td></tr><tr><td>Posterior triangle</td><td>Nasopharynx, posterior scalp, ear, temporal bone, skull base</td></tr></table>',s:'Article p8, Figure 2'},
 {h:'History, anatomy, exam',b:'Nodes = most common site; fixed/firm/matted or &gt;1.5 cm → evaluate. Submandibular gland triangle: SCM, posterior digastric, mandible. Parotid tail below mandible angle.<br>Acute fever/sore throat/cough → URI adenopathy. Chronic sore throat, dysphagia, voice change → pharynx/larynx. Travel, trauma, bites, pets/farm animals → infectious. Smoking, alcohol, prior radiation → malignancy.<br>Exam: skin (sun-damaged lesions), ears (branchial sinus), mucosa (remove dentures; palpate tongue base; tonsillar fossa asymmetry), laryngoscopy, palpate during swallow/Valsalva, flex/extend for posterior triangle, measure size.',s:'Article p2-3'},
 {h:'Differential',b:'<b>Congenital</b>: branchial anomalies (most common lateral; along SCM; CT cyst medial to SCM at hyoid; FNA first: cystic SCC mets from Waldeyer\'s ring; excise with frozen sections); cystic hygroma, dermoid. Thyroglossal duct cyst (most common central; hyoid; elevates with swallowing; may be only thyroid tissue; thyroid carcinoma reported; Sistrunk); thymic rests, dermoids.<br><b>Inflammatory/infectious</b>: cervical adenitis (most common); chronic sialadenitis; abscess (Staph/Strep, polymicrobial; IV abx ± drainage); TB (older, PPD +, 6-12 mo therapy); atypical mycobacteria (kids, PPD −, excision/curettage; HIV+ adults clarithromycin); test HIV in any adult with adenopathy; cat-scratch (Bartonella, single node, self-limited); toxoplasmosis (posterior triangle, benign); mono; actinomycosis.<br><b>Trauma</b>: hematoma (fibrosis), pseudoaneurysm/AV fistula (pulsatile, thrill/bruit).<br><b>Other</b>: gout, CPPD, inflammatory pseudotumor, Kimura, Castleman, sarcoidosis.<br><b>Benign tumors</b>: lipoma (fat on MRI), hemangioma, neuroma, fibroma.<br><b>Malignant</b>: primary (thyroid, salivary = asymptomatic nodule; lymphoma; sarcoma) or metastatic.',s:'Article p3-8'},
 {h:'Management',b:'Inflammatory signs → one broad-spectrum antibiotic course, reassess 1-2 wk (algorithm: 2-4 wk). FNA: thyroid/salivary nodules; persisting &gt;4-6 wk; no cause found; &gt;90% sens/spec; seeding exceedingly low (large needles, not FNA). Contrast CT best + recent CXR; routine serology. Non-reactive cytology/imaging → ENT endoscopy ± excisional biopsy/neck dissection. Biopsy if progressive, supraclavicular, &gt;3 cm, lymphoma symptoms; metastatic carcinoma on frozen section → neck dissection.<br><b>Algorithm</b>: congenital → CT → excision; inflammatory → antibiotics → improved: observe; not: CXR + PPD → + treat; − CT + FNA; neoplasm (age &gt;45, risks) → CT + FNA → endoscopy → manage by histology/stage.',f:'Reassessment interval: text 1-2 weeks vs algorithm 2-4 weeks.',s:'Article p9-11'},
]);

// ===== 4.05 Kowalski Larynx & Neck Pathology · 4.19.1 / 4.19.2 Kowalski Oronasopharynx I & II =====
addO('4.05',[
 {src:'Kowalski SIQ 1',q:'A professional motivational speaker sees her primary care physician due to increasing hoarseness that has forced her to cancel the remainder of a nationwide tour. On physical examination, the physician observes a nodule on the middle third of her true vocal cord. If a biopsy of this lesion were taken, it would most likely demonstrate…',c:['a portion of squamous-lined cystic wall','neoplastic epithelial clusters in a background of abundant lymphocytes','submucosal degeneration, inflammation, and fibrosis','squamous dysplasia, with chronic inflammation','invasive squamous cell carcinoma, with keratin pearl formation'],a:2,e:'Official answer: <b>C</b>. Reactive (singer\'s) nodules are reactive/reparative in nature, so variable degeneration, fibroblastic proliferation, edema, excess ECM, fibrosis, chronic inflammation, etc., will be seen.',s:'Handout p7-8'},
 {src:'Kowalski SIQ 2',q:'A 1 cm laryngeal lesion was biopsied, and its features can be seen in the submitted slide. Which of the following best describes the observed pathology?',img:IMG.k405_2,c:['acute inflammation','chronic inflammation','squamous papilloma','squamous cell carcinoma','paraganglioma'],a:3,e:'Official answer: <b>D</b>. SCC looks almost identical wherever it arises. Low power: abundant pink cytoplasm, tumor nests in no normal architecture (irregular nodules/nests, often whorled). Board clues: (1) <b>keratin pearls</b> (circled), (2) desmosomes = "intercellular bridges." You can\'t tell the site of origin from histology alone.',s:'Handout p8-9'},
]);
addQ('4.05',[
 {q:'A schoolteacher has hoarseness and bilateral small smooth nodules on the vocal cords. What is the pathogenesis?',c:['Mechanical/repetitive vocal stress → injury, inflammation, altered wound healing (reactive, not neoplastic)','Low-risk HPV infection','High-risk HPV with p53 loss','Neoplastic myoepithelial proliferation'],a:0,e:'Reactive (singer\'s) nodules: repetitive stress → injury → inflammation → altered wound healing → nodule. Bilateral = classic. Not dysplastic or neoplastic (papillomas and carcinomas are).',s:'Handout p2'},
 {q:'Risk factors for reactive vocal cord nodules include:',c:['Chronic dehydration, chronic vocal-use professions, female sex (adults), increased laryngeal inflammation','Smoking only','HPV 16','EBV'],a:0,e:'Risk: chronic dehydration (dry, easily injured mucosa), chronic vocal use, females &gt; males in adults, any laryngeal inflammation. Diagnosis primarily by endoscopic visualization; lesions smooth, mucosa-covered, small (~1-5 mm), sessile or pedunculated.',s:'Handout p2'},
 {q:'Laryngeal squamous papilloma is caused by:',c:['Low-risk HPV (types 6 and 11)','High-risk HPV 16 and 18','EBV','Mechanical stress only'],a:0,e:'Squamous papilloma: benign neoplasm, fingerlike projections with central fibrovascular cores (papillomatous hyperplasia), low-risk HPV 6/11; can recur or be multiple (papillomatosis).',s:'Handout p2'},
 {q:'Histology of a laryngeal squamous papilloma:',c:['Hyperplastic squamous proliferation in fingerlike projections with central fibrovascular cores','Nests of uniform cells in a zellballen pattern','Submucosal fibrosis with intact mucosa only','Keratin pearls invading stroma'],a:0,e:'Papillomatous hyperplasia with fibrovascular cores. Zellballen = paraganglioma; fibrosis/edema = reactive nodule; keratin pearls invading = SCC.',s:'Handout p2-3'},
 {q:'HPV E6 and E7 proteins immortalize cells by altering which tumor suppressors?',c:['E6 → p53; E7 → RB','E6 → RB; E7 → p53','Both → APC','Both → BRCA1'],a:0,e:'E6 and E7 act synergistically: E6 alters p53, E7 alters RB.',s:'Handout p3; 4.19.1 p4'},
 {q:'The typical patient with laryngeal SCC is:',c:['An older male chronic smoker with hoarseness, dysphagia, dysphonia','A young woman with vocal overuse','A child with HPV 6/11','A nonsmoker with high-risk HPV in most cases'],a:0,e:'Smoking is most likely causative; older, male, chronic smokers; hoarseness, dysphagia, dysphonia. High-risk HPV is much less associated with laryngeal SCC than with oropharyngeal SCC.',s:'Handout p3'},
 {q:'Compared with oropharyngeal SCC, laryngeal SCC is:',c:['Much less often associated with high-risk HPV','More often HPV-associated','Never related to smoking','Usually a salivary tumor'],a:0,e:'HPV association: oropharyngeal SCC ~65-70% vs laryngeal SCC ~20-30%.',s:'Handout p3'},
 {q:'Early laryngeal SCC precursors can grossly appear as all EXCEPT:',c:['Bilateral smooth singer\'s nodules','Leukoplakia','Erythroplakia','Somewhat polypoid masses'],a:0,e:'Progression hyperplasia → dysplasia → neoplasia; early lesions may look like leukoplakia, erythroplakia or polypoid masses; invasive SCC typically ulcerates.',s:'Handout p3'},
 {q:'A branchial cleft cyst is a remnant of which embryologic structure, and where does it present?',c:['Second branchial arch; lateral upper neck along the sternocleidomastoid','Thyroglossal duct; midline below the hyoid','Third pharyngeal pouch; anterior mediastinum','First arch; preauricular'],a:0,e:'Branchial cleft cysts = remnants of the 2nd branchial arch; lateral upper neck along SCM; usually 2-5 cm; true cysts lined by stratified squamous or pseudostratified columnar epithelium with inflamed wall; excision curative.',s:'Handout p4'},
 {q:'Which lining is characteristic of BOTH branchial cleft cysts and thyroglossal duct cysts?',c:['Stratified squamous or pseudostratified columnar epithelium','Transitional epithelium','Simple cuboidal only','No epithelial lining'],a:0,e:'Both can be lined by stratified squamous or pseudostratified columnar epithelium (true cysts).',s:'Handout p4'},
 {q:'A thyroglossal duct cyst typically lies:',c:['Midline just below the hyoid bone','Lateral along the SCM','In the anterior mediastinum','In the parotid'],a:0,e:'The thyroid descends via the thyroglossal duct from the tongue base toward the suprasternal notch; if it doesn\'t atrophy, remnants form cysts, usually midline just below the hyoid. Cysts develop when secretions don\'t drain → infection/inflammation. Surgery curative; malignant transformation rarely reported.',s:'Handout p4'},
 {q:'A carotid body tumor is a type of:',c:['Paraganglioma (neural crest-derived neuroendocrine tumor)','Squamous cell carcinoma','Lymphoma','Thymoma'],a:0,e:'Carotid bodies = chemoreceptors near carotid bifurcations (neural crest cells in a vascular matrix; sense PaO<sub>2</sub>; signal via CN IX). Paraganglioma = tumor of neuroendocrine cells associated with autonomic nervous system. Most common paraganglioma overall: pheochromocytoma (intra-adrenal).',s:'Handout p5'},
 {q:'Classic histology of a paraganglioma:',c:['Small nests of uniform cells (zellballen) separated by vascular septae; chromogranin positive','Keratin pearls','Fingerlike fibrovascular cores','Epithelial cells amid abundant lymphocytes'],a:0,e:'Zellballen pattern; delicate capillary-rich septae (bleed profusely at surgery); chromogranin (dense-core granule protein) positive on IHC.',s:'Handout p5-6'},
 {q:'Clinical behavior of carotid body tumors:',c:['Slow-growing, usually asymptomatic/painless mass in the 50s-60s; biology hard to predict on histology (a substantial fraction fatal)','Rapidly growing painful mass in children','Always benign','Always metastatic at diagnosis'],a:0,e:'Slow-growing, asymptomatic or painless mass, 50s-60s; like neuroendocrine tumors, behavior hard to predict from histology; ~50% fatal from local or metastatic disease.',s:'Handout p5'},
 {q:'Why can a thymoma occasionally be found in the neck?',c:['The thymus develops from the 3rd and 4th pharyngeal pouches, leaving possible remnants in the neck','It always arises in the thyroid','It metastasizes there routinely','It originates from the 2nd branchial arch'],a:0,e:'Thymus = anterior-superior mediastinum (epithelial + lymphoid cells); thymoma = neoplasm of thymic epithelium; develops from 3rd/4th pharyngeal pouches → remnants in neck.',s:'Handout p6'},
 {q:'A thymoma may come to clinical attention during workup of which disease in a substantial minority of cases?',c:['Myasthenia gravis','Sjögren syndrome','Wegener granulomatosis','Cystic fibrosis'],a:0,e:'Thymoma presentations: impingement on mediastinal/neck structures; workup of myasthenia gravis (~30-45% of cases); incidental. Associated autoimmunity: pernicious anemia, pure red cell aplasia, Graves, myocarditis (aberrant T-cell activation).',s:'Handout p6'},
 {q:'Thymoma histology:',c:['Neoplastic epithelial cell clusters among abundant non-neoplastic T lymphocytes (thymocytes), sometimes in Hassall-corpuscle-like structures','Zellballen nests','Keratin pearls with desmosomes','Papillary bilayer with germinal centers'],a:0,e:'Few eosinophilic neoplastic epithelial clusters, abundant non-neoplastic T lymphocytes; structures resembling Hassall corpuscles.',s:'Handout p6'},
 {q:'A thymic tumor is surgically invasive but histologically benign. Classification?',c:['Invasive thymoma','Noninvasive thymoma','Thymic carcinoma','Thymic hyperplasia'],a:0,e:'Noninvasive thymoma: not surgically invasive, benign histology. Invasive thymoma: surgically invasive, benign histology. Thymic carcinoma: histologically malignant (usually SCC), often local spread/metastasis.',s:'Handout p7'},
 {q:'Which feature most specifically identifies squamous cell carcinoma on histology?',c:['Keratin pearls and intercellular bridges (desmosomes)','Glandular formation','Zellballen','Fibrovascular cores'],a:0,e:'Keratin pearls (eosinophilic keratin collections) and desmosomes ("intercellular bridges") are the board clues; SCC histology looks the same regardless of site.',s:'Handout p8-9'},
]);
addN('4.05',[
 {h:'Laryngeal nodules: reactive vs papilloma vs SCC',b:'<b>Reactive (singer\'s) nodule</b>: repetitive vocal stress → injury, inflammation, altered wound healing. Bilateral classic. Risk: dehydration, vocal professions, females (adults), laryngeal inflammation. Endoscopic diagnosis; smooth, mucosa-covered, 1-5 mm, sessile or pedunculated. Histology: submucosal degeneration, edema, fibrosis, chronic inflammation. Not dysplastic.<br><b>Squamous papilloma</b>: benign neoplasm; fingerlike projections with fibrovascular cores; <b>low-risk HPV 6/11</b>; recurs/multiple (papillomatosis). HPV E6 → p53, E7 → RB.<br><b>SCC</b>: smoking; older male smokers; hoarseness, dysphagia, dysphonia; hyperplasia → dysplasia → carcinoma; early = leuko/erythroplakia/polypoid; invasive ulcerates. HPV: oropharynx 65-70% vs larynx 20-30%. Can arise on, above or below cords, epiglottis, aryepiglottic folds, pyriform sinuses. Trend: conservative surgery + radiation. Histology: keratin pearls, intercellular bridges.',s:'Handout p2-3, p8-9'},
 {h:'Neck cysts',b:'<b>Branchial cleft cyst</b>: 2nd arch remnant; lateral upper neck along SCM; 2-5 cm; stratified squamous or pseudostratified columnar lining, inflamed wall; excision curative.<br><b>Thyroglossal duct cyst</b>: duct remnant (tongue base → suprasternal notch); midline just below hyoid; same lining options; forms when secretions don\'t drain → infection; surgery curative; rare malignancy.',s:'Handout p4'},
 {h:'Paraganglioma + thymoma',b:'<b>Carotid body tumor (paraganglioma)</b>: carotid body = neural crest chemoreceptor (PaO<sub>2</sub> → CN IX). Slow, painless, 50s-60s; behavior unpredictable (~50% fatal). Zellballen nests, vascular septae (bleeds), chromogranin +. Most common paraganglioma = pheochromocytoma.<br><b>Thymoma</b>: thymic epithelial neoplasm; thymus from 3rd/4th pouches (neck remnants). Presents by mass effect, myasthenia gravis workup (~30-45%), or incidentally; autoimmunity (pernicious anemia, pure red cell aplasia, Graves, myocarditis). Epithelial clusters + abundant T cells (Hassall-like). Noninvasive / invasive thymoma / thymic carcinoma (usually SCC).',s:'Handout p5-7'},
]);
addO('4.19.1',[
 {src:'Kowalski SIQ 1',q:'A 22-year-old male complains of recent onset of painful blisters around the lips. On examination you see many clusters of vesicles which are closely spaced and surrounded by an erythematous base. These involve the corners of the mouth, immediately beneath the nares, and a few are located on the chin. The most likely diagnosis is …',c:['aphthous ulcer','candidiasis','leukoplakia','herpes simplex virus','pyogenic granuloma'],a:3,e:'Official answer: <b>D</b>. Classic recurrent outbreak of herpes.',s:'Handout p9-10'},
 {src:'Kowalski SIQ 2',q:'A 30-year-old male presents with confluent white patches on his oral mucosa. The patches have a corrugated, roughened appearance and do not scrape off. An additional likely finding in this patient is …',c:['cervical lymph node metastases','circulating autoantibodies to keratin','HIV infection','oral squamous cell carcinoma in-situ','similar lesions in lower gastrointestinal tract'],a:2,e:'Official answer: <b>C</b>. This is hairy leukoplakia, often seen with immunosuppression. A discussion about HIV risk factors and HIV testing are next steps.',s:'Handout p9-10'},
 {src:'Kowalski SIQ 3',q:'This oral cavity lesion best illustrates …',img:IMG.k4191_3,c:['normal mucosa','inflammation','squamous hyperplasia','benign neoplasia','malignant neoplasia'],a:4,e:'Official answer: <b>E</b>. The surface mucosa is intact on the left, then becomes irregular and thickened to the right. Variably-sized epithelial nests of SCC bud off from, or are continuous with, the surface: an invasive neoplasm growing into the submucosa.',s:'Handout p9-10'},
]);
addQ('4.19.1',[
 {q:'Aphthous ulcers (canker sores) are characterized by:',c:['Recurrent, very painful ulcers of unknown etiology lasting 5-10 days, on soft (non-keratinized) mucosa such as buccal mucosa, floor of mouth, inner lips','Painless ulcers on the hard palate and attached gingiva','Vesicles caused by HSV-1','White plaques that scrape off'],a:0,e:'Aphthae: about a third of people; unknown etiology; very painful; resolve in 5-10 days; diverse triggers; can recur in autoimmune flares; on soft mucosa (not hard palate/gingiva near teeth); also in GI and anogenital mucosa.',s:'Handout p2'},
 {q:'Where do aphthous ulcers typically NOT occur?',c:['Hard palate and gingiva near the teeth','Buccal mucosa','Floor of mouth','Inside of the lips'],a:0,e:'They favor soft mucosa rather than hard surfaces (hard palate, attached gingiva). Recurrent HSV, by contrast, favors keratinized sites like the hard palate and attached gingiva (4.17).',s:'Handout p2'},
 {q:'Classic histologic finding in herpes infection:',c:['Cowdry type A intranuclear (ground-glass) inclusions and multinucleated giant cells','Keratin pearls','Koilocytes with raisinoid nuclei','Pseudohyphae and yeast'],a:0,e:'HSV: viral cytopathic change with clear/ground-glass Cowdry type A intranuclear inclusions; fusion → multinucleated giant cells.',s:'Handout p3'},
 {q:'In adults, recurrent herpetic lesions on DRY surfaces such as the external lip typically:',c:['Remain as crusty blisters','Become deep ulcers','Turn into white plaques','Become polypoid'],a:0,e:'On wet mucosa vesicles burst into ulcers; on dry surfaces (herpes labialis) they remain crusty blisters; fewer lesions than primary; resolve in 5-10 days. Virus lives in local ganglion cells.',s:'Handout p2'},
 {q:'Most children with primary HSV-1 infection are:',c:['Asymptomatic (a minority get acute herpetic gingivostomatitis)','Severely ill','Hospitalized','Infected with HSV-2'],a:0,e:'Usually HSV-1, primary in childhood, mostly asymptomatic; a minority develop numerous oral vesicles, fever, lymphadenopathy (acute herpetic gingivostomatitis).',s:'Handout p2'},
 {q:'Which is a risk factor for oral SCC on Dr. Kowalski\'s list?',c:['Betel leaf/quid (paan) consumption','HPV 6','EBV','Aphthous ulcers'],a:0,e:'Oral SCC risks: alcohol, tobacco, betel leaf/quid/paan (may contain carcinogens), radiation/sunlight (lip SCC), HPV (high-risk, mainly oropharynx).',s:'Handout p3'},
 {q:'High-risk HPV (e.g., HPV-16) is implicated in most SCC of which site?',c:['Oropharynx (tonsils, base of tongue, soft palate)','Oral cavity proper (oral tongue, floor of mouth)','Lip','Larynx'],a:0,e:'HPV implicated in ~70% of oropharyngeal SCC but only uncommonly in oral cavity SCC.',s:'Handout p3'},
 {q:'Which is a risk factor specifically for LIP SCC?',c:['Radiation such as sunlight','Betel quid only','HPV 6','Candida'],a:0,e:'"Radiation (such as sunlight) is a risk factor for lip SCC."',s:'Handout p3'},
 {q:'HPV E6 promotes oncogenesis by:',c:['Degrading p53 and stimulating TERT (telomerase) expression','Binding RB','Inactivating p21 and p27','Activating cyclins E and A'],a:0,e:'E6: degrades p53 (less arrest, senescence, apoptosis) and stimulates TERT → immortalization. E7: binds RB, inactivates p21/p27, may activate cyclins E and A.',s:'Handout p4'},
 {q:'HPV E7 promotes cell cycle progression by:',c:['Binding RB, inactivating CDK inhibitors p21/p27, and (high-risk types) activating cyclins E and A','Degrading p53','Stimulating TERT only','Blocking EGFR'],a:0,e:'E7 binds RB, inactivates p21 and p27, and may activate cyclins E and A.',s:'Handout p4'},
 {q:'Invasive SCC of the head and neck usually presents grossly as:',c:['An ulcer (wholly or partially) in the mass','A smooth mucosa-covered polyp','A white plaque that scrapes off','A bluish fluctuant swelling'],a:0,e:'Precursor dysplasias are often flat/plaque-like; fully invasive SCC usually presents with ulcer. Most head and neck neoplasia is squamous (salivary ~5%).',s:'Handout p3'},
 {q:'A patient has a saddle-nose deformity, glomerulonephritis and PR3-ANCA (c-ANCA). Diagnosis?',c:['Granulomatosis with polyangiitis (Wegener)','Mucormycosis','Nasopharyngeal carcinoma','Pyogenic granuloma'],a:0,e:'GPA: necrotizing vasculitis with granulomas; upper airway ± lung ± glomerulonephritis; PR3-ANCA (c-ANCA). Septal destruction → saddle nose.',s:'Handout p5'},
 {q:'Histologic appearance of mucormycosis:',c:['Broad, non-septated hyphae with right-angle branching; angioinvasive','Narrow septate hyphae with acute-angle branching','Yeast with pseudohyphae','Spherules with endospores'],a:0,e:'Mucor: broad non-septate hyphae, right-angle branching; angioinvasive → necrosis, local invasion into orbit and cranial vault.',s:'Handout p5'},
 {q:'Oral candidiasis in an immunocompetent vs immunocompromised patient:',c:['Immunocompetent: superficial; immunocompromised: may invade deeper or disseminate','Both always disseminate','Both always superficial','Immunocompetent patients get hairy leukoplakia instead'],a:0,e:'Thrush: superficial pseudomembrane of organisms + inflammatory cells, easily scraped off. Immunocompetent → stays superficial; immunocompromised → deeper or disseminated. Yeast + hyphae ("spaghetti and meatballs").',s:'Handout p5-6'},
 {q:'Oral hairy leukoplakia is caused by which virus and seen in whom?',c:['EBV; immunocompromised patients such as those with HIV','HPV 16; smokers','HSV-1; children','CMV; transplant only'],a:0,e:'Hairy leukoplakia: EBV; immunocompromised (HIV); hyperkeratotic corrugated "hairy" lateral tongue; cannot be scraped off; may signal worsening disease or waning antiviral therapy.',s:'Handout p6'},
 {q:'Which feature distinguishes hairy leukoplakia from thrush?',c:['Hairy leukoplakia cannot be scraped off','Hairy leukoplakia scrapes off easily','Thrush is caused by EBV','Thrush is always on the lateral tongue'],a:0,e:'Hairy leukoplakia: lateral tongue, cannot be scraped off. Thrush: pseudomembrane scrapes off.',s:'Handout p5-6'},
 {q:'Clinically, the term "leukoplakia" implies:',c:['A white patch/plaque in which dysplasia or malignancy is suspected and must be ruled out by biopsy','A definite carcinoma','A fungal infection','A benign lesion requiring no follow-up'],a:0,e:'Leukoplakia = white patch or plaque; dysplasia assumed until disproven by biopsy (actually present in a minority, ~10-25%); a small minority evolve to invasive SCC; risk factors like SCC. Gross appearance doesn\'t correlate with dysplasia → biopsy crucial.',s:'Handout p6-8'},
 {q:'Possible histology on biopsy of a leukoplakia:',c:['Hyperkeratosis and acanthosis only, or any degree of dysplasia (mild to severe)','Always invasive SCC','Always normal','Cowdry A inclusions'],a:0,e:'Biopsy may show hyperkeratosis/acanthosis only or mild, moderate or severe dysplasia; gross appearance doesn\'t predict it.',s:'Handout p8'},
 {q:'Compared with leukoplakia, erythroplakia is:',c:['Much more likely to show dysplasia, especially high-grade/CIS','Less likely to be dysplastic','Always benign','Caused by EBV'],a:0,e:'Erythroplakia (red, sometimes velvety patch) shows squamous dysplasia in ~90%, especially high-grade/CIS. Not exclusive to the oral cavity (cf. CIS of bladder).',f:'Dr. Kowalski frames it as the rate of dysplasia (leukoplakia 10-25%, erythroplakia ~90%); Dr. Strabbing (4.17) gives "malignant potential" (leukoplakia 5-20%, erythroplakia 60-90%). Same message: red is worse than white.',s:'Handout p8'},
]);
addN('4.19.1',[
 {h:'Ulcerative processes',b:'<b>Aphthous ulcer</b>: ~1/3 of people; very painful; unknown cause; 5-10 days; diverse triggers, autoimmune flares; <b>soft mucosa</b> (buccal, floor of mouth, inner lips), not hard palate/gingiva.<br><b>HSV</b>: usually HSV-1; primary in childhood (mostly asymptomatic; minority acute gingivostomatitis with fever, LAD). Latent in ganglia; recurrences fewer lesions, 5-10 days; ulcers on wet mucosa, crusts on dry lip. <b>Cowdry type A</b> ground-glass intranuclear inclusions, multinucleated giant cells.<br><b>Invasive SCC</b>: most H&amp;N neoplasia (salivary ~5%); invasive → ulcer. Risks: alcohol, tobacco, betel quid/paan, sunlight (lip), high-risk HPV (~70% oropharynx; uncommon oral cavity). HPV E6 → p53 degradation + TERT; E7 → RB, p21/p27 inactivation, cyclins E/A.',s:'Handout p2-4'},
 {h:'Necrotizing sinonasal lesions',b:'<b>GPA (Wegener)</b>: necrotizing granulomatous vasculitis; upper airway ± lung ± GN; PR3-ANCA (c-ANCA); saddle nose.<br><b>Mucormycosis</b>: angioinvasive; necrosis; spreads to orbit/cranial vault; broad non-septate hyphae, right-angle branching.',s:'Handout p5'},
 {h:'White/red flat lesions',b:'<b>Thrush</b>: Candida overgrowth; pseudomembrane scrapes off; superficial if immunocompetent, deep/disseminated if not; yeast + hyphae.<br><b>Hairy leukoplakia</b>: EBV, immunocompromised (HIV); corrugated lateral tongue; does NOT scrape off → test for HIV.<br><b>Leukoplakia</b>: white patch/plaque; dysplasia assumed until biopsy (present ~10-25%); small minority → SCC; gross ≠ histology → biopsy.<br><b>Erythroplakia</b>: red ± velvety; ~90% dysplasia (high-grade/CIS).',f:'Strabbing (4.17) gives malignant potential 5-20% (leuko) and 60-90% (erythro).',s:'Handout p5-8'},
]);
addO('4.19.2',[
 {src:'Kowalski SIQ 1',q:'A 62-year-old male with a 25-year history of cigarette smoking presents to his primary care physician with a three-week history of a gradually enlarging, painless mass in his left preauricular facial area. Physical examination demonstrates a well-circumscribed 5 cm mass on the peripheral left face; inspection of the mouth reveals protrusion of the mass into the left tonsillar pillar. Past medical history is significant for laryngeal carcinoma in the patient\'s late forties, which was treated with surgical excision and radiation. The mass is excised, and its cut surface is seen in the submitted image. Which of the following is the most likely diagnosis?',img:IMG.k4192_1,c:['chronic sialadenitis','mucocele','Warthin tumor','(recurrent) laryngeal squamous carcinoma','pleomorphic adenoma'],a:4,e:'Official answer: <b>E</b>. Boards expect you to recognize cartilage grossly: opaque, pearly, shiny, blue-gray nodules in a circumscribed mass. Pleomorphic adenomas (benign mixed tumors) often have cartilaginous differentiation.',s:'Handout p9-10'},
 {src:'Kowalski SIQ 2',q:'The best diagnosis of this lip lesion is …',img:IMG.k4192_2,c:['mucocele','Warthin tumor','leukoplakia','squamous cell dysplasia','invasive squamous cell carcinoma'],a:0,e:'Official answer: <b>A</b>. Salivary tissue is found all over the oral cavity; minor salivary ducts can obstruct and collect mucus/saliva → mucocele (mucous cyst). May be whitish, light gray or light blue, often a ballooning portion of normal-ish mucosa.',s:'Handout p9-10'},
 {src:'Kowalski SIQ 3',q:'A 45-year-old female presents with increasing xerostomia over the past 2 years. There is mild tenderness on palpation and mild enlargement of her parotid glands. A representative microscopic appearance of her parotid gland is seen. Which of the following serologic tests would most likely be positive in this patient?',img:IMG.k4192_3,c:['anti-neutrophil cytoplasmic autoantibody','anti-centromeric autoantibody','anti-mitochondrial autoantibody','anti-ribonucleoprotein SSA autoantibody','anti-double stranded DNA autoantibody'],a:3,e:'Official answer: <b>D</b>. Salivary glands can be involved by autoimmune processes: early enlargement from heavy inflammatory infiltrate, later atrophy. Anti-Ro (SSA) and anti-La (SSB) are typical of Sjögren syndrome (lymphocytic infiltration + glandular destruction); common Boards question for parotid and lacrimal glands. Any process enlarging salivary/lacrimal/parotid glands can be called Mikulicz syndrome. (E possible if SLE features present, but none here.)',s:'Handout p10-11'},
]);
addQ('4.19.2',[
 {q:'An oral irritation (traumatic) fibroma is best described as:',c:['An exaggeration of wound healing: reactive fibrous proliferation under intact mucosa, usually on gingiva or buccal bite line; excision curative','A neoplasm caused by HPV','Granulation tissue that bleeds easily','A salivary duct cyst'],a:0,e:'Fibroma: reactive fibrous proliferation in chronically irritated areas; intact mucosa; submucosal stroma/collagen; gingiva or buccal bite line; excision curative; similar to laryngeal reactive nodule.',s:'Handout p2'},
 {q:'A pregnant woman develops a rapidly growing, beefy red, easily bleeding gingival lesion. Diagnosis?',c:['Pyogenic granuloma ("tumor of pregnancy")','Irritation fibroma','Mucocele','Pleomorphic adenoma'],a:0,e:'Pyogenic granuloma: exaggerated granulation tissue (many new vessels, neutrophils); grows rapidly, may regress or fibrose; children, young adults, pregnancy; gingiva most common (also tongue, nasal cavity, skin).',s:'Handout p2'},
 {q:'The term "pyogenic granuloma" is a misnomer because the lesion is:',c:['Neither pus-forming nor a granuloma; it is granulation tissue','Actually a malignant tumor','A fungal granuloma','A salivary cyst'],a:0,e:'It is neither pyogenic nor granulomatous inflammation; it\'s granulation tissue (don\'t confuse granulation tissue with granulomas).',s:'Handout p2'},
 {q:'A child has a bulging, bluish mucosal swelling on the inner lower lip. Diagnosis?',c:['Mucocele (mucous retention cyst)','Pyogenic granuloma','Hemangioma only','Squamous papilloma'],a:0,e:'Mucocele: blocked or ruptured salivary duct → mucus collection; children/young adults; inner lower lip, buccal mucosa, floor of mouth (ranula); bulging, slightly bluish; may resolve or be excised.',s:'Handout p3'},
 {q:'A mucocele on the floor of the mouth is called a:',c:['Ranula','Fibroma','Epulis','Torus'],a:0,e:'Floor-of-mouth mucocele = ranula.',s:'Handout p3'},
 {q:'Nasal polyps: which statement fits Dr. Kowalski\'s description?',c:['Non-neoplastic edematous inflamed outpouchings of mucosa; more common with allergies (asthma, aspirin); may respond to steroids; mixed inflammation with eosinophils','HPV-driven neoplasms','Malignant in 10%','EBV-associated carcinomas'],a:0,e:'Nasal polyps: ~5% of people; etiology unknown but allergic (asthma, aspirin) patients more susceptible; steroids help; not neoplastic; males &gt; females, age &gt;20; 1-5 cm, may be multiple, obstruct breathing/drainage; respiratory epithelium over edematous inflamed stroma (neutrophils, eosinophils, plasma cells).',s:'Handout p3-4'},
 {q:'Which sinonasal (Schneiderian) papilloma subtype is located on the LATERAL nasal wall/sinuses, is locally aggressive, recurs if inadequately excised, and can turn malignant?',c:['Inverted','Exophytic','Fungiform squamous papilloma of the larynx','Nasal polyp'],a:0,e:'Inverted subtype: lateral nasal wall/sinuses, grows into tissue, locally aggressive (can push into ear, cranium, pharynx), high recurrence if not adequately excised, ~10% malignant transformation; low- and high-risk HPV. Exophytic: nasal septum.',s:'Handout p4'},
 {q:'The exophytic Schneiderian papilloma is usually located on the:',c:['Nasal septum','Lateral nasal wall','Maxillary sinus','Nasopharynx'],a:0,e:'Exophytic subtype usually on the nasal septum. Both subtypes: males &gt;&gt; females, ages 30-60; nasal discharge, obstruction.',s:'Handout p4'},
 {q:'Koilocytes (HPV effect) show:',c:['Shrunken "raisinoid" nuclei with perinuclear clearing in superficial keratinocytes','Ground-glass intranuclear inclusions','Keratin pearls','Zellballen'],a:0,e:'Koilocytes: superficial keratinocytes with raisinoid nuclei and perinuclear halos, typical of HPV in any squamous mucosa.',s:'Handout p5'},
 {q:'Nasopharyngeal carcinoma is strongly associated with which virus?',c:['Epstein-Barr virus','HPV 6','HSV-1','CMV'],a:0,e:'NPC: EBV identified in most tumors (especially aggressive patterns); endemic distribution (#1 childhood malignancy in parts of Africa; very common in adults in southern China/SE Asia); environmental factors (nitrosamine-rich salted/fermented foods, smoke); M:F ~2:1.',s:'Handout p5'},
