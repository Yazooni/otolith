 {src:'Hughes Pt 1 slide Question 1',q:'A blood pressure of 90/70; HR 90; RR 20; afebrile would constitute hypovolemic shock.',c:['True','False'],a:1,e:'Official answer: <b>False</b>. "You need to know the clinical scenario; can not base hypovolemic shock on vitals alone." Hypovolemic shock = insufficient blood flow for adequate cellular oxygenation → anaerobic metabolism. It is NOT defined by a BP number (a patient can be hypotensive with BP &gt;100 or normotensive with BP &lt;100 depending on baseline).',s:'Pt1 slides 8, 9, 25; handout p4'},
 {src:'Hughes Pt 1 slide Question 2',q:'A patient presents following a Motor Vehicle Crash. You should perform the rectal exam before listening to the lungs to rule-out occult blood loss.',c:['True','False'],a:1,e:'Official answer: <b>False</b>. "Please go back and review the order to proceed with your physical exam." Breathing (listening to the lungs) is part of the <b>primary survey</b> (B); the rectal exam is part of the <b>secondary survey</b> ("tubes and fingers in every orifice").',s:'Pt1 slides 4, 6, 24, 25'},
 {src:'Hughes handout Self-Instructional Problem 1',q:'With the rectal exam why does it matter what the position of the prostate is?',sa:'A <b>high-riding prostate</b>, especially with <b>blood at the urethral meatus</b>, may mean that the urethra has been disrupted. You would need to do a <b>retrograde urethrogram</b> to ensure integrity of the urethra <b>before inserting a Foley catheter</b>.',s:'Handout p20-21'},
]);
addQ('4.21.1',[
 {q:'ATLS organizes the evaluation of a trauma patient into four phases. Which is the correct order?',c:['Primary survey → Resuscitation → Secondary survey → Definitive care','Resuscitation → Primary survey → Secondary survey → Definitive care','Primary survey → Secondary survey → Resuscitation → Definitive care','Secondary survey → Primary survey → Resuscitation → Definitive care'],a:0,e:'Primary survey (find life/limb threats) → Resuscitation (treat them) → Secondary survey (head-to-toe, imaging, labs) → Definitive care (manage less-than-life-threatening injuries). Dr. Hughes: "must know this and what fits in each category."',s:'Handout p2-3; Pt1 slide 3'},
 {q:'Which phase of ATLS is a <b>head-to-toe evaluation</b> including physical exam, x-rays/CT scans and laboratory studies?',c:['Secondary survey','Primary survey','Resuscitation phase','Definitive care phase'],a:0,e:'The secondary survey is the complete head-to-toe exam with imaging and labs. The primary survey only assesses life/limb threats; resuscitation treats them; definitive care manages the remaining injuries.',s:'Handout p3'},
 {q:'Which phase of ATLS is where <b>less-than-life-threatening</b> injuries (fracture stabilization/splinting, operative intervention, transfer) are managed?',c:['Definitive care','Resuscitation','Secondary survey','Primary survey'],a:0,e:'Definitive care = in-depth management, fracture stabilization and splinting, necessary operative intervention, and stabilizing/transporting to a facility that can provide appropriate care.',s:'Handout p3; Pt1 slide 7'},
 {q:'In Dr. Hughes\' slides, which letter comes <b>first</b> in the primary survey, before Airway?',c:['X = eXsanguinating external hemorrhage','F = FAST exam','G = RhoGAM','E = Expose'],a:0,e:'The slides list <b>X = Exsanguinating External Hemorrhage</b> first: an external look for massive bleeding; if noted, apply direct pressure, then move on to A-B-C-D-E. F (FAST/fetal heart tones) and G (RhoGAM) are added by Dr. Hughes "so they don\'t get missed."',f:'The handout (p3) starts the primary survey at A; the Part 1 slides (slides 4, 11) add X before A. Know both.',s:'Pt1 slides 4, 11'},
 {q:'A trauma patient needs an airway. What does ATLS teach about the cervical spine?',c:['Always assume a broken neck: never hyperextend; open the airway with a chin lift and keep inline stabilization by a second provider if intubating','Hyperextend the neck (head-tilt) to best open the airway','Clear the C-spine with x-ray before any airway maneuver','C-spine precautions only if the patient complains of neck pain'],a:0,e:'"Always assume the traumatized patient has a broken neck." Never hyperextend the C-spine; use the chin lift; maintain inline stabilization with a second provider if intubating.',s:'Handout p4; Pt1 slide 12'},
 {q:'During B (Breathing) of the primary survey, which three conditions must be assessed for?',c:['Tension pneumothorax, open pneumothorax, large flail chest with pulmonary contusion','Aortic disruption, esophageal tear, diaphragmatic hernia','Simple pneumothorax, simple hemothorax, rib fractures','Myocardial contusion, tracheobronchial tear, pulmonary contusion alone'],a:0,e:'Expose the chest; airway patency does NOT ensure adequate breathing. Assess for tension pneumothorax, open pneumothorax, and large flail chest with contusion. Aortic/esophageal/diaphragm injuries are "potentially life-threatening" (secondary survey); simple pneumo/hemothorax and rib fractures are non-lethal.',s:'Handout p4; Pt1 slide 13'},
 {q:'A trauma patient has no palpable radial pulse, but a femoral pulse is present. What is the minimum systolic blood pressure you can infer?',c:['70 mmHg','80 mmHg','60 mmHg','90 mmHg'],a:0,e:'Radial pulse → SBP ≥80; femoral (no radial) → ≥70; carotid only → ≥60 mmHg.',s:'Handout p4; Pt1 slide 14'},
 {q:'Only a carotid pulse is palpable (no radial or femoral). Systolic pressure is at least:',c:['60 mmHg','70 mmHg','80 mmHg','50 mmHg'],a:0,e:'Carotid only → SBP at least 60 mmHg. Radial → 80; femoral → 70.',s:'Handout p4; Pt1 slide 14'},
 {q:'You press on the thenar eminence and color returns within 2 seconds. What does this suggest?',c:['The patient is probably normovolemic','The patient is in hypovolemic shock','The patient has a tension pneumothorax','Nothing; capillary refill is not part of the circulation check'],a:0,e:'Capillary blanch (capillary refill): if color returns to normal within 2 seconds, the patient is probably normovolemic.',s:'Handout p4; Pt1 slide 14'},
 {q:'First-line management of rapid external blood loss in the primary survey is:',c:['Direct pressure on the wound','Immediate tourniquet on every wound','Thoracotomy','Wait for the secondary survey'],a:0,e:'"Rapid blood loss is managed by direct pressure on the wound." Topical hemostatic products (from wartime advances) are also used.',s:'Handout p4; Pt1 slide 15'},
 {q:'Which medication may be given to severely injured patients, typically those with intracranial hemorrhage or bleeding related to traumatic injury?',c:['Tranexamic acid (TXA)','Warfarin','Heparin','Alteplase (tPA)'],a:0,e:'TXA may be administered to severely injured patients with intracranial hemorrhage or trauma-related bleeding; anticoagulants are often reversed. tPA is used for massive PE as a PEA cause, not trauma bleeding.',s:'Handout p5'},
 {q:'The "D" (Disability) brief neuro exam in the primary survey uses which scale?',c:['AVPU: Alert, Verbal, Painful, Unresponsive','AMPLE','Glasgow outcome scale','MIST'],a:0,e:'D = Disability: A = alert, V = responds to verbal stimuli, P = responds to painful stimuli, U = unresponsive.',s:'Handout p5; Pt1 slide 16'},
 {q:'The FAST exam looks for fluid in which four areas?',c:['Pericardial sac, Morison\'s pouch (hepatorenal), splenorenal space, pouch of Douglas (behind bladder)','Both pleural apices, aortic arch, and pelvis','Pericardial sac, subphrenic spaces and both lung bases only','Liver parenchyma, spleen parenchyma, kidneys and bladder lumen'],a:0,e:'FAST (Focused Assessment with Sonography in Trauma) = bedside ultrasound for fluid in the pericardial sac, Morison\'s pouch (hepatorenal space), splenorenal space, and pouch of Douglas behind the bladder. It can be done in the primary survey.',s:'Handout p5; Pt1 slide 18'},
 {q:'A pregnant trauma patient has a uterine fundus palpable at the umbilicus. Per Dr. Hughes, this corresponds to about how many weeks, and when should continuous fetal monitoring be done?',c:['20 weeks; continuously monitor all patients &gt;24 weeks gestation','12 weeks; monitor only if bleeding','36 weeks; monitor &gt;30 weeks','20 weeks; fetal monitoring is not part of trauma care'],a:0,e:'Fundus at the umbilicus = 20 weeks. Attempt fetal heart tones in all gravid patients; continuously monitor &gt;24 weeks gestation.',s:'Handout p5; Pt1 slide 18'},
 {q:'A pregnant trauma patient is Rh negative and has bleeding. Per the "G" step, you should:',c:['Give RhoGAM (and send Kleihauer-Betke to detect fetal RBCs in maternal circulation)','Give RhoGAM only if the father is Rh positive and confirmed','Give tranexamic acid only','Nothing until delivery'],a:0,e:'G = RhoGAM: test all females for pregnancy; if pregnant, Rh screen; if Rh negative (and bleeding per slide), give RhoGAM. Kleihauer-Betke (maternal-fetal screen) determines whether fetal RBCs crossed into maternal circulation.',s:'Handout p5; Pt1 slide 19'},
 {q:'Which is part of the <b>resuscitation</b> phase?',c:['Supplemental O<sub>2</sub>, at least 2 large-bore IVs (≥18 gauge), fluids if hypotensive, EKG monitoring, determine cause of shock, NG/urinary catheter if not contraindicated','Complete head-to-toe exam with rectal exam','Fracture splinting and operative repair','AMPLE history only'],a:0,e:'Resuscitation: oxygen to all, minimum 2 large-bore IVs (at least 18 gauge), IV fluids if hypotensive (some permissive hypotension OK), careful EKG monitoring, determine the cause of shock, consider urinary/gastric catheters, TXA if bleeding.',s:'Handout p3, p5; Pt1 slides 5, 20'},
 {q:'Regarding IV fluids for a hypotensive trauma patient, the handout states:',c:['Hypotension needs IV fluids, but passive (permissive) hypotension is permissible to some extent','Fluids are contraindicated in all trauma','Give fluids until BP is at least 140 systolic','Fluids are only given in the definitive care phase'],a:0,e:'"If hypotension need IV fluids, but passive hypotension is permissible to some extent."',s:'Handout p5'},
 {q:'A trauma patient has a midface fracture. How should a gastric tube be placed?',c:['Orally (orogastric), because a nasal tube can pass through a fractured cribriform plate into the cranium','Nasally, because it is better tolerated','No gastric tube may ever be placed in trauma','Nasally, but only after CT'],a:0,e:'With a midface fracture, do not put a gastric tube through the nose; use the oral route, since it may pass through the fractured cribriform plate and end up intracranially.',s:'Handout p6'},
 {q:'A patient has obvious maxillofacial trauma. What should you assume?',c:['A broken neck (cervical spine injury)','An aortic tear','A myocardial contusion','A diaphragmatic hernia'],a:0,e:'"If evidence of maxillofacial trauma, assume a broken neck."',s:'Handout p6'},
 {q:'Which statement about the secondary survey exam is correct?',c:['Rectal exam on all seriously injured patients, test stool for blood, and in males note the position of the prostate','The chest only needs anterior inspection','Rectal exam is done during the primary survey','Extremities are not examined until definitive care'],a:0,e:'Secondary survey: examine the chest anterior AND posterior, palpating each bone; any abdominal injury is potentially dangerous; rectal exam on all seriously injured (stool blood + prostate position in males); evaluate/palpate/move all extremities; full neuro exam.',s:'Handout p6'},
 {q:'The handout\'s pertinent past history mnemonic is AMPLE. What does it stand for?',c:['Allergies, Medications, Past illness, Last meal, Events preceding injury','Airway, Mechanism, Pulse, Lungs, Exposure','Age, Mechanism, Pregnancy, Labs, EKG','Allergies, Mechanism, Pain, Location, Extremities'],a:0,e:'AMPLE = Allergies, Medications (always ask about blood thinners by name: aspirin, Plavix, Brilinta, warfarin/Coumadin, Lovenox, Xarelto, Eliquis, Pradaxa), Past illness, Last meal (assume recent if unable to respond), Events preceding injury.',f:'The handout and objective #4 use <b>AMPLE</b>; the Part 1 slide 22 ("must know this") shows <b>IMIST-AMBO</b> (Identify, Mechanism, Injuries, Signs, Treatment; Allergies, Medications, Background, Other). Know both.',s:'Handout p2, p6; Pt1 slide 22'},
 {q:'In the AMPLE history, which medication class does Dr. Hughes emphasize you must <b>always</b> ask about by name?',c:['Blood thinners/anticoagulants (aspirin, Plavix, Brilinta, warfarin, Lovenox, Xarelto, Eliquis, Pradaxa)','Antihypertensives','Inhalers','Antibiotics'],a:0,e:'"Always ask about blood thinners or anticoagulants and be able to specifically ask using the names."',s:'Handout p6'},
 {q:'On Dr. Hughes\' Part 1 slide (history, "must know this"), the IMIST portion stands for:',c:['Identify, Mechanism, Injuries, Signs, Treatment provided','Inspect, Monitor, Intubate, Splint, Transfer','Injury, Medications, Illness, Symptoms, Time','Identify, Medications, Immunizations, Surgeries, Tobacco'],a:0,e:'IMIST-AMBO: Identify, Mechanism, Injuries, Signs, Treatment provided; then Allergies, Medications, Background, Other information.',s:'Pt1 slide 22'},
 {q:'After the primary survey, resuscitation and secondary survey are complete, ATLS stresses that you must:',c:['Continually re-evaluate the patient','Discharge if stable','Stop monitoring once imaging is normal','Repeat the AMPLE history only'],a:0,e:'"MUST CONTINUALLY REEVALUATE THE PATIENT."',s:'Handout p6; Pt1 slide 23'},
 {q:'What is the "Golden Hour" in trauma?',c:['The first hour after injury, when assessment, lifesaving intervention, re-evaluation and stabilization should occur','The hour after surgery','The first hour after arrival to the ICU','The time to obtain a CT scan'],a:0,e:'The first hour after traumatic injury is the "golden hour": initial assessment, lifesaving intervention, re-evaluation and stabilization should occur then. Trauma is the leading cause of death under age 45.',s:'Handout p2'},
 {q:'Diagnostic peritoneal lavage in the secondary survey is:',c:['Rarely done now because of its invasive nature; largely replaced by FAST and CT','The first test for every trauma patient','Part of the primary survey','Used instead of the rectal exam'],a:0,e:'Peritoneal lavage is done only if FAST and/or CT are not available; rarely done now due to its invasive nature and FAST availability.',s:'Handout p3; Pt1 slide 6'},
]);
addN('4.21.1',[
 {h:'ATLS phases (must know + what fits in each)',b:'<ol><li><b>Primary survey</b>: assess life- and limb-threatening conditions.</li><li><b>Resuscitation</b>: treat life threats; identify and evaluate their severity.</li><li><b>Secondary survey</b>: head-to-toe exam, x-rays incl. CT, labs (peritoneal lavage only if no FAST/CT, rarely done now).</li><li><b>Definitive care</b>: less-than-life-threatening injuries managed; in-depth management, fracture stabilization/splinting, operative intervention, transfer if needed.</li></ol>Trauma = leading cause of death under 45. <b>Golden hour</b> = first hour after injury.',s:'Handout p2-3; Pt1 slides 3-7'},
 {h:'Primary survey X-A-B-C-D-E (+F, G)',b:'<ul><li><b>X</b> exsanguinating external hemorrhage → direct pressure, move on <i>(slides only)</i></li><li><b>A</b> airway with C-spine control: assume broken neck, chin lift, never hyperextend, inline stabilization</li><li><b>B</b> breathing: expose; patency ≠ adequacy; look for tension PTX, open PTX, large flail chest with contusion</li><li><b>C</b> circulation + hemorrhage control: pulse quality/rate/regularity/site (BP not initially needed). Radial ≥80, femoral ≥70, carotid ≥60 SBP. Cap refill &lt;2 s ≈ normovolemic. Direct pressure, topical agents, TXA</li><li><b>D</b> disability: AVPU</li><li><b>E</b> expose: undress completely</li><li><b>F</b> FAST (pericardium, Morison\'s pouch, splenorenal, pouch of Douglas) + fetal heart tones (fundus at umbilicus = 20 wk; continuous monitoring &gt;24 wk)</li><li><b>G</b> RhoGAM if pregnant + Rh negative (+ Kleihauer-Betke)</li></ul>',f:'Handout starts at A; slides add X first.',s:'Handout p3-5; Pt1 slides 4, 11-19'},
 {h:'Hypovolemic shock (must know)',b:'Insufficient blood flow to provide adequate cellular oxygenation → anaerobic metabolism. <b>NOT</b> a BP &lt;100 per se: a patient can be hypotensive with BP &gt;100 or normotensive with BP &lt;100 depending on baseline. Diagnose from the clinical scenario, not vitals alone.',s:'Handout p4; Pt1 slides 8-9'},
 {h:'Resuscitation details',b:'O<sub>2</sub> to all; ≥2 large-bore IVs (≥18 g); IV fluids if hypotensive (permissive hypotension OK to some extent); EKG monitoring; find cause of shock; NG + urinary catheters if not contraindicated (especially if seriously injured, not in all); TXA if intracranial or other hemorrhage.',s:'Handout p5; Pt1 slide 20'},
 {h:'Secondary survey details',b:'<ul><li>Head: examine eyes carefully. Maxillofacial trauma → assume broken neck. Midface fracture → <b>oral</b> gastric tube (nasal may go through cribriform plate intracranially)</li><li>Chest anterior + posterior, palpate each bone</li><li>Abdomen: any injury potentially dangerous</li><li>Rectal exam on all seriously injured: stool blood; prostate position in males (high-riding + meatal blood → urethral disruption → retrograde urethrogram before Foley)</li><li>All extremities: palpate, range of motion</li><li>Neuro: mental status, motor, sensory, reflexes, cranial nerves</li></ul>',s:'Handout p5-6, p21'},
 {h:'History: AMPLE (handout) / IMIST-AMBO (slide)',b:'<b>AMPLE</b>: Allergies; Medications (ask about every anticoagulant by name: aspirin, Plavix, Brilinta, warfarin/Coumadin, Lovenox, Xarelto, Eliquis, Pradaxa); Past illness; Last meal (assume recent if can\'t answer); Events preceding injury.<br><b>IMIST-AMBO</b> (slide 22, "must know"): Identify, Mechanism, Injuries, Signs, Treatment; Allergies, Medications, Background, Other info. Then <b>continually re-evaluate</b>.',f:'Objective #4 says AMPLE; slide 22 shows IMIST-AMBO.',s:'Handout p6; Pt1 slides 22-23'},
]);
// ---------- 4.21.2 Life-threatening ----------
addO('4.21.2',[
 {src:'Hughes Pt 2 slide Question 3',q:'Both a patient with a tension pneumothorax and a massive hemothorax will have decreased breath sounds on the ipsilateral side.',c:['True','False'],a:0,e:'Official answer: <b>True</b>. "Anything that puts a buffer between the lung parenchyma and the chest wall will cause decreased breath sounds on auscultation."',s:'Pt2 slides 19, 30'},
 {src:'Hughes handout Self-Instructional Problem 2',q:'What amount of fluid does it take to blunt the costophrenic angle on CXR? To blunt the diaphragm?',sa:'<b>300 cc</b> blunts the costophrenic angle; about <b>1000 cc</b> blunts the diaphragm. (Slide 13 adds: 1500 cc is considered a massive hemothorax.)',s:'Handout p21; Pt2 slide 13'},
 {src:'Hughes handout Self-Instructional Problem 4',q:'How do you differentiate between a tension pneumothorax, a massive hemothorax and cardiac tamponade if you don\'t have a CXR or Ultrasound?',sa:'<b>Physical exam.</b> <b>Tension</b>: hypotension, JVD, absent breath sounds ipsilateral, deviated trachea contralateral (late finding), <b>hyper-resonant</b> to percussion ipsilateral, heart sounds normal. <b>Massive hemothorax</b>: often hypotensive, JVD, absent breath sounds ipsilateral, <b>dull</b> to percussion, heart sounds normal. <b>Tamponade</b>: hypotension, JVD, <b>muffled heart sounds</b>. With bedside US: tension shows pneumothorax, tamponade shows pericardial effusion, massive hemothorax shows pleural fluid (plus the exam findings above).',s:'Handout p21'},
 {src:'Hughes handout Self-Instructional Problem 5',q:'Of all the conditions listed above, which is the most likely cause of EKGs labeled Figure 1 and 2 as the single etiology of PEA, and why? (i.e., your trauma patient has either of these EKGs but no pulse: which etiology is causing the problem?) <i>[EKG figures are on handout p23.]</i>',sa:'<b>Cardiac tamponade.</b> Low voltage across <b>all</b> leads in both means some insulation between the heart and the chest electrodes, and it is a <b>diffuse</b> problem. There is also <b>electrical alternans</b>: the heart swings to and fro in the fluid in the pericardial sac. A unilateral tension pneumothorax or massive hemothorax would cause low voltage only in the involved side\'s leads, not the uninvolved side\'s leads.',s:'Handout p21, p23'},
]);
addQ('4.21.2',[
 {q:'Which list contains only Dr. Hughes\' <b>life-threatening</b> chest trauma conditions?',c:['Airway obstruction, tension pneumothorax, sucking chest wound, massive hemothorax, flail chest, cardiac tamponade','Pulmonary contusion, aortic disruption, tracheobronchial disruption, esophageal disruption, diaphragmatic disruption, myocardial contusion','Simple pneumothorax, simple hemothorax, rib fractures','Aortic disruption, flail chest, rib fractures'],a:0,e:'Life-threatening (Part 2): airway obstruction, tension PTX, open PTX (sucking chest wound), massive hemothorax, flail chest, cardiac tamponade. The second list is "potentially life-threatening" (Part 3). The third is non-lethal.',s:'Pt2 slide 3; Pt3 slides 3, 16'},
 {q:'What mechanism produces a tension pneumothorax?',c:['A one-way valve air leak (lung or chest wall) forces air into the pleural space with no escape, collapsing the lung and shifting the mediastinum/trachea to the opposite side, impairing venous return','Blood accumulating in the pericardium','A two-way chest wall defect allowing air in and out with each breath','Paradoxical movement of a free-floating rib segment'],a:0,e:'Tension PTX = one-way valve leak. Lung collapses; mediastinum and trachea shift contralaterally → interferes with venous return and compresses the other lung. The two-way defect describes an open (sucking) pneumothorax.',s:'Handout p7; Pt2 slide 7'},
 {q:'Which are the most common causes of tension pneumothorax listed by Dr. Hughes?',c:['Mechanical ventilation with PEEP, spontaneous pneumothorax that fails to seal, blunt chest trauma with parenchymal injury that fails to seal','Penetrating cardiac wounds','Esophageal instrumentation','Aortic deceleration injury'],a:0,e:'Causes: mechanical ventilation (PEEP), spontaneous pneumo whose ruptured bullae fail to seal, blunt chest trauma whose parenchymal injury fails to seal; occasionally chest wall leaks.',s:'Handout p7; Pt2 slide 4'},
 {q:'A ventilated trauma patient becomes hypotensive with distended neck veins, absent breath sounds on the right and a <b>hyper-resonant</b> right chest. Heart sounds are normal. Next step?',c:['Needle decompression: 2nd intercostal space, midclavicular line, right side','Pericardiocentesis','Chest tube only after treating shock with 2 L fluids','Obtain a CXR before any intervention'],a:0,e:'Classic tension pneumothorax (hyper-resonance + absent breath sounds ipsilaterally, hypotension, JVD). Initial treatment is rapid large-bore needle decompression in the 2nd ICS MCL (alternative 4th/5th ICS anterior axillary line), converting it to a simple pneumothorax; definitive = chest tube. Do not delay for CXR. Pericardiocentesis treats tamponade (muffled heart sounds).',s:'Handout p7, p17; Pt2 slides 5-6'},
 {q:'Which sign of tension pneumothorax does Dr. Hughes call a <b>very late</b> sign in the neck (though it may appear early in the mediastinum on a preliminary CXR)?',c:['Tracheal deviation away from the affected side','Hypotension','Absent breath sounds','Tachycardia'],a:0,e:'"Tracheal deviation away from side (contralateral): very late sign in neck, but occurs early in the mediastinum which you may see on preliminary CXR."',s:'Handout p7'},
 {q:'Why is a tension pneumothorax hypotensive?',c:['Decreased venous return','Blood loss into the chest','Myocardial contusion','Vasodilation from sepsis'],a:0,e:'Hypotension is "secondary to decreased venous return" from mediastinal shift/raised intrathoracic pressure. JVD reflects increased central venous pressure.',s:'Handout p7'},
 {q:'Bedside ultrasound in tension (or simple) pneumothorax shows:',c:['Lack of pleural sliding / lung sliding in M-mode','An anechoic layer around the heart','Anechoic fluid above the diaphragm posteriorly','Free fluid in Morison\'s pouch'],a:0,e:'Pneumothorax: no pleural/lung sliding in M-mode. Anechoic layer around the heart = tamponade. Anechoic/hypoechoic fluid cephalad to the diaphragm posteriorly (supine) = hemothorax.',s:'Handout p7, p8, p9, p15'},
 {q:'Definitive treatment of tension pneumothorax after needle decompression:',c:['Chest tube in the 5th intercostal space (nipple level), midaxillary line','Repeat needle decompression daily','Thoracotomy','Occlusive dressing taped on 4 sides'],a:0,e:'Definitive treatment usually requires only a chest tube in the fifth ICS (nipple level) in the midaxillary line.',s:'Handout p7; Pt2 slide 6'},
 {q:'Compared with cardiac tamponade, tension pneumothorax is:',c:['More common','Less common','Equally common','Only seen in penetrating trauma'],a:0,e:'"A tension pneumothorax may be initially confused with cardiac tamponade, however the tension pneumothorax is a more common occurrence than tamponade."',s:'Handout p7'},
 {q:'An open pneumothorax ("sucking chest wound") causes air to move preferentially through the chest wall when the defect is approximately what size?',c:['About 2/3 the diameter of the trachea','Any size wound','At least the diameter of the aorta','Only when larger than 10 cm'],a:0,e:'If the opening is ~2/3 the diameter of the trachea, air follows the path of least resistance through the chest defect with each breath, so effective ventilation ceases; the mediastinum moves to and fro, disturbing venous flow.',s:'Handout p7'},
 {q:'Correct initial management of a sucking chest wound:',c:['Sterile occlusive dressing larger than the wound, taped on <b>three</b> sides (flutter valve), then chest tube within minutes; definitive surgical closure usually needed','Occlusive dressing taped securely on all four sides','Needle decompression only','Leave open to air'],a:0,e:'Tape on three sides to create a flutter-valve. Taping all four sides lets air accumulate and may cause a <b>tension pneumothorax</b>. Then a chest tube (nipple level, midaxillary line) and usually definitive surgical closure.',s:'Handout p8; Pt2 slide 9'},
 {q:'Massive hemothorax is defined in the handout as blood loss into the chest of approximately:',c:['2000-4000 mL','300 mL','500-1000 mL','100 mL/hr'],a:0,e:'Handout: massive hemothorax results from 2000-4000 mL blood loss into the chest cavity, most commonly from penetrating disruption of systemic or pulmonary vessels (can be blunt).',f:'Handout p8 says 2000-4000 mL; Pt2 slide 13 labels <b>1500 cc</b> as "considered massive hemothorax" (and slide 11 says 2000-4000 cc).',s:'Handout p8; Pt2 slides 11, 13'},
 {q:'A stab-wound patient is in shock with absent left breath sounds and dullness to percussion on the left. Which sequence is correct?',c:['Treat the shock first (fluids/blood); then insert the chest tube; thoracotomy as soon as stabilized','Insert a chest tube immediately before any fluids','Needle decompression, then observation','Pericardiocentesis first'],a:0,e:'Massive hemothorax: "Must treat shock first, then after shock controlled, chest tube." If the tube is placed first, "patient will probably die" (the hemothorax may be tamponading the bleeding vessel). Definitive care = open thoracotomy.',s:'Handout p8; Pt2 slides 11-12'},
 {q:'While placing a chest tube for massive hemothorax, the patient becomes hypotensive. Per Dr. Hughes you should:',c:['Clamp the chest tube','Increase suction','Remove the tube and re-insert higher','Perform needle decompression'],a:0,e:'"If the patient becomes hypotensive during this procedure, clamp the chest tube, as pressure from the hemothorax may well have been tamponading the bleeding vessel."',s:'Handout p8'},
 {q:'In massive hemothorax, the neck veins may be:',c:['Flat (severe hypovolemia) OR distended (mechanical effect of a chest full of blood)','Always distended','Always flat','Pulsatile only'],a:0,e:'Neck veins may be flat from severe hypovolemia or distended from the mechanical effects of a chest full of blood.',s:'Handout p8'},
 {q:'On percussion, which finding distinguishes massive hemothorax from tension pneumothorax?',c:['Dullness (hemothorax) vs hyper-resonance (tension)','Hyper-resonance (hemothorax) vs dullness (tension)','Muffled heart sounds in hemothorax','Tracheal deviation only in hemothorax'],a:0,e:'Both have absent ipsilateral breath sounds; hemothorax is DULL, tension is HYPER-RESONANT. Muffled heart sounds suggest tamponade.',s:'Handout p7-8, p21'},
 {q:'Flail chest is defined as:',c:['Paradoxical movement: chest moves inward with inspiration and outward with exhalation, from sequential ribs each fractured in at least two places (free-floating segment)','Any single rib fracture','Fracture of ribs 1 and 2','Multiple rib fractures each broken in one place'],a:0,e:'Flail = paradoxical movement from multiple segmental rib fractures (sequential, ≥2 places each) creating a free-floating segment. Multiple rib fractures broken in only one place are not a flail (objective: differentiate flail chest vs multiple rib fractures).',s:'Handout p8; Pt2 slides 20-21'},
 {q:'Why might a flail chest NOT be apparent initially in a conscious patient?',c:['Splinting of the chest wall','The CXR always misses it','It only occurs in children','Because breath sounds are increased'],a:0,e:'Flail chest is usually apparent in the unconscious patient but may not be initially apparent in the conscious patient due to splinting. Palpation aids diagnosis; CXR may suggest multiple rib fractures but may miss costochondral separation.',s:'Handout p9'},
 {q:'Initial therapy of flail chest includes all EXCEPT:',c:['Aggressive large-volume crystalloid','Adequate ventilation','Humidified oxygen','Analgesics; intubation for internal stabilization if needed'],a:0,e:'Limit crystalloid to prevent over-hydration. Therapy: adequate ventilation, humidified O<sub>2</sub>, analgesia, internal stabilization by intubation/volume ventilation when indicated.',s:'Handout p9; Pt2 slide 22'},
 {q:'Which findings are listed as indications for internal stabilization (intubation) in flail chest?',c:['RR &gt;40, and pO<sub>2</sub> &lt;60 mmHg on FiO<sub>2</sub> &gt;60%','RR &gt;20 and any rib fracture','pO<sub>2</sub> &lt;90 on room air','Any chest pain'],a:0,e:'"A respiratory rate greater than 40 and a pO<sub>2</sub> less than 60 mmHg on an FIO<sub>2</sub> of greater than 60 percent are indications for internal stabilization."',s:'Handout p9'},
 {q:'Beck\'s triad of cardiac tamponade is:',c:['Elevated CVP (distended neck veins), hypotension, muffled heart sounds','Hypertension, bradycardia, irregular respirations','Hypotension, absent breath sounds, tracheal deviation','Crepitus, subcutaneous emphysema, hoarseness'],a:0,e:'Beck\'s triad = increased CVP/JVD, hypotension, muffled heart sounds. Absent breath sounds + tracheal deviation = tension PTX. Crepitus + SQ emphysema + hoarseness = laryngeal fracture triad.',s:'Handout p9; Pt2 slide 24'},
 {q:'Why can a small volume of blood cause tamponade after acute trauma, while a large chronic effusion may be tolerated?',c:['The pericardium can stretch to accommodate fluid accumulating over time, but not fluid accumulating rapidly','Blood is thicker than chronic fluid','Chronic effusions are always under 50 mL','Acute blood clots the coronary arteries'],a:0,e:'"Only a relatively small amount of blood is required ... in the acute setting. The pericardial sac can accommodate large amounts of fluid if it accumulates over time, but not if it accumulates rapidly."',s:'Handout p9; Pt2 slide 23'},
 {q:'Why might distended neck veins be ABSENT in a trauma patient with cardiac tamponade?',c:['Loss of blood (hypovolemia)','Tension pneumothorax on the same side','Normal CVP is expected','The triad never includes JVD'],a:0,e:'JVD from elevated CVP may be absent because of blood loss. If severe blood loss and tamponade coexist, diagnose by high index of suspicion and a narrow pulse pressure.',s:'Handout p9'},
 {q:'A penetrating wound in which location should immediately raise suspicion of cardiac tamponade?',c:['2nd-7th left intercostal spaces, particularly along the lateral sternal border','Right lower quadrant','Posterior neck','Right axilla only'],a:0,e:'"A penetrating wound from the second to the seventh left intercostal spaces, particularly along the lateral sternal border, should immediately arouse suspicion for potential cardiac tamponade."',s:'Handout p9'},
 {q:'Which condition can superficially mimic cardiac tamponade (hypotension, distended neck veins, hard-to-hear heart sounds over the precordium)?',c:['Left tension pneumothorax','Simple right pneumothorax','Rib fracture','Myocardial contusion'],a:0,e:'A left tension pneumothorax can mimic tamponade. Distinguish by absent breath sounds on the injured side and hyper-resonance in tension PTX.',s:'Handout p9'},
 {q:'Initial and definitive management of traumatic cardiac tamponade:',c:['Prompt pericardiocentesis via the subxiphoid route; definitive may require thoracotomy with repair','Needle decompression at 2nd ICS; chest tube','Chest tube after fluids; observation','Thrombolytics'],a:0,e:'Initial: pericardiocentesis (subxiphoid). Definitive: thoracotomy and repair of penetrating injury (with patent airway and IV therapy).',s:'Handout p10; Pt2 slides 25-26'},
 {q:'Bedside ultrasound in cardiac tamponade shows:',c:['An anechoic layer around the heart','Absent lung sliding','Hyperechoic pleural line only','Fluid only in the pouch of Douglas'],a:0,e:'Tamponade: anechoic layer (pericardial effusion) around the heart.',s:'Handout p9'},
 {q:'Pulseless electrical activity (PEA) is:',c:['An organized rhythm on the monitor that should generate a pulse, but no pulse is present','Ventricular fibrillation','Asystole','A pulse without any rhythm'],a:0,e:'PEA = organized (often tachycardic) electrical activity without a pulse; bedside US may even show heart motion.',s:'Handout p10; Pt2 slide 27'},
 {q:'Match the reversible PEA cause to its treatment: <b>massive pulmonary embolism</b>.',c:['Thrombolytics such as tPA','Needle decompression','Pericardiocentesis','Bicarbonate'],a:0,e:'PE → thrombolytics (tPA). Tension PTX → needle decompression; tamponade → pericardiocentesis; acidosis → bicarb if pH &lt;7.0.',s:'Handout p10; Pt2 slide 28'},
 {q:'Match the reversible PEA cause to its treatment: <b>acidosis</b>.',c:['Measure pH; give bicarbonate if pH &lt;7.0','Bicarbonate for every PEA','Intubate and hyperventilate','Fluid bolus'],a:0,e:'Acidosis: measure pH, give bicarb if pH &lt;7.0. Severe hypercarbia → intubation + hyperventilation; hypovolemia → fluid bolus; hypoxia → 100% O<sub>2</sub>/intubation.',s:'Handout p10; Pt2 slide 29'},
 {q:'Match the reversible PEA cause to its treatment: <b>severe hypercarbia</b>.',c:['Intubation and hyperventilation','Fluid bolus','tPA','Pericardiocentesis'],a:0,e:'Severe hypercarbia → intubation and hyperventilation.',s:'Handout p10; Pt2 slide 29'},
 {q:'Which is NOT listed among the most common rapidly reversible causes of PEA?',c:['Hyperkalemia','Tension pneumothorax','Cardiac tamponade','Hypovolemia'],a:0,e:'Dr. Hughes\' list: tension PTX, tamponade, massive PE, hypoxia, severe hypercarbia, hypovolemia, acidosis, massive myocardial dysfunction. Hyperkalemia is not on her list.',s:'Handout p10; Pt2 slides 28-29'},
 {q:'Classic physical findings: hypotension, JVD, <b>muffled heart sounds</b>, normal breath sounds bilaterally. Diagnosis?',c:['Cardiac tamponade','Tension pneumothorax','Massive hemothorax','Flail chest'],a:0,e:'Beck\'s triad with normal breath sounds = tamponade. Tension PTX and massive hemothorax have absent ipsilateral breath sounds with normal heart sounds.',s:'Handout p21'},
 {q:'Cyanosis appears when there is about how much unsaturated hemoglobin?',c:['5 g/dL','1 g/dL','10 g/dL','15 g/dL'],a:0,e:'Cyanosis needs ~5 g unsaturated hemoglobin (listed under tension pneumothorax signs).',s:'Handout p7'},
]);
addN('4.21.2',[
 {h:'Life-threatening conditions (primary survey)',b:'Airway obstruction · Tension pneumothorax · Sucking chest wound (open PTX) · Massive hemothorax · Flail chest · Cardiac tamponade. Life-saving treatments (objective 7): airway (Heimlich/BLS), tension → needle decompression, tamponade → pericardiocentesis, aortic disruption → image then surgery, flail → oxygenate and probably intubate, massive hemothorax → hemodynamic control BEFORE chest tube.',s:'Handout p2; Pt2 slide 3'},
 {h:'Tension pneumothorax',b:'One-way valve leak (lung or chest wall) → lung collapse, mediastinum/trachea to opposite side → ↓venous return, compresses other lung. Causes: mechanical ventilation with PEEP, spontaneous PTX that failed to seal, blunt trauma parenchymal injury that failed to seal.<br><b>Signs</b>: contralateral tracheal deviation (very late in neck, early in mediastinum on CXR), hypotension (↓venous return), absent ipsilateral breath sounds, JVD (↑CVP), cyanosis (5 g unsaturated Hb), <b>hyper-resonance</b> ipsilaterally. More common than tamponade. US: no pleural sliding (M-mode).<br><b>Tx</b>: large-bore needle 2nd ICS MCL (alt 4th/5th ICS anterior axillary line) → converts to simple PTX; definitive chest tube 5th ICS (nipple) midaxillary line.',s:'Handout p7; Pt2 slides 4-8'},
 {h:'Open pneumothorax (sucking chest wound)',b:'Large defect stays open → equilibration with atmosphere. If ~2/3 tracheal diameter, air passes through the defect preferentially → ventilation ceases; mediastinal to-and-fro → ↓venous flow. <b>Tx</b>: sterile occlusive dressing overlapping edges, taped on <b>3 sides</b> (flutter valve). All 4 sides → may cause tension PTX. Chest tube (nipple level, midaxillary) within minutes; definitive surgical closure usually.',s:'Handout p7-8; Pt2 slide 9'},
 {h:'Massive hemothorax',b:'2000-4000 mL into the chest (handout); slide: 300 cc blunts CP angle, 1000 cc blunts diaphragm, 1500 cc = massive. Usually penetrating disruption of systemic/pulmonary vessels (can be blunt). Shock + absent ipsilateral breath sounds and/or <b>dullness</b>. Neck veins flat (hypovolemia) or distended (mechanical). US: anechoic/hypoechoic fluid cephalad to diaphragm, posterior when supine.<br><b>Tx</b>: treat shock FIRST, then chest tube (tube first → patient may die). Hypotension during placement → clamp the tube. Thoracotomy once stabilized (immediately if can\'t stabilize).',f:'Volume definition: handout 2000-4000 mL vs slide 13 "1500 cc considered massive."',s:'Handout p8; Pt2 slides 11-13'},
 {h:'Flail chest',b:'Inward movement on inspiration, outward on exhalation = paradoxical; sequential ribs fractured in ≥2 places → free-floating segment. Obvious in unconscious patients; may be hidden by splinting in conscious ones. Palpate; CXR may show multiple rib fractures but miss cardiac injury/costochondral separation; ABG helps.<br><b>Tx</b>: adequate ventilation, humidified O<sub>2</sub>, <b>limit crystalloid</b>, analgesics (may avoid prolonged intubation), internal stabilization (intubation + volume ventilation) if RR &gt;40 and pO<sub>2</sub> &lt;60 on FiO<sub>2</sub> &gt;60%.',s:'Handout p8-9; Pt2 slides 20-22'},
 {h:'Cardiac tamponade',b:'Most commonly penetrating (can be blunt). Acutely, small amounts cause big problems. <b>Beck\'s triad</b>: ↑CVP (JVD), hypotension, muffled heart sounds. JVD may be absent with blood loss → rely on suspicion + narrow pulse pressure. Penetrating wound 2nd-7th left ICS, especially lateral sternal border → suspect. Left tension PTX can mimic it (but has absent breath sounds). US: anechoic layer around heart. EKG: low voltage in all leads + electrical alternans.<br><b>Tx</b>: patent airway, IV therapy, prompt subxiphoid pericardiocentesis; thoracotomy with repair.',s:'Handout p9-10, p21; Pt2 slides 23-26'},
 {h:'PEA and its reversible causes',b:'Organized rhythm without a pulse (US may show motion). <table><tr><th>Cause</th><th>Treatment</th></tr><tr><td>Tension PTX</td><td>Needle decompression</td></tr><tr><td>Tamponade</td><td>Pericardiocentesis</td></tr><tr><td>Massive PE</td><td>Thrombolytics (tPA)</td></tr><tr><td>Hypoxia</td><td>100% O<sub>2</sub>, intubation</td></tr><tr><td>Severe hypercarbia</td><td>Intubation + hyperventilation</td></tr><tr><td>Hypovolemia</td><td>Fluid bolus</td></tr><tr><td>Acidosis</td><td>Measure pH; bicarb if pH &lt;7.0</td></tr><tr><td>Massive myocardial dysfunction</td><td>Treat reversible causes (US hypokinesis)</td></tr></table>',s:'Handout p10; Pt2 slides 27-29'},
 {h:'Bedside differentiation without CXR (SIP 4)',b:'<table><tr><th></th><th>Breath sounds</th><th>Percussion</th><th>Heart sounds</th><th>US</th></tr><tr><td>Tension PTX</td><td>Absent ipsi</td><td>Hyper-resonant</td><td>Normal</td><td>Pneumothorax (no sliding)</td></tr><tr><td>Massive hemothorax</td><td>Absent ipsi</td><td>Dull</td><td>Normal</td><td>Pleural fluid</td></tr><tr><td>Tamponade</td><td>Normal</td><td>Normal</td><td>Muffled</td><td>Pericardial effusion</td></tr></table>All three: hypotension + JVD (trachea deviates contralaterally late in tension).',s:'Handout p21'},
]);
// ---------- 4.21.3 Potentially life-threatening + non-lethal ----------
addO('4.21.3',[
 {src:'Hughes handout Self-Instructional Problem 3',q:'If a CT scan is not available, what other x-ray view might you obtain to determine if there is fluid, and which side do you put down?',sa:'A <b>lateral decubitus</b> film: put the <b>suspected side down</b> to see the fluid layer out. Ultrasound is also an option at the bedside.',s:'Handout p20-21'},
]);
addQ('4.21.3',[
 {q:'Which list is Dr. Hughes\' <b>potentially</b> life-threatening chest injuries (secondary survey)?',c:['Pulmonary contusion, aortic disruption, tracheobronchial disruption, esophageal disruption, diaphragmatic disruption, myocardial contusion','Tension PTX, open PTX, massive hemothorax, flail chest, tamponade, airway obstruction','Simple PTX, simple hemothorax, rib fractures','Aortic disruption, tamponade, tension PTX'],a:0,e:'Potentially lethal (Part 3): pulmonary contusion, aortic disruption, tracheobronchial, esophageal, diaphragmatic disruption, myocardial contusion. They are not obvious on exam, need a high index of suspicion, and missing them raises mortality.',s:'Handout p10-11; Pt3 slides 3-4'},
 {q:'What is the most common potentially lethal chest injury seen in this country?',c:['Pulmonary contusion','Traumatic aortic rupture','Myocardial contusion','Esophageal rupture'],a:0,e:'Pulmonary contusion is the most common potentially lethal chest injury. It is "potentially lethal" because respiratory failure develops over time rather than instantly.',s:'Handout p11'},
 {q:'Pulmonary contusion on imaging:',c:['Often does not show on the initial CXR, but often does show on the initial CT; tends to worsen over hours to days','Always visible on the first CXR','Never visible on CT','Resolves within 1 hour'],a:0,e:'"Often does not show up on initial CXR, often does show up on initial CT." Contusions often get progressively worse over the next hours to days.',s:'Handout p11; Pt3 slide 5'},
 {q:'A patient with pulmonary contusion maintains pO<sub>2</sub> ≥60 on room air. Which feature would argue AGAINST deferring intubation for 24-hour observation?',c:['Pre-existing chronic pulmonary disease','Young age','Isolated small contusion','Normal mental status'],a:0,e:'Intubation can be deferred with careful 24-h observation if pO<sub>2</sub> ≥60 on room air AND none of: pre-existing chronic lung disease, impaired consciousness, abdominal injury with ileus/operation, skeletal injuries needing immobilization, renal failure.',s:'Handout p11'},
 {q:'What is the most common cause of sudden death after an automobile accident or a fall from a great height?',c:['Traumatic aortic rupture','Tension pneumothorax','Myocardial contusion','Esophageal tear'],a:0,e:'Traumatic aortic rupture is the most common cause of sudden death after auto accident or fall from a height; tears are fatal nearly immediately in about 90%.',s:'Handout p11; Pt3 slide 6'},
 {q:'Traumatic aortic rupture most commonly occurs at which site?',c:['The ligamentum arteriosum','The aortic root at the valve','The abdominal aorta at the renal arteries','The aortic bifurcation'],a:0,e:'Aortic rupture tends to occur at the ligamentum arteriosum. An intact adventitial layer can maintain continuity and prevent immediate death.',s:'Handout p11'},
 {q:'Which plain chest x-ray finding does Dr. Hughes call <b>probably the most accurate</b> sign suggesting aortic injury?',c:['Obliteration of the aortic knob','Widened mediastinum','Fracture of the 1st and 2nd ribs','Pleural cap'],a:0,e:'Obliteration of the aortic knob is "probably the most accurate." Widened mediastinum is only ~50% accurate. Other signs: 1st/2nd rib fractures, trachea deviated right, pleural cap, left mainstem bronchus elevated/rightward or depressed, obliterated aortopulmonary window, NG tube/esophagus deviated left.',s:'Handout p12'},
 {q:'Which plain-film finding suggests aortic injury?',c:['Deviation of the esophagus (NG tube) to the LEFT','Deviation of the trachea to the left','Elevation of the right hemidiaphragm','Hyper-lucent left hemithorax'],a:0,e:'Aortic injury CXR signs include trachea deviated to the <b>right</b> and esophagus/NG tube deviated to the <b>left</b>, plus elevation and rightward shift OR depression of the left mainstem bronchus.',s:'Handout p12'},
 {q:'How is traumatic aortic injury typically diagnosed and treated today?',c:['Aortogram (now usually CT with IV contrast); surgical repair or resection with grafting','Echocardiogram; observation','CXR alone; chest tube','Bronchoscopy; stent'],a:0,e:'High index of suspicion (especially deceleration injuries; elderly tear with less energy) → aortogram, now typically CT with IV contrast. Treatment: direct repair or resection and grafting.',s:'Handout p12; Pt3 slide 6'},
 {q:'Per Dr. Hughes, in which patients may a relatively minor mechanism (even a fall) tear the aorta?',c:['The elderly','Children','Pregnant women','Athletes'],a:0,e:'"The older the patient the less energy it takes to tear; sometimes even falls will cause it to tear."',s:'Pt3 slide 6; Handout p12'},
 {q:'Fracture of the larynx is indicated by which triad?',c:['Bony crepitus, subcutaneous emphysema, hoarseness','JVD, hypotension, muffled heart sounds','Stridor, drooling, fever','Hemoptysis, chest pain, dyspnea'],a:0,e:'Laryngeal fracture triad: bony crepitus, subcutaneous emphysema, hoarseness. (Beck\'s triad = tamponade.)',s:'Handout p12'},
 {q:'A pneumothorax with a <b>persistent large air leak after tube thoracostomy</b> suggests:',c:['Major bronchial injury: confirm by bronchoscopy; a second chest tube may be needed','Esophageal rupture','Malpositioned tube only','Diaphragmatic hernia'],a:0,e:'Bronchial injury (usually blunt, within 1 inch of the carina; half of deaths within 1 hour) presents with hemoptysis, SQ emphysema, or tension PTX with mediastinal shift. Persistent large air leak after chest tube → major bronchial injury; bronchoscopy confirms; a second tube may overcome a large leak.',s:'Handout p13; Pt3 slides 9-12'},
 {q:'Where do most major bronchial injuries from blunt trauma occur?',c:['Within one inch of the carina','At the segmental bronchi','At the alveolar level','In the trachea above the thyroid'],a:0,e:'Most follow blunt trauma and occur within one inch of the carina.',s:'Handout p13'},
 {q:'A patient with depressed consciousness after neck trauma: what may be the only clue to airway obstruction/tracheobronchial injury?',c:['Labored respiratory effort','Bradycardia','Fever','Hypertension'],a:0,e:'Noisy breathing = partial obstruction; no breathing = complete. With depressed consciousness, "observation of labored respiratory effort may be the only clue." Endoscopy aids diagnosis.',s:'Handout p13'},
 {q:'What is the most common cause of esophageal trauma?',c:['Penetrating trauma','Blunt trauma to the chest','Caustic ingestion','Vomiting'],a:0,e:'Esophageal trauma is most commonly penetrating. Blunt injury (very rare, lethal if unrecognized) comes from a severe blow to the upper abdomen forcing gastric contents up → linear tear of the lower esophagus → mediastinitis/empyema. Instrumentation is another cause.',s:'Handout p13; Pt3 slide 13'},
 {q:'Which clue should prompt you to consider esophageal disruption?',c:['Left pneumothorax or hemothorax WITHOUT a rib fracture after a severe epigastric/lower sternal blow, with pain or shock out of proportion','Right hemothorax with multiple rib fractures','Persistent air leak only during inspiration','Hoarseness with crepitus'],a:0,e:'Consider esophageal injury with: left PTX/hemothorax without rib fracture; severe blow to lower sternum/epigastrium with pain or shock out of proportion; particulate matter in the chest tube after blood clears; chest tube bubbling continuously and equally in inspiration AND expiration. Mediastinal air (usually left). Confirm with Gastrografin swallow and/or esophagoscopy.',s:'Handout p13'},
 {q:'How is esophageal injury confirmed?',c:['Gastrografin (water-soluble contrast) swallow and/or esophagoscopy','Bronchoscopy','Aortogram','Echocardiogram'],a:0,e:'Gastrografin swallow and/or esophagoscopy. Treatment: wide drainage of pleural space and mediastinum with direct repair via thoracotomy; if not feasible, cervical esophageal diversion + gastrostomy.',s:'Handout p13-14'},
 {q:'Traumatic diaphragmatic hernia is more commonly diagnosed on which side, and why?',c:['Left, because bowel gas or the NG tube appears in the chest','Right, because the liver herniates','Left, because the right diaphragm is thinner','Right, because the heart is on the right'],a:0,e:'More commonly diagnosed on the LEFT: bowel or the nasogastric tube appears in the chest (NG tube curled in the left lower chest may make special studies unnecessary).',s:'Handout p14; Pt3 slide 14'},
 {q:'Blunt versus penetrating diaphragm injury:',c:['Blunt → large radial tears with immediate herniation; penetrating → small injuries that can take time (even years) to herniate','Both always herniate immediately','Penetrating → large tears; blunt → small tears','Neither causes herniation'],a:0,e:'Blunt trauma produces large radial tears allowing immediate herniation; penetrating trauma produces small injuries that may take years to become hernias.',s:'Handout p14'},
 {q:'A diaphragmatic hernia is often missed because the CXR is misread as:',c:['"Elevated left diaphragm," "acute gastric dilatation," "loculated pneumohemothorax," or "subpulmonary hematoma"','Normal lungs','Tension pneumothorax','Pulmonary edema'],a:0,e:'Classic misreads: elevated left hemidiaphragm, acute gastric dilatation, loculated pneumohemothorax, subpulmonary hematoma. Consider it whenever the left diaphragm can\'t be clearly identified. Confirm with contrast radiography; CT helps.',s:'Handout p14'},
 {q:'Myocardial contusion is diagnosed by:',c:['EKG abnormalities, cardiac enzymes, and history of injury','CXR alone','Bronchoscopy','Physical exam alone'],a:0,e:'Diagnosis: EKG changes, serial enzymes, and history. Patients are at risk of sudden dysrhythmias → monitored bed.',s:'Handout p14; Pt3 slide 15'},
 {q:'According to the Part 3 slides, the most common arrhythmia in myocardial contusion is:',c:['Sinus tachycardia','Ventricular fibrillation','Complete heart block','Atrial flutter'],a:0,e:'Slide 15: "Risk is believed to be cardiac arrhythmias; most common arrhythmia however is sinus tachycardia." Treatment: monitor ×48 h and observe (somewhat controversial; moving away from mandatory monitoring).',f:'The handout (p14) instead lists multiple PVCs, atrial fibrillation, bundle branch block (usually right) and ST changes as "the most common ECG findings." The slide says sinus tachycardia is the most common arrhythmia.',s:'Pt3 slide 15; Handout p14'},
 {q:'Which bundle branch block is typically seen with myocardial contusion per the handout?',c:['Right bundle branch block','Left bundle branch block','Left anterior fascicular block','None'],a:0,e:'Common ECG findings: multiple PVCs, atrial fibrillation, bundle branch block (usually right), ST changes.',s:'Handout p14'},
 {q:'Which three are Dr. Hughes\' <b>non-lethal</b> chest injuries?',c:['Simple pneumothorax, simple hemothorax, rib fractures','Flail chest, tamponade, aortic rupture','Pulmonary contusion, myocardial contusion, rib fractures','Open pneumothorax, simple hemothorax, rib fractures'],a:0,e:'Non-lethal: simple pneumothorax, simple hemothorax, rib fractures.',s:'Pt3 slide 16; Handout p14'},
 {q:'Simple pneumothorax: presentation, diagnosis and treatment?',c:['Chest pain, decreased breath sounds, hyper-resonance; upright inspiratory/expiratory (and lateral) films; observation ± chest tube','Dullness to percussion; CT; thoracotomy','Muffled heart sounds; echo; pericardiocentesis','Paradoxical motion; CXR; intubation'],a:0,e:'Simple PTX: chest pain, ↓breath sounds, hyper-resonance. Diagnose with upright inspiratory/expiratory films plus lateral CXR. Treatment: observation ± chest tube. Air collapses lung → V/Q defect. US: no lung sliding.',s:'Handout p15; Pt3 slide 17'},
 {q:'Simple hemothorax: what are the indications for open thoracotomy based on chest tube drainage?',c:['Initial drainage ≥1000 mL, &gt;200 mL/hr for 4 hours, or total loss of 1500 mL','Any blood in the tube','Initial 300 mL','&gt;50 mL/hr for 1 hour'],a:0,e:'Initial 1000 mL, over 200 mL/hr for 4 hours, or total 1500 mL → open thoracotomy. Most simple hemothoraces are self-limited (parenchymal, intercostal or internal mammary laceration). A large-caliber chest tube prevents clotted hemothorax/later decortication and lets you monitor.',s:'Handout p15; Pt3 slide 19'},
 {q:'What is the most common source of a simple hemothorax?',c:['Parenchymal laceration or laceration of an intercostal vessel or internal mammary artery','Aortic rupture','Pulmonary vein avulsion','Cardiac rupture'],a:0,e:'Primary cause: parenchymal laceration or laceration of an intercostal vessel or the internal mammary artery (penetrating or blunt). Usually self-limited.',s:'Handout p15'},
 {q:'Fractures of ribs 1 and 2 are significant because:',c:['They often indicate major injury to the head, neck, spinal cord, lungs and great vessels (mortality up to 50%)','They are the most common rib fractures','They never need imaging','They cause flail chest by definition'],a:0,e:'Upper ribs (1-3) are protected by the upper limb framework, so fractures imply large force with associated head/neck/spinal cord/lung/great vessel injuries; mortality as high as 50%. Middle ribs (5-9) sustain most blunt trauma.',s:'Handout p15-16; Pt3 slide 20'},
 {q:'Which ribs sustain the majority of blunt trauma?',c:['Middle ribs (5-9)','Ribs 1-2','Ribs 11-12','Rib 3 only'],a:0,e:'The middle ribs (5-9) sustain the majority of blunt trauma. AP compression bows ribs outward and drives fractured ends into the thorax (risk of pneumothorax).',s:'Handout p16; Pt3 slide 20'},
 {q:'Why is a CXR obtained in a patient with suspected rib fractures?',c:['Primarily to exclude other intrathoracic injuries, not just to identify rib fractures','To count every rib fracture with special rib views','Because rib belts require it','It is never indicated'],a:0,e:'CXR is done primarily to exclude other intrathoracic injuries. Special rib-technique films are expensive, miss injuries, add nothing to treatment and require painful positioning. Costochondral separations won\'t be seen on x-ray.',s:'Handout p16'},
 {q:'Treatment of rib fractures per Dr. Hughes:',c:['Symptomatic: analgesics and/or intercostal nerve blocks, with good respiratory effort hourly; avoid taping/rib belts','Rib belts and taping to splint','Routine surgical fixation','Bed rest with shallow breathing'],a:0,e:'Pain control (analgesics, intercostal nerve blocks) and preventing infection with good respiratory effort hourly. Taping, rib belts and external splints may help comfort but decrease pulmonary function, so they are not encouraged. Splinting causes hypoventilation → atelectasis/pneumonia (worse with pre-existing lung disease).',s:'Handout p16; Pt3 slide 21'},
]);
addN('4.21.3',[
 {h:'Potentially life-threatening injuries (secondary survey)',b:'Pulmonary contusion · Aortic disruption · Tracheobronchial disruption · Esophageal disruption · Diaphragmatic disruption · Myocardial contusion. Not obvious on exam; high index of suspicion; more often missed than diagnosed initially; missed → ↑morbidity/mortality. Routine CT of head, C-spine, chest, abdomen, pelvis catches more early.',s:'Handout p10-11; Pt3 slides 3-4'},
 {h:'Pulmonary contusion',b:'Most common potentially lethal chest injury in the US. Respiratory failure develops over time. Often not on initial CXR, often on initial CT; worsens over hours-days. Often requires intubation + mechanical ventilation (internal stabilization, esp. with large flail). May defer intubation with 24-h observation if pO<sub>2</sub> ≥60 on room air and NONE of: chronic lung disease, ↓consciousness, abdominal injury with ileus/operation, skeletal injury needing immobilization, renal failure.',s:'Handout p11; Pt3 slide 5'},
 {h:'Traumatic aortic rupture',b:'Most common cause of sudden death after car accident or fall from height; ~90% fatal nearly immediately. Mostly blunt/deceleration; elderly tear with less energy (even falls). Site: <b>ligamentum arteriosum</b>; intact adventitia can prevent immediate death. Dx: aortogram, now CT with IV contrast. Tx: direct repair or resection + graft.<br><b>Plain CXR signs</b>: (1) obliterated aortic knob (most accurate) (2) widened mediastinum (50% accurate) (3) 1st/2nd rib fractures (4) trachea deviated right (5) pleural cap (6) left mainstem bronchus elevated + shifted right (7) left mainstem depressed (8) obliterated space between PA and aorta (9) esophagus/NG tube deviated left.',s:'Handout p11-12; Pt3 slide 6'},
 {h:'Tracheobronchial injuries',b:'<b>Trachea</b>: penetrating or blunt; history all-important; associated carotid, jugular, esophageal injuries. <b>Laryngeal fracture triad</b>: bony crepitus, SQ emphysema, hoarseness. Noisy breathing = partial obstruction; no breathing = complete; labored effort may be the only clue if obtunded.<br><b>Bronchus</b>: unusual, frequently missed, fatal; mostly blunt, within 1 inch of carina; half of deaths within 1 h. Hemoptysis, SQ emphysema, tension PTX with mediastinal shift. Persistent large air leak after chest tube → major bronchial injury (may need second tube). Bronchoscopy confirms. Tx: airway maintenance + oxygenation; conservative to operative (slides: usually surgical).',s:'Handout p12-13; Pt3 slides 9-12'},
 {h:'Esophageal trauma',b:'Most commonly penetrating (also instrumentation). Blunt (rare, lethal if missed): severe upper-abdominal blow forces gastric contents up → linear lower-esophageal tear → mediastinitis, empyema. Suspect: left PTX/hemothorax without rib fracture; pain/shock out of proportion after lower sternal/epigastric blow; particulate matter in chest tube after blood clears; continuous equal bubbling in inspiration + expiration; mediastinal air (usually left). Confirm: Gastrografin swallow and/or esophagoscopy. Tx: wide drainage + thoracotomy repair, or cervical diversion + gastrostomy.',s:'Handout p13-14; Pt3 slide 13'},
 {h:'Traumatic diaphragmatic hernia',b:'Diagnosed more on the LEFT (bowel/NG tube in chest). Blunt → large radial tears, immediate herniation; penetrating → small tears, herniate over time (years). Misread as elevated left diaphragm, acute gastric dilatation, loculated pneumohemothorax, subpulmonary hematoma. Suspect if left diaphragm can\'t be identified. Confirm with contrast radiography; CT helps. Tx surgical.',s:'Handout p14; Pt3 slide 14'},
 {h:'Myocardial contusion',b:'Blunt chest trauma; complaints mistaken for chest wall contusion or sternal/rib fractures. Dx: EKG, serial enzymes, history. ECG findings: multiple PVCs, AF, BBB (usually right), ST changes (handout); slide: most common arrhythmia is sinus tachycardia. Risk of sudden dysrhythmias → monitored bed (×48 h; somewhat controversial).',f:'"Most common" ECG finding differs: handout lists PVCs/AF/RBBB/ST changes; slide 15 says sinus tachycardia.',s:'Handout p14; Pt3 slide 15'},
 {h:'Non-lethal: simple PTX, simple hemothorax, rib fractures',b:'<b>Simple PTX</b>: chest pain, ↓breath sounds, hyper-resonance; V/Q defect; upright inspiratory/expiratory + lateral films; observation ± chest tube.<br><b>Simple hemothorax</b>: parenchymal, intercostal or internal mammary laceration; usually self-limited; large-caliber chest tube (prevents clotted hemothorax/decortication, monitors bleeding). Thoracotomy if initial ≥1000 mL, &gt;200 mL/h ×4 h, or total 1500 mL. US: fluid cephalad to diaphragm, posterior.<br><b>Rib fractures</b>: most common thoracic cage injury; splinting → atelectasis/pneumonia. Ribs 1-2 → major associated injury (mortality up to 50%); 5-9 most common. CXR to exclude other injuries; no special rib films. Tx: analgesia, intercostal blocks, hourly deep breathing; avoid taping/rib belts.<br><b>Fluid on CXR</b>: 300 cc blunts CP angle; ~1000 cc blunts diaphragm. No CT → lateral decubitus film, suspected side down (or US).',s:'Handout p14-16, p21; Pt3 slides 16-21'},
]);
// ---------- 4.21.4 Procedures ----------
addQ('4.21.4',[
 {q:'For chest procedures, which pieces does Dr. Hughes say you must know in detail?',c:['The "for all procedures" rules, the complications of all procedures, and the needle decompression procedure (for the others: name and what disorder it treats)','Every step of chest tube and pericardiocentesis technique','Only pericardiocentesis','Only complications of chest tubes'],a:0,e:'"Need to know the \'For all procedures\' section, \'complications section\', and Needle Decompression Procedure. For the others (3-6) need to know name of procedure, what disorder it is used to treat, but not how to do it."',s:'Handout p16'},
 {q:'Which is one of the rules "for all procedures"?',c:['Obtain a chest x-ray after each procedure involving the chest','Never anesthetize','Skip consent in all trauma patients','Remove all IV access first'],a:0,e:'For all procedures: obtain consent if possible; prep surgically; anesthetize if possible; monitor vitals and lines; large-bore IV; obtain (and read) a CXR after each chest procedure.',s:'Handout p16; Pt4 slide 3'},
 {q:'Which is a listed complication of ALL procedures?',c:['Allergic reaction to prep/anesthesia/dressings, local cellulitis/infection, local hematoma, pneumothorax (chest procedures)','Aortic dissection','Stroke','Hyperkalemia'],a:0,e:'Complications of all procedures: allergic reaction (prep, anesthetic, dressings/tape), local cellulitis, local hematoma, infection, pneumothorax in chest procedures.',s:'Handout p16-17; Pt4 slide 4'},
 {q:'Needle thoracentesis (needle decompression) is indicated for:',c:['The rapidly deteriorating critical patient with a life-threatening tension pneumothorax','Stable simple pneumothorax','Cardiac tamponade','Massive hemothorax'],a:0,e:'"This procedure is for the rapidly deteriorating critical patient who has a life-threatening tension pneumothorax."',s:'Handout p17'},
 {q:'Needle decompression site (primary) and alternative:',c:['2nd intercostal space, midclavicular line; alternative 4th or 5th ICS anterior axillary line','5th ICS midaxillary line; alternative 2nd ICS MCL','Subxiphoid at 45°','7th ICS posterior axillary line'],a:0,e:'Second ICS in the midclavicular line on the side of the pneumothorax; alternative 4th/5th ICS anterior axillary line. (5th ICS midaxillary = chest tube; subxiphoid = pericardiocentesis.)',s:'Handout p7, p17'},
 {q:'During needle decompression the needle is directed:',c:['Just over (superior to) the rib into the interspace','Just under the rib','Through the middle of the rib','Directly into the lung parenchyma'],a:0,e:'Insert the needle and direct it just over (superior to) the rib into the interspace, avoiding the neurovascular bundle under each rib; then puncture the parietal pleura.',s:'Handout p17'},
 {q:'What equipment is listed for needle decompression?',c:['#14 gauge Angiocath (3-6 cm) attached snugly to a 35-50 mL syringe','#22 gauge needle on a 3 mL syringe','#16-18 gauge 6-inch catheter on a 60 mL syringe with 3-way stopcock','28 Fr chest tube'],a:0,e:'Needle decompression: #14 g Angiocath 3-6 cm on a 35-50 mL syringe. The #16-18 g 6-inch over-the-needle catheter with 60 mL syringe and 3-way stopcock is for pericardiocentesis.',s:'Handout p17, p19'},
 {q:'Correct order of needle decompression steps:',c:['Assess chest → high-flow O<sub>2</sub>/intubate → identify 2nd ICS MCL → prep → anesthetize if possible → insert over rib, puncture pleura → aspirate air → remove needle, dressing → CXR → prepare for chest tube','Chest tube first, then needle','Identify site → insert needle → obtain consent → CXR before procedure','Pericardiocentesis → needle → chest tube'],a:0,e:'Steps: assess; high-flow O<sub>2</sub> or intubate; identify 2nd ICS MCL (or 4th/5th AAL); surgically prep; local anesthesia if conscious/time permits; 14 g Angiocath on syringe; position (usually supine because C-spine uncertain; "air rises"); insert over the rib; puncture parietal pleura; aspirate as needed; remove needle, Band-Aid; CXR; prepare chest tube to underwater drain.',s:'Handout p17'},
 {q:'Why is needle decompression usually done supine in the trauma patient?',c:['Uncertainty about the cervical spine (upright only if C-spine injury ruled out)','Air collects inferiorly','It is easier to identify the 5th ICS','Supine prevents bleeding'],a:0,e:'Upright if C-spine injury ruled out, but "usually done in the supine position, due to uncertainty about the Cervical spine." Remember that air rises.',s:'Handout p17'},
 {q:'Chest tube (tube thoracostomy) usual insertion site:',c:['Nipple level (4th or 5th ICS) in the midaxillary line','2nd ICS midclavicular line','Subxiphoid','7th ICS paravertebral'],a:0,e:'Chest tube: usually nipple level (4th/5th ICS) at the midaxillary line, over the top of the rib. A second tube may be used for hemothorax.',s:'Handout p17'},
 {q:'Which disorder is pericardiocentesis used to treat?',c:['Cardiac tamponade','Tension pneumothorax','Massive hemothorax','Flail chest'],a:0,e:'Pericardiocentesis (subxiphoid, can be US-guided) treats cardiac tamponade; also a reversible PEA cause.',s:'Handout p10, p19; Pt4 slide 22'},
 {q:'During pericardiocentesis, the ECG suddenly shows an injury pattern (extreme ST-T changes, widened QRS) and PVCs. What does this mean?',c:['The needle has advanced into the ventricular myocardium; withdraw until the baseline tracing returns','Successful drainage','Tension pneumothorax has developed','Hypokalemia'],a:0,e:'An injury pattern means the needle is too far (in ventricular muscle); withdraw until the baseline ECG returns. PVCs may occur from myocardial irritation. The pattern may also recur as the epicardium re-approaches the needle during aspiration.',s:'Handout p19'},
 {q:'In simple cardiac tamponade, aspiration of pericardial blood produces:',c:['A rapid drop in CVP and a slower improvement in blood pressure','A rise in CVP','Immediate hypertension','No change'],a:0,e:'"Aspiration of the pericardial blood will result in a rapid drop in the CVP and a slower improvement in the blood pressure."',s:'Handout p19'},
 {q:'Which is a listed complication of chest tube insertion?',c:['Damage to the intercostal nerve/artery/vein (hemopneumothorax, intercostal neuralgia) or to internal mammary vessels if placed too medially','Electrical alternans','Aspiration of ventricular blood','Puncture of the esophagus only'],a:0,e:'Chest tube complications include dislodgment/disconnection, drainage device above chest level, kinking/clogging, intercostal neurovascular damage, internal mammary damage if too medial, malposition, laceration of thoracic/abdominal organs, leaky seal, mediastinal emphysema, persistent PTX, SQ emphysema, recurrence on removal, lung failing to expand (bronchoscopy).',s:'Handout p18-19'},
 {q:'After chest tube placement, the lung fails to expand. A likely cause and next step per the handout?',c:['Plugged bronchus or bronchus separated from parenchyma; bronchoscopy','Tube too large; remove','Normal finding; observe','Tamponade; pericardiocentesis'],a:0,e:'"Lung fails to expand due to plugged bronchus, or bronchus separated from lung parenchyma: Bronchoscopy required."',s:'Handout p19'},
 {q:'Which is a listed complication of pericardiocentesis?',c:['Laceration of a coronary artery or vein, ventricular laceration, new hemopericardium, VF, puncture of aorta/IVC/esophagus/peritoneum','Intercostal neuralgia only','Recurrent pneumothorax on tube removal','Damage to the long thoracic nerve'],a:0,e:'Pericardiocentesis complications: aspirating ventricular blood; coronary vessel laceration; ventricular laceration; new hemopericardium; pericarditis; VF; puncture of aorta, IVC, esophagus (→mediastinitis), peritoneum (→peritonitis).',s:'Handout p19-20'},
]);
addN('4.21.4',[
 {h:'What you must know (Dr. Hughes)',b:'Know the <b>"For all procedures"</b> rules, the <b>complications</b> section, and the <b>needle decompression</b> procedure in detail. For chest tube and pericardiocentesis: name + which disorder it treats, not how to do it.',s:'Handout p16'},
 {h:'For all procedures + complications',b:'Consent if possible · prep surgically · anesthetize if possible · monitor vitals and lines · large-bore IV · CXR after every chest procedure (and read it).<br><b>Complications of all</b>: allergic reaction (prep/anesthetic/dressings/tape), local cellulitis, local hematoma, infection, pneumothorax.',s:'Handout p16-17; Pt4 slides 3-4'},
 {h:'Needle thoracentesis = needle decompression (tension PTX)',b:'For the rapidly deteriorating critical patient with tension PTX. (1) assess chest/excursions (2) high-flow O<sub>2</sub> or intubate (3) 2nd ICS MCL on PTX side (alt 4th/5th ICS AAL) (4) prep (5) local anesthesia if conscious/time permits (6) #14 g Angiocath 3-6 cm snug on 35-50 mL syringe (7) upright only if C-spine cleared, usually supine; air rises (8) insert just OVER (superior to) the rib (9) puncture parietal pleura (10) aspirate enough air to relieve symptoms (11) remove needle, Band-Aid (12) CXR (13) prepare chest tube to underwater drain.',s:'Handout p17; Pt4 slides 6-7'},
 {h:'Chest tube (tube thoracostomy): name + use',b:'Treats pneumothorax/hemothorax (definitive after needle decompression; after shock control in massive hemothorax). Site: nipple level (4th/5th ICS), midaxillary line, over the top of the rib. Complications include intercostal neurovascular injury, internal mammary injury if too medial, malposition, organ laceration, leaks, persistent PTX, SQ emphysema, recurrence on removal, non-expansion (→ bronchoscopy).',s:'Handout p17-19'},
 {h:'Pericardiocentesis: name + use',b:'Treats <b>cardiac tamponade</b> (subxiphoid; can be US-guided). #16-18 g 6-inch over-the-needle catheter, 60 mL syringe, 3-way stopcock; skin 1-2 cm inferior-left of xiphochondral junction at 45°, advance cephalad toward tip of left scapula. ECG injury pattern = too deep → withdraw. Rapid ↓CVP, slower ↑BP. Leave catheter with stopcock closed; 12-lead after.',f:'Handout says aim toward the tip of the <b>left scapula</b>; Pt4 slide 23 diagram says "can aim for either shoulder."',s:'Handout p19-20; Pt4 slides 22-23'},

// ===== CLOUD: Supabase accounts, cloud saves, live leaderboard (separate from Starlung) =====
const CLOUD=(()=>{
 const SB_URL='https://hnznrymokanbejxywdbl.supabase.co',SB_KEY='sb_publishable_paU7YD34Ya3_upQ2lnrOFg_q0dsEnGm',DOM='@players.otolith.app';
 const C={sb:null,uid:null,name:'',chan:null,retry:0,busy:false,board:[]};
 function pill(k,t){const p=$('#syncPill');p.className=k;p.textContent=t}
 function init(){
  try{C.sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'otolith-auth'}})}catch(e){pill('bad','Offline');return}
  $('#btnAcct').onclick=acct;
  C.sb.auth.getSession().then(async({data})=>{if(data&&data.session){await onIn(data.session.user)}else{pill('warn','Browser save');setTimeout(()=>{if(!C.uid&&!sessionStorage.getItem('oto-skip'))acct(true)},700)}});
  addEventListener('beforeunload',e=>{if(!C.uid&&S.st.ans>0&&!sessionStorage.getItem('oto-coded')){e.preventDefault();e.returnValue=''}})}
 async function onIn(user){C.uid=user.id;C.name=(user.user_metadata&&user.user_metadata.username)||user.email.split('@')[0];pill('warn','Loading…');
  let cloud=null;try{const{data,error}=await C.sb.from('oto_saves').select('state').eq('user_id',C.uid).maybeSingle();if(error)throw error;if(data)cloud=data.state}catch(e){pill('bad','Load failed');toast('Could not load cloud save: '+esc(e.message||e),4000)}
  if(cloud){const local=S;const useCloud=!local.st.ans||(cloud.st&&cloud.st.ans>=local.st.ans)||(cloud.ts||0)>(local.ts||0);
   if(useCloud){S=Object.assign(fresh(),cloud);S.eq=Object.assign(fresh().eq,cloud.eq||{});S.own=Object.assign(fresh().own,cloud.own||{});S.st=Object.assign(fresh().st,cloud.st||{})}
   else if(local.st.ans&&cloud.st&&cloud.st.ans){/* local newer: keep and push */}}
  localWrite();hud();MAP.list();tab(curTab);$('#btnAcct').textContent='👤 '+C.name;await flush();pill('ok','Cloud saved')}
 async function flush(){if(!C.uid||!C.sb)return;if(C.busy){setTimeout(flush,800);return}C.busy=true;pill('warn','Saving…');
  try{const{error}=await C.sb.from('oto_saves').upsert({user_id:C.uid,state:S,updated_at:new Date().toISOString()});if(error)throw error;C.retry=0;pill('ok','Cloud saved');postBoard()}
  catch(e){C.retry++;pill('bad','Save failed – retrying');setTimeout(flush,Math.min(30000,2000*C.retry))}finally{C.busy=false}}
 async function postBoard(){if(!C.uid)return;try{await C.sb.from('oto_board').upsert({user_id:C.uid,name:C.name.slice(0,24),earned:S.earned,lv:level(),mastered:libCount(),ans:S.st.ans,acc:S.st.ans?Math.round(S.st.cor/S.st.ans*100):0,bosses:Object.keys(S.boss).length,eq:{cls:S.eq.cls,pet:S.eq.pet},updated_at:new Date().toISOString()})}catch(e){}}
 async function fetchBoard(){try{const{data,error}=await C.sb.from('oto_board').select('*').order('earned',{ascending:false}).limit(200);if(error)throw error;C.board=data||[]}catch(e){C.board=null}if(curTab==='board')drawBoard()}
 function renderBoard(){drawBoard();fetchBoard();if(!C.chan&&C.sb){try{C.chan=C.sb.channel('oto-board-live').on('postgres_changes',{event:'*',schema:'public',table:'oto_board'},()=>{clearTimeout(C.bt);C.bt=setTimeout(fetchBoard,400)}).subscribe()}catch(e){}}}
 function drawBoard(){const host=$('#p-board');if(C.board===null){host.innerHTML='<div class="card">Leaderboard unavailable right now.</div>';return}
  host.innerHTML=`${C.uid?'':'<div class="card">Sign in with the Account button to appear on the leaderboard.</div>'}<table class="lb"><tr><th>#</th><th>Player</th><th>◆ Earned</th><th>LV</th><th>Islands mastered</th><th>Bosses</th><th>Answers</th><th>Accuracy</th></tr>${(C.board||[]).map((r,i)=>`<tr class="${r.user_id===C.uid?'me':''}"><td>${i<3?['🥇','🥈','🥉'][i]:i+1}</td><td><b>${esc(r.name)}</b> <span class="muted">${esc((HERO.CLASS[(r.eq||{}).cls]||{}).n||'')}</span></td><td>${r.earned}</td><td>${r.lv}</td><td>${r.mastered}</td><td>${r.bosses}</td><td>${r.ans}</td><td>${r.acc}%</td></tr>`).join('')||'<tr><td colspan="8">No players yet. Be the first!</td></tr>'}</table>`}
 function acct(first){if(C.uid){modal(`<h3>👤 ${esc(C.name)}</h3><p>Your progress saves to the cloud automatically (status pill at the top).</p><div class="row"><button class="btn red" id="aOut">Sign out</button><button class="btn gray" onclick="closeModal()">Close</button></div>`);$('#aOut').onclick=async()=>{await flush();await C.sb.auth.signOut();localStorage.removeItem(LSKEY);location.reload()};return}
  let mode='new';const draw=()=>{modal(`<h3 class="px" style="font-size:13px">WELCOME TO OTOLITH ISLES</h3><p>Make a free account so your progress saves to the cloud and you show up on the class leaderboard. <b>This is a separate account from Starlung.</b></p>
   <div class="chips"><button class="chip ${mode==='new'?'on':''}" data-md="new">I'm new</button><button class="chip ${mode==='old'?'on':''}" data-md="old">I have an account</button></div>
   <div style="display:grid;gap:8px"><input type="text" id="aU" placeholder="Username (letters/numbers, shown on leaderboard)" autocomplete="username"><input type="password" id="aP" placeholder="Password (6+ characters)" autocomplete="${mode==='new'?'new-password':'current-password'}"></div>
   <div id="aErr" style="color:#a22;font-weight:800;margin:8px 0"></div><div class="row"><button class="btn green" id="aGo">${mode==='new'?'Create account':'Sign in'}</button>${first?'<button class="btn gray" id="aSkip">Play without account</button>':'<button class="btn gray" onclick="closeModal()">Cancel</button>'}</div>
   <p class="muted" style="margin-top:10px">No email needed. Don't forget your password, there is no reset button (ask the game owner).</p>`);
   $$('[data-md]').forEach(b=>b.onclick=()=>{mode=b.dataset.md;draw()});const sk=$('#aSkip');if(sk)sk.onclick=()=>{sessionStorage.setItem('oto-skip','1');closeModal();toast('Playing offline: progress stays in this browser. Make a save code in Progress &amp; Saves.',4500)};
   $('#aGo').onclick=async()=>{const u=$('#aU').value.trim().toLowerCase(),p=$('#aP').value;const err=t=>$('#aErr').textContent=t;if(!/^[a-z0-9_]{3,20}$/.test(u))return err('Username: 3–20 letters, numbers or _');if(p.length<6)return err('Password must be 6+ characters');
    $('#aGo').disabled=true;const email=u+DOM;try{let r;if(mode==='new'){r=await C.sb.auth.signUp({email,password:p,options:{data:{username:u}}});if(r.error&&/registered|exists/i.test(r.error.message))throw new Error('That username is taken. Pick another, or choose "I have an account".');if(r.error)throw r.error;if(!r.data.session)throw new Error('Account created but the server wants email confirmation. Tell the game owner.')}
     else{r=await C.sb.auth.signInWithPassword({email,password:p});if(r.error)throw new Error(/invalid/i.test(r.error.message)?'Wrong username or password.':r.error.message)}
     closeModal();toast('Signed in as '+u);await onIn(r.data.user)}catch(e){err(e.message||String(e));$('#aGo').disabled=false}}};draw()}
 return{init,flush,renderBoard,get uid(){return C.uid}};
})();

boot();
