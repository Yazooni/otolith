 {q:'The aggressive undifferentiated subtype of nasopharyngeal carcinoma histologically shows:',c:['Large pale epithelioid tumor cells mixed with abundant lymphocytes (may resemble lymphoma; formerly "lymphoepithelioma")','Keratin pearls','Zellballen','Papillary bilayer'],a:0,e:'Undifferentiated subtype: larger epithelioid cells with pale cytoplasm amid many lymphocytes; may mimic lymphoma; formerly lymphoepithelioma.',s:'Handout p6'},
 {q:'Which nasopharyngeal carcinoma subtype has the WORST prognosis per Dr. Kowalski?',c:['Keratinizing type','Non-keratinizing type','Both equal','Lymphoepithelioma always benign'],a:0,e:'Keratinizing type: keratin-producing epithelioid cells, scant lymphocytes, poor survival (~20% at 5 y). Non-keratinizing: good survival (80-90%).',s:'Handout p6'},
 {q:'Which salivary tumor arises essentially only in the parotid, is often bilateral, is linked to smoking, and has dense lymphoid stroma?',c:['Warthin tumor','Pleomorphic adenoma','Mucoepidermoid carcinoma','Acinic cell carcinoma'],a:0,e:'Warthin tumor: parotid only; the most common bilateral salivary tumor; smokers ~8× risk; males &gt; females; dense reactive lymphocytes; papillary cystadenoma lymphomatosum (bilayer of pink epithelium around papillae with lymphoid centers); rare malignant change.',s:'Handout p6-7'},
 {q:'Another name for Warthin tumor:',c:['Papillary cystadenoma lymphomatosum','Benign mixed tumor','Lymphoepithelioma','Carcinoma ex pleomorphic adenoma'],a:0,e:'Warthin = papillary cystadenoma lymphomatosum. Pleomorphic adenoma = benign mixed tumor.',s:'Handout p7'},
 {q:'What is the most common salivary gland tumor?',c:['Pleomorphic adenoma','Warthin tumor','Mucoepidermoid carcinoma','Adenoid cystic carcinoma'],a:0,e:'Pleomorphic adenoma (benign mixed tumor) is the most common salivary tumor; mucoepidermoid carcinoma is the most common MALIGNANT salivary tumor.',s:'Handout p7-8'},
 {q:'Why is a pleomorphic adenoma called a "benign mixed tumor"?',c:['Epithelial plus myoepithelial cells; myoepithelial cells can show mesenchymal differentiation (myxoid, cartilage, bone)','It contains lymphoma and carcinoma','It is mixed benign and malignant','It arises in multiple glands at once'],a:0,e:'Composed of epithelial and myoepithelial cells; myoepithelial component can make collagen, myxoid material, cartilage or bone. Presence or absence of these doesn\'t change biology.',s:'Handout p7'},
 {q:'Pleomorphic adenoma location and behavior:',c:['Parotid &gt;&gt; submandibular &gt;&gt; rare sublingual/minor; painless, slow-growing, movable; small recurrence risk; malignant-transformation risk rises the longer it is present','Mostly minor glands; rapidly growing','Always bilateral','Never recurs or transforms'],a:0,e:'Parotid &gt;&gt; submandibular &gt;&gt; sublingual/minor; ~50% of palate lesions; painless, slow, movable; ~4% recurrence after excision; increasing malignancy risk over time (~10% if present &gt;15 y) → "carcinoma ex pleomorphic adenoma" (adenocarcinoma or undifferentiated).',s:'Handout p7'},
 {q:'A carcinoma arising from a long-standing documented pleomorphic adenoma is called:',c:['Carcinoma ex pleomorphic adenoma','Warthin carcinoma','Mucoepidermoid carcinoma','Lymphoepithelioma'],a:0,e:'"Carcinoma ex pleomorphic adenoma (that isn\'t a typo)": adenocarcinoma or undifferentiated carcinoma arising in a known PA.',s:'Handout p7'},
 {q:'Which is the most common MALIGNANT salivary gland tumor?',c:['Mucoepidermoid carcinoma','Pleomorphic adenoma','Warthin tumor','Oncocytoma'],a:0,e:'Mucoepidermoid carcinoma: most common malignant salivary tumor; numerically most in the parotid but a high proportion of minor salivary/palate tumors (which tend to be malignant); no gender predominance; age 15 to elderly.',s:'Handout p8'},
 {q:'Mucoepidermoid carcinoma is classically described as tricellular. Which three cells?',c:['Squamous, mucin-producing, intermediate cells','Epithelial, myoepithelial, cartilage','Oncocytes, lymphocytes, plasma cells','Acinar, ductal, basal'],a:0,e:'Tricellular: squamous, mucin and intermediate cells. Favorable: abundant mucin, cystic architecture, no necrosis. Low grade: excellent survival; high grade: higher recurrence/metastasis and poorer survival.',s:'Handout p8'},
 {q:'Salivary tumors of the minor glands/palate, as a group, tend to be:',c:['Malignant rather than benign','Always benign','Warthin tumors','Absent'],a:0,e:'Minor salivary/palate tumors as a group tend to be malignant; mucoepidermoid carcinoma accounts for a high proportion.',s:'Handout p8'},
 {q:'Sjögren syndrome serology:',c:['Anti-Ro (SSA) and anti-La (SSB)','c-ANCA','Anti-centromere','Anti-mitochondrial'],a:0,e:'Anti-Ro/SSA and anti-La/SSB are typical of Sjögren (lymphocytic infiltration, glandular destruction; parotid/lacrimal enlargement then atrophy). Any salivary/lacrimal/parotid enlargement process (autoimmune, lymphoma, TB) can be called Mikulicz syndrome.',s:'Handout p10-11'},
]);
addN('4.19.2',[
 {h:'Polypoid oral/sinonasal lesions',b:'<b>Irritation fibroma</b>: reactive fibrous proliferation; intact mucosa; gingiva or buccal bite line; excise.<br><b>Pyogenic granuloma</b>: exaggerated granulation tissue (vessels + neutrophils); fast, may regress/fibrose; kids, young adults, <b>pregnancy</b>; gingiva most common; not pyogenic, not a granuloma.<br><b>Mucocele</b>: blocked or ruptured salivary duct → mucus pool; kids/young adults; inner lower lip, buccal mucosa, floor of mouth (<b>ranula</b>); bluish.<br><b>Nasal polyp</b>: ~5%; allergic association (asthma, aspirin); steroids help; non-neoplastic; M &gt; F, &gt;20 y; respiratory epithelium over edematous inflamed stroma (eosinophils, neutrophils, plasma cells).<br><b>Schneiderian papilloma</b>: M &gt;&gt; F, 30-60 y; low-risk HPV both, high-risk in inverted. Exophytic = septum. <b>Inverted</b> = lateral wall/sinuses, locally aggressive, recurs, ~10% malignant. Koilocytes.<br><b>Nasopharyngeal carcinoma</b>: EBV; endemic (Africa children; S. China/SE Asia adults); nitrosamines; M:F 2:1. Undifferentiated (lymphocyte-rich, ex-"lymphoepithelioma"); keratinizing (poor, ~20% 5-y); non-keratinizing (good, 80-90%).',s:'Handout p2-6'},
 {h:'Salivary tumors',b:'<b>Warthin</b>: parotid only; ~10% bilateral and most bilateral salivary tumors are Warthin; smokers 8×; M &gt; F; papillary cystadenoma lymphomatosum (epithelial bilayer + lymphoid stroma with germinal centers).<br><b>Pleomorphic adenoma</b> (benign mixed): most common salivary tumor; epithelial + myoepithelial (myxoid, cartilage, bone); parotid &gt;&gt; submandibular &gt;&gt; minor; 50% of palate lesions; painless, slow, mobile; recurrence ~4%; malignancy risk rises with time (~10% &gt;15 y) → carcinoma ex PA. Gross: pearly blue-gray cartilage.<br><b>Mucoepidermoid carcinoma</b>: most common malignant; parotid numerically, large share of minor/palate tumors (minor gland tumors tend to be malignant); tricellular (squamous, mucin, intermediate); grade drives prognosis.<br><b>Sjögren</b>: anti-Ro/SSA, anti-La/SSB; Mikulicz = any salivary/lacrimal enlargement.',s:'Handout p6-11'},
]);

// ===== 4.06 Rhinitis · 4.07 Sinusitis · 4.12 Epistaxis (Strabbing / Hughes) =====
addQ('4.06',[
 {q:'A patient has clear rhinorrhea, sneezing, itchy watery eyes, positive allergy tests, elevated IgE and a positive family history; afebrile. Type of rhinitis?',c:['Allergic rhinitis','Vasomotor rhinitis','Acute (viral) rhinitis','Smoker\'s rhinitis'],a:0,e:'Allergic rhinitis: afebrile, clear drainage, may have polyps, allergy tests +, IgE +, family history +. Vasomotor has the same picture but allergy tests, IgE and family history are all NEGATIVE.',s:'Slides 5, 11'},
 {q:'A patient has afebrile clear rhinorrhea triggered by temperature/humidity changes and smoke. Allergy testing, IgE and family history are all negative. Diagnosis?',c:['Vasomotor rhinitis','Seasonal allergic rhinitis','Perennial allergic rhinitis','Allergic fungal rhinosinusitis'],a:0,e:'Vasomotor rhinitis: afebrile, clear drainage, allergy tests negative, IgE negative, family history negative.',s:'Slides 11-12'},
 {q:'The pathophysiology of vasomotor rhinitis is:',c:['Overactive parasympathetic activity from a wide variety of triggers','IgE-mediated mast cell degranulation','Viral invasion of nasal epithelium','Loss of ciliary clearance from smoking'],a:0,e:'Vasomotor rhinitis = rhinitis secondary to overactive parasympathetic activity from many triggers.',s:'Slide 12'},
 {q:'Why can pregnancy and oral contraceptives trigger vasomotor rhinitis?',c:['Estrogen inhibits anticholinesterases (↑cholinergic/parasympathetic effect)','Progesterone causes IgE production','Estrogen destroys cilia','They cause sinusitis'],a:0,e:'Endocrine/metabolic triggers: pregnancy, OCPs; estrogen inhibits anticholinesterases.',s:'Slide 12'},
 {q:'Which medication class is listed as a trigger of vasomotor rhinitis?',c:['Antihypertensives (also antipsychotics, cocaine)','Antibiotics','Antifungals','Proton pump inhibitors'],a:0,e:'Medication triggers: antihypertensives, antipsychotics, cocaine. Psychotropic triggers: anxiety, stress, exercise.',s:'Slide 13'},
 {q:'Which medical therapy is listed for vasomotor rhinitis?',c:['Anticholinergic nasal spray (ipratropium/Atrovent) or azelastine nasal spray','Oral antihistamines as first line','Nasal steroids as first line','Oral antibiotics'],a:0,e:'Vasomotor Tx: chemical cautery, anticholinergic nasal sprays (ipratropium, 2 sprays each nostril tid/qid), azelastine (2 sprays each nostril bid). Oral antihistamines and nasal steroids do NOT give symptomatic relief in most patients.',s:'Slide 14'},
 {q:'Oral antihistamines and nasal steroids in vasomotor rhinitis:',c:['Do not give symptomatic relief in most patients','Are curative','Are the only effective option','Worsen it dramatically'],a:0,e:'"Oral antihistamines and nasal steroids DO NOT give symptomatic relief in most patients."',s:'Slide 14'},
 {q:'Which surgical option for vasomotor rhinitis targets its mechanism directly?',c:['Division of parasympathetic fibers','Adenoidectomy','Tonsillectomy','Maxillary antrostomy only'],a:0,e:'Surgical management: surface turbinate cautery (electro, chemical, cryo), septoplasty (removes mechanical irritation points), partial turbinectomy, division of parasympathetic fibers.',s:'Slide 15'},
 {q:'Seasonal allergic rhinitis is classically triggered by:',c:['Pollens (bluegrass, Timothy, ragweed)','Dust mites','Molds in basements','Animal dander'],a:0,e:'Seasonal: pollen (bluegrass, Timothy, ragweed). Perennial: household allergens (dust mites, molds, feathers, dander), sensitive to chemical irritants.',s:'Slide 6'},
 {q:'Which is NOT listed as a treatment for seasonal allergic rhinitis?',c:['Oral antibiotics','Nasal steroids','Montelukast','Allergy desensitization (SCIT or SLIT)'],a:0,e:'Seasonal AR is ideal for medical treatment: antihistamines, decongestants, nasal steroids (Flonase, Nasonex, Nasacort AQ, Rhinocort Aqua), montelukast 10 mg daily, desensitization (SCIT/SLIT).',s:'Slide 7'},
 {q:'Montelukast (Singulair) works by:',c:['Selectively binding cysteinyl leukotriene receptors','Blocking H1 receptors','Anticholinergic action','Inhibiting 5-lipoxygenase'],a:0,e:'Singulair 10 mg PO daily, selectively binds cysteinyl leukotriene receptors.',s:'Slide 7'},
 {q:'The dust mite allergen is:',c:['A fecal antigen; mites live off skin flakes','A salivary antigen from the mite bite','Mite eggs','Mold spores carried by mites'],a:0,e:'House mites: a fecal antigen; live off skin flakes. Control: wash linens in 140° water, plastic pillow liners, HEPA filters.',s:'Slide 9'},
 {q:'Which is an environmental measure for PERENNIAL allergic rhinitis?',c:['Keep animals outside, no smoking in the house, minimize rugs, avoid humidifiers','Use a humidifier year-round','Add houseplants','Carpet the bedroom'],a:0,e:'Perennial AR: animals outside, no smoking indoors, molds in houseplants/basements/showers/humidifiers (humidifiers also increase mites), minimize rugs.',s:'Slide 8'},
 {q:'What is the most common cause of acute rhinitis?',c:['Viral','Bacterial','Fungal','Allergic'],a:0,e:'Acute rhinitis: most common cause viral.',s:'Slide 10'},
 {q:'Smoker\'s rhinitis: which statement is correct?',c:['Chronic, resistant to medications and surgery; hypertonic saline rinses help; cessation may transiently worsen symptoms','Responds well to oral antihistamines','Cured by septoplasty','Acute and self-limited'],a:0,e:'Chronic, resistant to meds and surgery; hypertonic saline helps. Quitting may transiently worsen symptoms if goblet cell activity/secretions recover before ciliary clearance does.',s:'Slide 16'},
 {q:'Why might smoking cessation transiently WORSEN smoker\'s rhinitis?',c:['Goblet cell activity and secretions recover before ciliary clearance recovers','Nicotine withdrawal causes IgE spikes','Parasympathetic fibers regenerate','The septum perforates'],a:0,e:'Secretions return before cilia recover clearance.',s:'Slide 16'},
]);
addN('4.06',[
 {h:'Rhinitis types + workup',b:'Symptoms: obstruction, drainage, itchy watery eyes, facial pressure/pain, sneezing, asthma. Types: allergic (seasonal, perennial), acute (most often viral), vasomotor, smoker\'s, allergic fungal (with fungal rhinosinusitis).<table><tr><th></th><th>Allergic</th><th>Vasomotor</th></tr><tr><td>Fever</td><td>afebrile</td><td>afebrile</td></tr><tr><td>Drainage</td><td>clear (± polyps)</td><td>clear</td></tr><tr><td>Allergy tests / IgE / family hx</td><td>+ / + / +</td><td>− / − / −</td></tr></table>',s:'Slides 3-5, 11'},
 {h:'Allergic rhinitis',b:'<b>Seasonal</b>: pollens (bluegrass, Timothy, ragweed). Ideal for medical Tx: antihistamines, decongestants, nasal steroids (Flonase, Nasonex, Nasacort AQ, Rhinocort Aqua), montelukast 10 mg daily (cysteinyl leukotriene receptor), desensitization SCIT/SLIT.<br><b>Perennial</b>: dust mites (fecal antigen, eat skin flakes: 140° linen wash, plastic pillow liners, HEPA), molds (houseplants, basements, showers, humidifiers), feathers, dander. Animals outside, no indoor smoking, minimize rugs.',s:'Slides 6-9'},
 {h:'Vasomotor rhinitis',b:'Overactive <b>parasympathetic</b> activity. Triggers: humidity/temperature, dust, smoke, pollution; pregnancy, OCPs (estrogen inhibits anticholinesterases); antihypertensives, antipsychotics, cocaine; anxiety, stress, exercise.<br>Tx: chemical cautery; <b>ipratropium</b> nasal (2 sprays each nostril tid/qid); <b>azelastine</b> (2 sprays bid). Oral antihistamines + nasal steroids do NOT help most. Surgery: turbinate surface cautery, septoplasty, partial turbinectomy, division of parasympathetic fibers.',s:'Slides 11-15'},
 {h:'Smoker\'s rhinitis',b:'Chronic; resistant to meds and surgery; hypertonic saline rinses help. Cessation may transiently worsen symptoms (secretions recover before cilia).',s:'Slide 16'},
]);
addQ('4.07',[
 {q:'Which organisms are listed as pathogens of acute bacterial sinusitis?',c:['H. influenzae, Moraxella catarrhalis, Streptococcus pneumoniae, anaerobes','Staph aureus, Pseudomonas, E. coli','Aspergillus, Mucor, Rhizopus','GABHS, Mycoplasma, Chlamydia'],a:0,e:'Acute bacterial sinusitis pathogens: H. influenzae, M. catarrhalis, S. pneumoniae, anaerobic organisms.',s:'Slide 2'},
 {q:'Which is a MAJOR factor (not minor) for diagnosing sinusitis?',c:['Hyposmia/anosmia','Headache','Halitosis','Dental pain'],a:0,e:'Major: facial pain/pressure, facial congestion/fullness, nasal obstruction, nasal discharge/purulence, hyposmia/anosmia, purulence on exam. Minor: headache, fever (non-acute), halitosis, fatigue, dental pain, cough, ear pain/pressure/fullness.',s:'Slide 3'},
 {q:'Which is a MINOR factor for sinusitis?',c:['Ear pain/pressure/fullness','Facial pain/pressure','Nasal obstruction','Purulence in the nasal cavity on exam'],a:0,e:'Ear pain/pressure is a minor factor (with headache, non-acute fever, halitosis, fatigue, dental pain, cough).',s:'Slide 3'},
 {q:'Which is a reason to refer a sinusitis patient to otolaryngology?',c:['Infection not responding to two 3-week courses of antibiotics','First episode of acute sinusitis','Clear rhinorrhea for 3 days','Seasonal sneezing'],a:0,e:'Refer: 3-4 infections per year, infection not responding to two 3-week antibiotic courses, nasal polyps, a complication of sinusitis.',s:'Slide 4'},
 {q:'In primary care, acute sinusitis is reliably diagnosed by:',c:['A good history and physical exam detecting most or all common signs and symptoms','CT in every patient','MRI','Maxillary sinus tap'],a:0,e:'History and physical can provide a reliable diagnosis in primary care.',s:'Slide 5'},
 {q:'Imaging study of choice for the paranasal sinuses, and why not MRI for acute sinusitis?',c:['CT; MRI does not distinguish air from bone','MRI; CT radiation','Plain films; CT too costly','Ultrasound; CT too slow'],a:0,e:'CT is the study of choice (cost similar to plain films with limited axial views). MRI is not recommended for acute sinusitis because it does not distinguish air from bone.',s:'Slide 6'},
 {q:'Which sinus culture technique is more sensitive than the old maxillary sinus tap?',c:['Endoscopically directed middle meatal (EDMM) culture','Nasopharyngeal swab','Blood culture','Throat culture'],a:0,e:'EDMM cultures are more sensitive than a maxillary sinus tap.',s:'Slide 7'},
 {q:'Sinusitis symptoms for 8 weeks are classified as:',c:['Subacute','Acute','Chronic','Recurrent acute'],a:0,e:'Acute &lt;4 weeks; subacute 4-12 weeks; chronic &gt;12 weeks; recurrent acute = 4 or more episodes in one year.',s:'Slide 9'},
 {q:'Recurrent acute sinusitis is defined as:',c:['4 or more episodes in one year','2 episodes in a lifetime','Symptoms &gt;12 weeks','Symptoms 4-12 weeks'],a:0,e:'Recurrent acute: ≥4 episodes in one year.',s:'Slide 9'},
 {q:'Role of oral antihistamines in rhinosinusitis WITHOUT allergic symptoms:',c:['Questionable','First line','Curative','Contraindicated always'],a:0,e:'In the absence of allergic symptoms, oral antihistamines have a questionable role. Topical nasal steroids are better for prevention in allergic patients but can be used as an adjunct.',s:'Slide 10'},
 {q:'Which adjunctive treatment for recurrent/chronic sinusitis requires caution in hypertensive patients?',c:['Decongestants','Saline nasal spray','Nasal steroids','Itraconazole'],a:0,e:'Adjuncts: saline moisturizer, decongestants (careful in hypertensive patients).',s:'Slide 11'},
 {q:'Treatment of chronic bacterial sinusitis:',c:['3-6 week regimen of broad-spectrum antibiotics; surgery is frequently required because medical management often fails','5 days of amoxicillin','Antifungals','No treatment'],a:0,e:'Chronic bacterial sinusitis: antibiotics 3-6 weeks broad spectrum; medical management often fails, so surgery is frequently required.',s:'Slide 12'},
 {q:'Allergic fungal rhinosinusitis is considered analogous to which lung disease?',c:['Allergic bronchopulmonary aspergillosis (ABPA)','Invasive aspergillosis','Sarcoidosis','Hypersensitivity pneumonitis'],a:0,e:'AFRS is analogous to ABPA. Organisms: Aspergillus fumigatus, Alternaria, Exserohilum, Curvularia, Drechslera, Bipolaris.',s:'Slide 15'},
 {q:'A patient with nasal airway obstruction progresses to extensive nasal polyposis; there is no pain. Afebrile, clear drainage, IgE positive, eosinophil major basic protein positive. Diagnosis?',c:['Allergic fungal rhinosinusitis','Mucormycosis','Acute bacterial sinusitis','Chronic invasive fungal sinusitis'],a:0,e:'AFRS: early obstruction, late extensive polyposis; pain is uncommon (pain suggests bacterial infection). Dx: afebrile, clear drainage, intranasal polyps, IgE +, eMBP antigen, Alt-1 antigen (Alternaria).',s:'Slides 16-17'},
 {q:'In allergic fungal rhinosinusitis, PAIN suggests:',c:['A bacterial infection','Disease progression only','Mucormycosis','Steroid side effect'],a:0,e:'"Pain is uncommon (pain suggests a bacterial infection)."',s:'Slide 16'},
 {q:'The "three-pronged attack" on allergic fungal rhinosinusitis is:',c:['Remove antigenic burden with FESS, halt inflammation with topical + systemic steroids, and start immunotherapy post-operatively','Amphotericin B, surgery, hyperbaric O<sub>2</sub>','Antibiotics, decongestants, saline','Itraconazole alone for life'],a:0,e:'Three prongs: immunotherapy initiated post-op, FESS to remove antigen, topical/systemic steroids. Monitor with total serum IgE. Also listed: surgical debridement, itraconazole, antifungal washes, intranasal steroids.',s:'Slides 18-19'},
 {q:'Allergic fungal rhinosinusitis disease activity is monitored with:',c:['Total serum IgE','ESR','Sweat chloride','Blood cultures'],a:0,e:'"Monitor disease with total serum IgE."',s:'Slide 19'},
 {q:'Chronic invasive fungal sinusitis: best imaging and treatment?',c:['MRI (best) + CT, biopsy/culture; surgical debridement + long-term amphotericin B and itraconazole','CXR; observation','CT only; nasal steroids','No imaging; oral fluconazole'],a:0,e:'Pathogens: Aspergillus, Mucor, Rhizopus, Absidia. Dx: biopsy and culture, MRI (best) and CT. Tx: surgical debridement and long-term amphotericin B and itraconazole.',s:'Slide 20'},
 {q:'A patient in DKA has black, necrotic nasal turbinates and new cranial nerve deficits. Mechanism of this infection?',c:['Mucormycosis invades vessel walls → local vascular occlusion, thrombosis, infarction, necrosis','IgE-mediated hypersensitivity','Bacterial biofilm on polyps','Viral cytopathic effect'],a:0,e:'Fulminant fungal sinusitis/mucormycosis invades vessel walls → occlusion, thrombosis, infarction, necrosis; almost exclusively in immunocompromised (DKA, HIV, chemo, BMT). Dx: necrotic black turbinates, biopsy/culture, CN involvement, MRI best.',s:'Slides 21-22'},
 {q:'Treatment of mucormycosis:',c:['Aggressive, urgent surgical debridement + long-term amphotericin B + maximal correction of underlying derangements','Oral fluconazole outpatient','Nasal steroids','Watchful waiting'],a:0,e:'Aggressive urgent debridement, long-term amphotericin B, and maximal medical management of underlying problems (e.g., DKA).',s:'Slide 23'},
 {q:'Samter\'s triad consists of:',c:['Nasal polyposis, aspirin intolerance, asthma','Polyps, otitis media, bronchiectasis','Sinusitis, situs inversus, infertility','Epistaxis, telangiectasia, AV malformations'],a:0,e:'Samter\'s triad: nasal polyposis, ASA intolerance, asthma (status asthmaticus if given ASA).',s:'Slide 24'},
 {q:'Azelastine (Astelin) nasal spray:',c:['Inhibits secretions, serotonin, leukotrienes and histamine without sedation','Is a decongestant causing rebound','Is a steroid','Is an anticholinergic only'],a:0,e:'Astelin: antihistamine nasal spray; inhibits secretions, serotonin, leukotrienes and histamine; no sedation.',s:'Slide 25'},
 {q:'A patient has used oxymetazoline spray daily for 3 weeks and now cannot breathe through the nose without it. Diagnosis and treatment?',c:['Rhinitis medicamentosa; stop the spray and use nasal steroids + saline','Allergic rhinitis; add antihistamine','Sinusitis; antibiotics','Septal perforation; septal button'],a:0,e:'Do not use intranasal decongestant sprays &gt;5 days: addictive, mucosal damage. Treatment: nasal steroids and nasal saline.',s:'Slide 26'},
 {q:'Nasal septal perforation presents with whistling, nasal deformity and bleeding. Treatment options listed?',c:['Septal button and moisturizers (surgery has a high failure rate)','Surgery always succeeds','Silver nitrate','Oral steroids'],a:0,e:'Septal perforation Tx: septal button; surgery has high failure rate; moisturizers.',s:'Slide 27'},
 {q:'Which allergy test is the GOLD STANDARD?',c:['Skin end-point titration (SET)','Prick testing','RAST','Total IgE'],a:0,e:'SET = gold standard (uncomfortable; can\'t be on beta-blockers). Prick: well tolerated, less accurate, no beta-blockers. RAST: great for kids, CAN be on beta-blockers, less accurate than SET.',s:'Slide 28'},
 {q:'A child on a beta-blocker needs allergy testing. Which test fits best?',c:['RAST','SET','Prick testing','Any skin test'],a:0,e:'RAST: great for kids and patients can be on beta-blockers. Skin tests (prick and SET) cannot be done on beta-blockers.',s:'Slide 28'},
 {q:'A CT shows UNILATERAL sinus opacification. Why is this a red flag?',c:['Consider inverting papilloma, squamous cell carcinoma, lymphoma, angiofibroma','It always means a foreign body','It means allergic rhinitis','It is normal anatomy'],a:0,e:'"Unilateral sinusitis: RED FLAG!!!! Consider inverting papilloma, SCC, lymphoma, angiofibroma."',s:'Slide 33'},
 {q:'A toddler has unilateral nasal obstruction with foul unilateral discharge. Most likely cause and first step?',c:['Nasal foreign body; examine with a headlight and nasal speculum before calling the specialist, then remove','Allergic rhinitis; antihistamine','Acute sinusitis; CT','Adenoid hypertrophy; adenoidectomy'],a:0,e:'Nasal FBs are more common in children: unilateral obstruction and discharge. Removal; "You must do an exam with a headlight and a nasal speculum before you call the specialist."',s:'Slide 34'},
 {q:'Which surgical treatments for sinonasal disease are listed?',c:['Endoscopic sinus surgery, turbinate surgery, septoplasty (e.g., septal spur into the middle meatus)','Laryngectomy','Tonsillectomy','Caldwell-Luc for all patients'],a:0,e:'Surgical treatments: endoscopic sinus surgery, turbinate surgery, septoplasty (septal spur protruding into the middle meatus); computer guidance.',s:'Slides 29-31'},
]);
addN('4.07',[
 {h:'Acute bacterial sinusitis: diagnosis',b:'Pathogens: <b>H. influenzae, M. catarrhalis, S. pneumoniae</b>, anaerobes.<table><tr><th>Major factors</th><th>Minor factors</th></tr><tr><td>Facial pain/pressure; facial congestion/fullness; nasal obstruction; nasal discharge/purulence; hyposmia/anosmia; purulence on exam</td><td>Headache; fever (non-acute); halitosis; fatigue; dental pain; cough; ear pain/pressure/fullness</td></tr></table>Primary care: good H&amp;P is reliable. Imaging: <b>CT</b> (MRI can\'t distinguish air from bone). Culture: <b>EDMM</b> &gt; maxillary tap.<br>Duration: acute &lt;4 wk; subacute 4-12 wk; chronic &gt;12 wk; recurrent acute ≥4/yr.<br>Refer to ENT: 3-4 infections/yr; failed two 3-week antibiotic courses; polyps; complication.',s:'Slides 2-9'},
 {h:'Treatment',b:'Oral antihistamines questionable without allergy; nasal steroids for prevention in allergic patients/adjunct. Adjuncts: saline, decongestants (caution in HTN). Chronic bacterial: broad-spectrum antibiotics 3-6 wk; surgery frequently required. Surgery: endoscopic sinus surgery, turbinate surgery, septoplasty.<br><b>Rhinitis medicamentosa</b>: no topical decongestant (oxymetazoline) &gt;5 days; addictive, mucosal damage; Tx nasal steroids + saline.<br><b>Azelastine</b>: inhibits secretions, serotonin, leukotrienes, histamine; non-sedating.',s:'Slides 10-12, 25-31'},
 {h:'Fungal sinus disease',b:'<b>AFRS</b>: analogous to ABPA (A. fumigatus, Alternaria, Exserohilum, Curvularia, Drechslera, Bipolaris). Early obstruction → late extensive polyposis; pain uncommon (pain = bacterial). Dx: afebrile, clear drainage, polyps, IgE +, eMBP, Alt-1. Tx: debridement/FESS, itraconazole, antifungal washes, intranasal steroids; three-pronged (FESS + steroids + post-op immunotherapy). Monitor total IgE.<br><b>Chronic invasive</b>: Aspergillus, Mucor, Rhizopus, Absidia; biopsy/culture, MRI best + CT; debridement + long-term amphotericin B + itraconazole.<br><b>Fulminant/mucormycosis</b>: invades vessel walls → thrombosis, infarction, necrosis; immunocompromised (DKA, HIV, chemo, BMT); black necrotic turbinates, CN involvement, MRI best; urgent aggressive debridement + amphotericin B + correct underlying problem.',f:'Slide 13 lists AFRS "also known as intrinsic, hyperplastic, eosinophilic nonallergic rhinitis"; those names usually describe nonallergic eosinophilic rhinitis, so this was not quizzed.',s:'Slides 13-23'},
 {h:'Other sinonasal pearls',b:'<b>Samter\'s triad</b>: nasal polyps + ASA intolerance + asthma (status asthmaticus with ASA).<br><b>Septal perforation</b>: whistling, deformity, bleeding; septal button, moisturizers (surgery high failure).<br><b>Allergy tests</b>: prick (tolerated, less accurate, no β-blockers); SET (gold standard, uncomfortable, no β-blockers); RAST (kids, OK on β-blockers, less accurate).<br><b>Unilateral sinusitis = RED FLAG</b>: inverting papilloma, SCC, lymphoma, angiofibroma.<br><b>Nasal FB</b>: kids, unilateral obstruction + discharge; headlight + speculum exam before calling ENT.',s:'Slides 24-34'},
]);
addQ('4.12',[
 {q:'Kiesselbach\'s plexus (Little\'s area) is formed by anastomoses of which arteries?',c:['Sphenopalatine, anterior ethmoid, superior labial, greater palatine','Posterior nasal, anterior + posterior ethmoids, pharyngeal branches of maxillary','Facial, lingual, ascending pharyngeal','Ophthalmic and supraorbital only'],a:0,e:'Kiesselbach\'s: sphenopalatine, anterior ethmoid, superior labial, greater palatine. Woodruff\'s plexus: posterior nasal, anterior and posterior ethmoids, pharyngeal branches of the maxillary (common site of posterior bleeds). Objective: memorize septal vascular supply.',s:'Slides 8, 10'},
 {q:'Woodruff\'s plexus is the common site of which epistaxis?',c:['Posterior','Anterior','Septal perforation bleeding','Turbinate bleeding in children'],a:0,e:'Woodruff\'s plexus (posterior nasal, ethmoids, pharyngeal branches of maxillary) = common site of posterior epistaxis.',s:'Slide 10'},
 {q:'Which arteries supplying the nose come from the INTERNAL carotid?',c:['Anterior and posterior ethmoid arteries','Sphenopalatine and descending palatine','Superior labial','Pharyngeal and posterior nasal'],a:0,e:'Internal carotid branches (via ophthalmic): anterior and posterior ethmoid. Maxillary (ECA) branches: sphenopalatine, pharyngeal, descending palatine, posterior nasal.',s:'Slides 6-7'},
 {q:'What anatomic landmark separates anterior from posterior epistaxis?',c:['Maxillary sinus ostium','Middle turbinate tip','Nasal valve','Inferior turbinate'],a:0,e:'"Maxillary sinus ostium separates one from the other."',s:'Slide 11'},
 {q:'Compare anterior and posterior epistaxis:',c:['Anterior: most common (&gt;90%), younger, less severe. Posterior: usually older, more serious','Posterior is most common in children','Both equally common','Anterior is usually more serious'],a:0,e:'Anterior &gt;90%, younger, often less severe; posterior usually older and more serious.',s:'Slide 11'},
 {q:'Most common cause of epistaxis overall (local etiology)?',c:['Trauma (fracture or digital)','Hypertension','Neoplasm','Coagulopathy'],a:0,e:'Local: trauma (fracture or digital) = most common; iatrogenic (O<sub>2</sub> prongs, nasal steroids), septal deviation, neoplasm, desiccation (winter), FB.',s:'Slide 12'},
 {q:'Most pediatric epistaxis is related to:',c:['Nose picking (digital trauma) at Kiesselbach\'s area','Hypertension','Juvenile angiofibroma','Hemophilia'],a:0,e:'Most pediatric epistaxis is related to picking the nose in Kiesselbach\'s area (also FBs).',s:'Slides 8, 17'},
 {q:'An infant has recurrent epistaxis. Per Dr. Strabbing, what should you suspect?',c:['Coagulopathy or nasal pathology (e.g., choanal atresia, neoplasm), since epistaxis is unusual in infants and nose picking starts later','Normal nose picking','Hypertension','Cocaine use'],a:0,e:'Epistaxis usually occurs in children aged 2-10; unusual in infants absent coagulopathy or nasal pathology. Local trauma doesn\'t occur until later toddler years. Consider cocaine in adolescents.',s:'Slide 17'},
 {q:'Classic cause of epistaxis by age: elderly patients?',c:['Hypertension','Nose picking','Foreign body','Cocaine'],a:0,e:'Children: digital trauma/FB; middle age: trauma, idiopathic, neoplasm; old age: hypertension.',s:'Slide 17'},
 {q:'An adolescent has recurrent epistaxis and a septal problem. What should you consider?',c:['Cocaine abuse','Choanal atresia','Hereditary hemorrhagic telangiectasia only','Hypertension'],a:0,e:'"Consider cocaine abuse in adolescent patients."',s:'Slide 17'},
 {q:'Osler-Weber-Rendu (hereditary hemorrhagic telangiectasia) causes epistaxis by:',c:['Arterial-venous fistulas on mucosal surfaces','Platelet dysfunction','Nasal polyps','Septal perforation'],a:0,e:'HHT causes AV fistulas on mucosal surfaces; epistaxis is the classic presentation.',s:'Slide 18'},
 {q:'Which is a NEOPLASTIC cause of epistaxis on the slide?',c:['Juvenile nasopharyngeal angiofibroma','Wegener\'s granulomatosis','Von Willebrand disease','Uremia'],a:0,e:'Neoplasms: adenocarcinoma, melanoma, lymphoma, JNA, inverted papilloma. Wegener\'s = inflammatory; vWD/uremia = coagulopathies.',s:'Slides 14-16'},
 {q:'Which coagulopathy cause of epistaxis is drug-induced platelet dysfunction?',c:['NSAIDs','Hemophilia A','Liver failure','Thrombocytopenia'],a:0,e:'Platelet dysfunction: systemic (uremia) vs drug-induced (NSAIDs). Others: thrombocytopenia, hemophilia A/B, vWD, liver failure, hematologic malignancy.',s:'Slide 16'},
 {q:'Initial management of a significant nosebleed includes:',c:['ABCs; history (HTN, Coumadin?); IV fluids if tachycardic/hypotensive; CBC, PT/INR, PTT; imaging for trauma','Immediate surgery','Embolization first','Discharge with ice'],a:0,e:'Initial: ABCs; history (HTN, anticoagulants like Coumadin); IV fluids if tachy/hypotensive; labs CBC, PT/INR, PTT; x-ray/CT for trauma. (Objective: anticoagulants and epistaxis.)',s:'Slide 19'},
 {q:'An anterior pack is in place, but you still see blood dripping in the posterior pharynx. What does this suggest?',c:['A posterior bleed','Successful anterior packing','Swallowed blood from earlier only; no concern','Septal perforation'],a:0,e:'Observe the posterior pharynx for constant dripping; bleeding in the pharynx with an anterior pack in place → strongly consider a posterior bleed.',s:'Slide 23'},
 {q:'Bruises or petechiae on the skin of an epistaxis patient suggest:',c:['An underlying hematologic abnormality','Nose picking','Hypertension','Viral rhinitis'],a:0,e:'Examine skin for bruises/petechiae that may indicate a hematologic abnormality.',s:'Slide 24'},
 {q:'Exsanguinating epistaxis after severe midface trauma is usually from:',c:['Laceration of the maxillary artery; anterior + posterior packs, may need external carotid ligation','Kiesselbach\'s plexus','Superior labial artery','Anterior ethmoid only'],a:0,e:'Exsanguinating epistaxis: trauma, severe midface trauma, maxillary artery laceration; anterior and posterior packs; may require ECA ligation under local.',s:'Slide 25'},
 {q:'Correct stepwise management of an anterior bleed after squeezing the nose shut for ≥10 minutes fails:',c:['Visualize site → topical vasoconstrictor (Afrin) → chemical cautery (silver nitrate) → electric cautery → packing','Posterior pack first','Surgery first','Embolization first'],a:0,e:'Conservative (pressure ≥10 min) → vasoconstrictor (visualize first; spray or Afrin-soaked cotton) → silver nitrate → electric cautery (or straight to packing). Also control HTN and correct coagulopathy.',s:'Slides 26-29'},
 {q:'Correct technique for silver nitrate cautery:',c:['Topical lidocaine first; apply to bleeding site in a circular direction for at least 30 seconds; neutralize with saline; may cover with absorbable gauze','Apply without anesthesia for 2 seconds','Apply to both sides of the septum simultaneously for 5 minutes','Use only after posterior packing'],a:0,e:'Silver nitrate: lidocaine first, circular application ≥30 s, neutralize with saline, may cover with Oxycel.',s:'Slide 28'},
 {q:'Traditional ANTERIOR nasal packing:',c:['Vaseline gauze, left 3-4 days, with antibiotic prophylaxis','Left 2 weeks without antibiotics','Requires IV sedation and telemetry','Balloon filled with air'],a:0,e:'Anterior packs: vaseline gauze, 3-4 days, antibiotic prophylaxis.',s:'Slide 30'},
 {q:'Why does a traditional POSTERIOR pack require a monitored bed with telemetry?',c:['Risk of arrhythmias','Risk of rebound hypertension','Risk of septal perforation','Because antibiotics are given IV'],a:0,e:'Posterior pack: when anterior fails or source posterior; IV sedation; antibiotics; monitored bed + telemetry (arrhythmia risk); remove in 3-5 days.',s:'Slide 31'},
 {q:'Nasal balloons for epistaxis should be filled with:',c:['Saline, not air (risk of pressure necrosis if over-inflated)','Air','Contrast','Nothing'],a:0,e:'Balloons (anterior or anterior/posterior): fill with saline, not air; over-inflation → pressure necrosis.',s:'Slide 33'},
 {q:'Which is an indication for SURGERY in epistaxis?',c:['Failed medical management after 72 hours','First episode controlled with pressure','Any anterior bleed','Patient preference'],a:0,e:'Surgical indications: persistent bleeding after proper packing, massive bleed needing multiple transfusions, anomaly precluding packing (septal spur), failed medical management after 72 h.',s:'Slide 35'},
 {q:'During anterior/posterior ethmoid artery ligation via a Lynch incision, which structure must be protected?',c:['Optic nerve (about 4-7 mm beyond the posterior ethmoid)','Facial nerve','Recurrent laryngeal nerve','Lingual nerve'],a:0,e:'Ethmoid ligation for posterior bleeds via a Lynch incision; beware the optic nerve 4-7 mm beyond the posterior ethmoid foramen.',s:'Slide 38'},
 {q:'Endoscopic sphenopalatine artery ligation uses an incision near which structure?',c:['Middle turbinate','Inferior turbinate','Lateral canthus','Upper lip'],a:0,e:'SPA ligation: transantral (Caldwell-Luc) vs endoscopic (transnasal) with incision near the middle turbinate.',s:'Slide 39'},
 {q:'Angiography/embolization is MOST effective in which epistaxis patients?',c:['Still bleeding after surgical ligation, site hard to reach surgically, or comorbidities prohibiting general anesthesia','All first-time anterior bleeds','Children with nose picking','Patients on nasal steroids'],a:0,e:'Embolization indications: bleeding after ligation, hard-to-reach site, comorbidities prohibiting GA.',s:'Slide 40'},
 {q:'Maxillary artery ligation is performed in which space?',c:['Pterygopalatine fossa (transmaxillary/Caldwell-Luc approach)','Infratemporal fossa via neck','Orbit','Nasal vestibule'],a:0,e:'Maxillary artery ligation: transmaxillary (Caldwell-Luc) approach; ligate the maxillary artery in the pterygopalatine fossa.',s:'Slide 37'},
]);
addN('4.12',[
 {h:'Nasal blood supply (memorize)',b:'<b>ECA → maxillary a.</b>: sphenopalatine, pharyngeal, descending palatine, posterior nasal.<br><b>ICA</b>: anterior + posterior ethmoid.<br><b>Kiesselbach\'s (Little\'s area)</b>: sphenopalatine + anterior ethmoid + superior labial + greater palatine → most common <b>anterior</b> site; kids pick here.<br><b>Woodruff\'s plexus</b>: posterior nasal + ant/post ethmoids + pharyngeal branches of maxillary → common <b>posterior</b> site.<br>Maxillary sinus ostium divides anterior vs posterior. Anterior &gt;90%, younger, less severe; posterior older, more serious.',s:'Slides 5-11'},
 {h:'Etiology',b:'<b>Local</b>: trauma (fracture/digital, most common), iatrogenic (O<sub>2</sub> prongs, nasal steroids), septal deviation, neoplasm, desiccation (winter), FB.<br><b>Systemic</b>: rhinitis/sinusitis, coagulopathy, vascular abnormality, HTN, drugs, alcohol.<br><b>Neoplasm</b>: adenocarcinoma, melanoma, lymphoma, JNA, inverted papilloma.<br><b>Inflammatory</b>: SLE, Wegener\'s, PAN, syphilis, TB.<br><b>Coagulopathy</b>: platelet dysfunction (uremia, NSAIDs), thrombocytopenia, hemophilia A/B, vWD, liver failure, heme malignancy.<br><b>Age</b>: kids 2-10 (digital/FB; chronic → consider coagulopathy; infants unusual unless coagulopathy/choanal atresia/neoplasm; adolescents → cocaine); middle age trauma/idiopathic/neoplasm; old age HTN.<br><b>HHT (Osler-Weber-Rendu)</b>: mucosal AV fistulas, epistaxis.',s:'Slides 12-18'},
 {h:'Management ladder',b:'ABCs; history (HTN, Coumadin/anticoagulants); IV fluids if unstable; CBC, PT/INR, PTT; CT for trauma. Exam with speculum; suction clot; look at posterior pharynx (dripping with anterior pack in → posterior bleed); skin petechiae → heme problem.<br>Control HTN, correct coagulopathy → pressure ≥10 min → Afrin (visualize first) → <b>silver nitrate</b> (lidocaine, circular ≥30 s, saline neutralize) → electric cautery → <b>packing</b>: anterior vaseline gauze 3-4 d + antibiotics; posterior (anterior failed/posterior source) IV sedation, antibiotics, telemetry (arrhythmia), remove 3-5 d; expandable packs along floor; balloons with <b>saline not air</b>.<br>Exsanguinating (midface trauma, maxillary a.) → anterior + posterior packs, ± ECA ligation.',s:'Slides 19-34'},
 {h:'Surgery + embolization',b:'Indications: persistent bleeding despite packing; massive bleed with multiple transfusions; anomaly preventing packing (spur); failed medical Tx after 72 h.<br>Septoplasty; maxillary artery ligation (Caldwell-Luc, pterygopalatine fossa); anterior/posterior ethmoid ligation (Lynch incision, optic nerve 4-7 mm beyond posterior ethmoid); sphenopalatine ligation (endoscopic near middle turbinate).<br>Embolization: bleeding after ligation, hard-to-reach site, can\'t tolerate GA.',s:'Slides 35-40'},
]);

addQ('4.09',[
 {q:'In acute suppurative otitis media, the EARLY tympanic membrane appearance is:',c:['Still transparent, bulging','Weeping with rupture','Retracted with air-fluid level','Thickened white plaque'],a:0,e:'Early: TM still transparent, bulging. Middle: suppurative (purulent fluid behind TM). Late: weeping and possible rupture.',s:'Slide 4'},
 {q:'Otitis media with effusion (OME) is:',c:['Sterile fluid remaining after the acute phase passes; clears in about 90 days or may become re-infected','Purulent fluid with fever','Fluid in the external canal','Cholesteatoma'],a:0,e:'OME: after the acute phase, sterile fluid remains that either clears in ~90 days or may become re-infected.',s:'Slide 4'},
 {q:'An adult has a new unilateral middle ear effusion. Per Dr. Strabbing, what is the concern and next step?',c:['Concern for malignancy: thorough head and neck exam including larynx and nasopharynx','Reassurance; adults commonly get OME','Immediate tympanostomy tubes','Oral antibiotics only'],a:0,e:'"Adults with effusion: concern for malignancy. Thorough exam of head and neck to include the larynx and nasopharynx."',s:'Slide 5'},
 {q:'Which is classified under CHRONIC otitis media on the slide?',c:['Cholesteatoma','AOM with tympanostomy tubes','AOM without perforation','AOM with perforation'],a:0,e:'Chronic OM: chronic middle ear effusion, chronic nonsuppurative OM, cholesteatoma, dry perforation, chronic suppurative OM (with/without cholesteatoma). AOM categories: without perforation, with perforation, with tubes (AOMT).',s:'Slides 6-7'},
 {q:'Mainstay of therapy for AOM in an ear with an INTACT tympanic membrane:',c:['Systemic antibiotics','Ototopical antibiotics alone','Tympanostomy tubes','Observation only'],a:0,e:'"Systemic antibiotics are the mainstay of therapy for AOM in ears with intact tympanic membranes." (Contrast: AOM with tubes → ototopicals alone in uncomplicated cases.)',s:'Slide 8'},
 {q:'Primary indications for tympanostomy tube insertion are:',c:['Recurrent acute otitis media and otitis media with persistent effusion','Otosclerosis','Otitis externa','Ménière disease'],a:0,e:'Primary indications: recurrent AOM and OM with persistent effusion. Myringotomy with tubes is the most common surgery children in North America/Europe undergo.',s:'Slide 9'},
 {q:'Why treat persistent middle ear disease in children? The main risk of leaving it untreated is:',c:['Hearing loss affecting speech development, language acquisition and learning','Facial disfigurement','Epistaxis','Vertigo only'],a:0,e:'Risk of untreated middle ear disorders: hearing loss → concerns for speech, language and learning.',s:'Slide 10'},
 {q:'Per AAOHNS referral guidelines, which hearing finding is an indication for tympanostomy tubes?',c:['Hearing loss &gt;30 dB threshold with a persistent effusion &gt;3 months','Any hearing loss for 1 week','Hearing loss with dry ear','10 dB loss without effusion'],a:0,e:'Indication: hearing loss &gt;30 dB concurrent with persistent effusion &gt;3 months (child meets ≥1 criterion).',s:'Slide 11'},
 {q:'Recurrent AOM qualifying for tympanostomy tubes on Dr. Strabbing\'s slide:',c:['&gt;3 episodes in 6 months or &gt;4 episodes in 12 months','1 episode in 12 months','2 episodes ever','Any episode with fever'],a:0,e:'Recurrent otalgia or AOM: &gt;3 episodes/6 months or &gt;4 episodes/12 months. Also: OME &gt;3 months; 6+ months of effusion in the previous 12 months.',f:'Dr. Sims (4.10 slide 16) defines chronic/recurrent AOM as "4 or more infections in 12 months OR 3 infections in 6 months," slightly different wording from Dr. Strabbing\'s "&gt;3/6 months or &gt;4/12 months."',s:'Slide 12'},
 {q:'Which complication of otitis media is an indication for tympanostomy tubes?',c:['Facial nerve paralysis (also mastoiditis, lateral sinus thrombosis, meningitis, brain abscess, labyrinthitis)','Otitis externa','Cerumen impaction','Tinnitus alone'],a:0,e:'Impending or actual complication of OM: mastoiditis, facial nerve paralysis, lateral sinus thrombosis, meningitis, brain abscess, labyrinthitis.',s:'Slide 11'},
 {q:'A child with OME &gt;3 months is getting a SECOND set of tympanostomy tubes. What additional procedure should be considered?',c:['Adenoidectomy (also if over age 4)','Tonsillectomy','Mastoidectomy','Stapedotomy'],a:0,e:'"OME &gt;3 months (consider adenoidectomy if over age 4 or second set of tympanostomy tubes)."',s:'Slide 12'},

addN('4.09',[
 {h:'Otitis media basics',b:'OM = any inflammatory middle ear condition. <b>Acute suppurative OM</b>: early TM transparent + bulging → middle suppurative (pus behind TM) → late weeping/possible rupture. <b>OME</b>: sterile fluid after acute phase; clears ~90 days or re-infects. <b>Adult effusion → malignancy concern</b>: examine head/neck incl. larynx + nasopharynx.<br>AOM: without perforation, with perforation, with tubes (AOMT). Chronic OM: chronic effusion, chronic nonsuppurative, cholesteatoma, dry perforation, chronic suppurative (± cholesteatoma).<br>AOM with intact TM → <b>systemic antibiotics</b>.',s:'Slides 4-8'},
 {h:'Tympanostomy tubes',b:'Most common childhood surgery (N. America/Europe). Primary indications: recurrent AOM + OM with persistent effusion (untreated → hearing loss → speech/language/learning). <b>AAOHNS (≥1)</b>: severe AOM; HL &gt;30 dB + effusion &gt;3 mo; antibiotic failure/breakthrough on prophylaxis; multiple drug allergies; impending/actual complication (mastoiditis, facial palsy, lateral sinus thrombosis, meningitis, brain abscess, labyrinthitis); OME &gt;3 mo (adenoidectomy if &gt;4 y or second set); 6+ mo effusion in prior 12 mo; recurrent AOM (&gt;3/6 mo or &gt;4/12 mo); persistent discharge; TM/pars flaccida retraction, negative pressure, perforation &gt;3 mo; AOM with imminent air travel/barotrauma; craniofacial anomalies (cleft palate, Down).',s:'Slides 9-13'},
 {h:'AOM with tubes + perforations + otosclerosis',b:'AOMT risks: URI, water?. Granulation: FB reaction or infection (Staph, Pseudomonas). Bugs: S. pneumoniae, H. flu, M. catarrhalis, P. aeruginosa, S. aureus, Strep. Tx: <b>ototopical fluoroquinolone alone</b>; add systemic if drops fail 7-10 d, strep throat, spread beyond ear, nonadherence, immunocompromised.<br><b>TM perforation</b>: infection most common; slaps, water-ski falls, bad irrigation; failed tube-site closure. 80-90% heal; water precautions; maybe tympanoplasty.<br><b>Otosclerosis</b>: mostly conductive (ossicular transfer fails); unilateral → bilateral. Tx: hearing aid or laser stapedotomy + piston.',s:'Slides 15-22'},
]);

 {q:'AOM is described by Dr. Sims as:',c:['The most common bacterial infection in children','Rare before age 2','Mostly fungal','A disease of adolescents'],a:0,e:'AOM is the most common bacterial infection in children; by the 2nd birthday most children (90%) have had OM.',s:'Slide 7'},
 {q:'Which is a risk factor for AOM?',c:['Pacifier use','Exclusive breastfeeding','Pneumococcal vaccination','Older age'],a:0,e:'Risk factors: bottle use (suboptimal breastfeeding), congenital facial/nasal anomalies, pacifier use, secondhand smoke, daycare, lack of pneumococcal vaccination, prematurity, young age.',s:'Slide 7'},

 {q:'A 14-month-old has fever 102.5°F, ear pain and a bulging TM. Management?',c:['Antibiotics (6-24 months: treat; rarely watch-and-wait only if nontoxic with mild unilateral findings)','Watchful waiting for all under 2','Tympanostomy tubes now','Ear drops only'],a:0,e:'Age 6-24 months → treat with antibiotics; rarely watch and wait only if nontoxic and only mild unilateral findings. Moderate-severe symptoms (fever &gt;102, otalgia, otorrhea) warrant treatment.',s:'Slide 13'},

 {q:'First-line treatment of AOM:',c:['High-dose amoxicillin 80-90 mg/kg/day, divided BID for 10 days','Azithromycin for 3 days','Amoxicillin 20 mg/kg/day','Ciprofloxacin drops'],a:0,e:'First line: amoxicillin 80-90 mg/kg/day. All oral treatments dosed BID for a 10-day course.',s:'Slide 14'},

 {h:'Diagnosis',b:'Ear pain + fever ± cold symptoms; otorrhea → perforation. Infants: fever, irritability, poor sleep/feeding. <b>Pneumatic otoscopy</b>; only visual exam diagnoses AOM. Pitfalls: very acute onset, cerumen, <b>red TM from crying is NOT diagnostic</b>; clear fluid ≠ infection.',s:'Slides 8-9, 22'},

]);
addQ('4.11',[
 {q:'Components of the bony labyrinth per Dr. Strabbing:',c:['Vestibule, semicircular canals, cochlea','Malleus, incus, stapes','Utricle, saccule, cochlear duct only','Tympanic membrane, oval window, round window'],a:0,e:'Bony labyrinth components: vestibule, semicircular canals, cochlea. The membranous labyrinth is enclosed within the bony labyrinth.',s:'Slides 3, 5'},
 {q:'The endolymphatic duct connects:',c:['The endolymphatic compartment to the endolymphatic sac','The scala tympani to the posterior cranial fossa','The middle ear to the nasopharynx','Scala vestibuli to scala tympani'],a:0,e:'Endolymphatic duct: endolymphatic compartment → endolymphatic sac. Periotic duct (in the cochlear aqueduct): scala tympani → posterior cranial fossa.',s:'Slide 5'},
 {q:'The periotic duct runs within which structure and connects what?',c:['Cochlear aqueduct; connects scala tympani to the posterior cranial fossa','Vestibular aqueduct; connects utricle to saccule','Eustachian tube; middle ear to pharynx','Internal auditory canal; cochlea to brainstem'],a:0,e:'Periotic duct: within the cochlear aqueduct, connects scala tympani to the posterior cranial fossa.',s:'Slide 5'},
 {q:'Which three semicircular canals open into the vestibule?',c:['Horizontal (lateral), superior (anterior), posterior','Upper, middle, lower','Utricular, saccular, cochlear','Medial, lateral, inferior'],a:0,e:'Horizontal, superior and posterior canals open into the vestibule.',s:'Slide 6'},
 {q:'The cochlea resembles a snail shell with how many turns?',c:['Two and one-half','One','Four','Six'],a:0,e:'"Snail shell with two and one-half turns."',s:'Slide 7'},
 {q:'The modiolus is:',c:['The central conical core of the cochlea','The opening between the scalae at the apex','The membrane separating scala media from scala vestibuli','The footplate of the stapes'],a:0,e:'Modiolus = central conical core of the cochlea. Helicotrema = apical connection between scala vestibuli and scala tympani.',s:'Slides 8, 10'},
 {q:'On Dr. Strabbing\'s cochlea diagrams, the helicotrema is where:',c:['Scala vestibuli and scala tympani communicate at the cochlear apex','Endolymph drains to the sac','The stapes attaches','The cochlear nerve exits'],a:0,e:'The helicotrema (labeled with scala vestibuli, scala tympani, osseous spiral lamina) is the apical connection between the two perilymphatic scalae.',s:'Slide 10'},
 {q:'Which cochlear compartments contain PERILYMPH (per the Endolymph and Perilymph diagram)?',c:['Scala vestibuli and scala tympani','Cochlear duct (scala media) only','Endolymphatic sac only','Utricle and saccule'],a:0,e:'Perilymph: scala vestibuli and scala tympani. Endolymph: cochlear duct (scala media), bounded by the vestibular (Reissner\'s) membrane above and basilar membrane below.',s:'Slides 13-14'},
 {q:'Which membrane separates the scala vestibuli from the cochlear duct?',c:['Vestibular (Reissner\'s) membrane','Basilar membrane','Tectorial membrane','Round window membrane'],a:0,e:'Vestibular (Reissner\'s) membrane separates scala vestibuli from the endolymph-filled cochlear duct; the basilar membrane (with organ of Corti) separates the duct from scala tympani.',s:'Slides 13-14'},
 {q:'Sound enters the inner ear at the oval window. What happens at the round window?',c:['Equal and opposite movement (it bulges out as the stapes pushes in)','It stays fixed','It transmits sound back to the TM','It opens to the eustachian tube'],a:0,e:'Sound waves enter via the oval window (stapes footplate) and travel rapidly through cochlear fluid; oval window movement is met with equal and opposite action of the round window.',s:'Slide 22'},
 {q:'Classic Ménière disease symptoms:',c:['Fluctuating hearing, tinnitus, aural fullness, vertigo','Brief positional vertigo &lt;1 minute only','Conductive hearing loss with otorrhea','Facial palsy with vesicles'],a:0,e:'Ménière\'s: fluctuating hearing, tinnitus, aural fullness, vertigo (a cochlear fluid disorder). Brief positional vertigo = BPPV.',s:'Slide 15'},
 {q:'Which are triggers of Ménière disease (the "NO CATS" approach)?',c:['Caffeine, Alcohol/Aspirin products, Tobacco, Sodium','Cold, Antibiotics, Trauma, Sugar','Cheese, Allergens, Tyramine, Stress','Calcium, Antacids, Tea, Spices'],a:0,e:'NO CATS: Caffeine, Alcohol and Aspirin products, Tobacco, Sodium.',s:'Slide 17'},
 {q:'Causes of a perilymphatic fistula listed by Dr. Strabbing:',c:['Mechanical trauma, bone erosion from cholesteatoma, congenital defects','Viral infection only','Caffeine','Otosclerosis only'],a:0,e:'Perilymphatic fistula: mechanical trauma, bone erosion from cholesteatoma, congenital defects.',s:'Slide 15'},
 {q:'Stereocilia of hair cells contain:',c:['Actin filaments within a tubular membrane','Microtubules in a 9+2 arrangement','Keratin','Collagen'],a:0,e:'Stereocilia: actin filaments within a tubular membrane. Each hair cell has stereocilia + a kinocilium and is innervated at its base.',s:'Slides 19-20'},
 {q:'Deflecting the hair bundle in the depolarizing direction causes:',c:['Increased membrane conductance (more permeable to positive ions)','Decreased conductance','Hyperpolarization always','No change'],a:0,e:'Movement in the depolarizing direction → ↑membrane conductance to positively charged ions. Shearing of stereocilia can depolarize or hyperpolarize depending on direction.',s:'Slides 21, 27'},
 {q:'The deformation of the basilar membrane in response to sound is:',c:['A traveling wave; different regions respond maximally to different frequencies (tonotopic) because of local physical properties such as width','A standing wave identical along its length','Absent in humans','Only at the oval window'],a:0,e:'Basilar membrane is resonant; deformation is a traveling wave; tonotopic: different regions respond best to different frequencies based on local properties (variation in width).',s:'Slides 23-26'},
 {q:'Typical complaint in BPPV:',c:['Spells of vertigo when turning over in bed or looking up ("top shelf vertigo"), lasting &lt;1 minute','Hours-long vertigo with hearing loss and tinnitus','Constant imbalance for weeks','Vertigo with facial palsy'],a:0,e:'BPPV: vertigo with turning in bed, "top shelf vertigo"; lasts &lt;1 minute; brought on only by positional changes.',s:'Slide 30'},
 {q:'Which nystagmus features fit BPPV on Dix-Hallpike testing?',c:['Geotropic, torsional with upbeat component; latency of a few seconds up to 45 sec; fatigues with repeated testing','Immediate, non-fatiguing vertical downbeat','Horizontal only, lasting hours','No nystagmus'],a:0,e:'BPPV: geotropic torsional nystagmus with upbeat component, latency few sec to 45 sec, &lt;1 min, fatigues with repetition.',s:'Slide 30'},
 {q:'In BPPV, which semicircular canal is almost always involved, and why?',c:['Posterior canal, because it is the most dependent','Horizontal canal, because it is largest','Superior canal, because it is shortest','Cochlea'],a:0,e:'Otoliths dislodge from the utricle into the canals; the posterior canal is almost always involved because it is the most dependent of the three.',s:'Slide 30'},
 {q:'Why does a BPPV patient feel the room spinning after the head stops moving?',c:['Displaced otoliths keep moving and drag endolymph, so canal receptors keep signaling rotation while the eyes report the head has stopped','Endolymph pressure rises as in Ménière','The cochlear nerve is inflamed','The round window ruptured'],a:0,e:'Otoliths continue to move after the head stops, dragging endolymph; angular acceleration receptors keep firing; conflicting visual input → room seems to spin the opposite direction.',s:'Slide 30'},
 {q:'How is the Dix-Hallpike test performed?',c:['Sitting upright, legs extended, head rotated ~45° to one side, then quickly brought supine with the head ~20° extended (head-hanging)','Patient spins in a chair','Patient lies prone with head flexed','Caloric irrigation of each ear'],a:0,e:'Dix-Hallpike: upright, legs extended, head rotated ~45° to one side, then lie back quickly with head held ~20° extension (head-hanging R and L).',s:'Slides 30-31'},
 {q:'The Epley maneuver is used to:',c:['Treat BPPV by repositioning otoliths through a sequence of head positions','Diagnose Ménière disease','Treat otosclerosis','Measure hearing'],a:0,e:'Epley: start with head rotated 45° to the affected side, recline to Dix-Hallpike position (affected ear down), turn head 90° to the other side, roll onto shoulder to look down 45°, then sit up; hold each 1-2 minutes, watching for primary and secondary nystagmus in the same direction.',s:'Slide 32'},
 {q:'During the Epley maneuver, the "secondary stage" nystagmus (after rolling onto the shoulder) should beat:',c:['In the same direction as the primary stage nystagmus','In the opposite direction','Vertically downward only','It should not occur'],a:0,e:'"This secondary stage nystagmus should beat in the same direction as the primary stage nystagmus."',s:'Slide 32'},
 {q:'Initial head position for the Epley maneuver:',c:['Sitting upright, legs extended, head rotated 45° TOWARD the affected side','Head rotated away from the affected side','Lying prone','Head flexed to the chest'],a:0,e:'Begin upright, legs fully extended, head rotated 45° towards the affected side; then quickly supine with ~30° neck extension, affected ear facing the ground.',s:'Slide 32'},
]);
addN('4.11',[
 {h:'Inner ear anatomy',b:'<b>Bony labyrinth</b>: vestibule, semicircular canals (horizontal, superior, posterior → open into vestibule), cochlea (2½ turns; <b>modiolus</b> = central conical core; osseous spiral lamina). Cochlear + vestibular aqueducts.<br><b>Membranous labyrinth</b> inside bony labyrinth. <b>Endolymphatic duct</b>: endolymphatic compartment → endolymphatic sac. <b>Periotic duct</b> (in cochlear aqueduct): scala tympani → posterior cranial fossa.<br><b>Scalae</b>: scala vestibuli + scala tympani contain <b>perilymph</b>, communicate at the <b>helicotrema</b> (apex). Cochlear duct (scala media) = <b>endolymph</b>, between vestibular (Reissner\'s) membrane and basilar membrane (organ of Corti). Oval window (stapes) → scala vestibuli; round window → scala tympani.',s:'Slides 3-14'},
 {h:'Hearing physiology',b:'Hair cells held by supporting cells, innervated at base; stereocilia (actin in tubular membrane) + kinocilium. Bundle deflection toward depolarizing direction → ↑conductance to cations; shearing → de/hyperpolarization. Stapes moves oval window; round window moves equal and opposite. Basilar membrane = resonant; traveling wave; tonotopic by local properties (width varies). Organ of Corti has afferent and efferent innervation (diagram: afferents to inner hair cells; medial efferents to outer hair cells).',s:'Slides 18-28'},
 {h:'Ménière + perilymphatic fistula',b:'<b>Ménière</b>: fluctuating hearing, tinnitus, aural fullness, vertigo. Triggers <b>NO CATS</b>: Caffeine, Alcohol/Aspirin, Tobacco, Sodium.<br><b>Perilymphatic fistula</b>: mechanical trauma, cholesteatoma bone erosion, congenital defects.',s:'Slides 15-17'},
 {h:'BPPV, Dix-Hallpike, Epley',b:'Vertigo turning in bed / "top shelf"; &lt;1 min; positional only; latency seconds-45 s; fatigues. Nystagmus: geotropic, torsional, upbeat component. Otoliths dislodge from utricle into canals; <b>posterior canal</b> (most dependent). Otoliths keep moving after head stops → canal keeps firing vs eyes → room spins.<br><b>Dix-Hallpike</b>: sit, legs extended, head 45° to one side, lie back quickly, head ~20° extended (test R and L).<br><b>Epley</b>: head 45° toward affected side → supine ~30° extension, affected ear down (watch primary nystagmus, 1-2 min) → turn 90° to other side (1-2 min) → roll onto shoulder, head another 90°, looking down 45° (secondary nystagmus same direction, 1-2 min) → sit up slowly keeping rotation; hold ≤30 s.',s:'Slides 30-32'},
]);

 {q:'A 58-year-old smoker has a new asymmetric lateral neck mass. Per Dr. Strabbing, how should it be regarded?',c:['Malignant until proven otherwise','Reactive node; recheck in a year','Branchial cleft cyst','Thyroglossal duct cyst'],a:0,e:'"Any asymmetric neck mass in the adult must be considered malignant until proven otherwise."',s:'Slide 20'},
 {q:'Which history items are emphasized in evaluating a neck mass?',c:['Onset, associated symptoms (swallow, voice, ear pain), tobacco/alcohol, prior irradiation or surgery','Diet only','Family history of diabetes','Vaccination history only'],a:0,e:'History: when it developed; associated symptoms (swallowing, voice, ear pain); tobacco, alcohol; previous irradiation/surgery. Exam: complete; describe location, consistency, mobility; flexible fiberoptic nasopharyngolaryngoscopy.',s:'Slide 14'},
 {q:'Role of fine needle aspiration (FNA) in a neck mass:',c:['Standard for any neck mass that is not an obvious abscess; small-gauge needle; tumor seeding is not a real concern','Contraindicated because of seeding','Only after excisional biopsy','Only for midline masses'],a:0,e:'FNA has become standard for any neck mass that is not an obvious abscess; small gauge; theoretical seeding is not a concern (objective: role of FNA).',s:'Slide 16'},
 {q:'On contrast CT, which features suggest a pathologic lymph node?',c:['Lucent, &gt;1.5 cm, loss of shape','Bright homogeneous enhancement &lt;1 cm','Fatty hilum','Calcified and oval'],a:0,e:'Pathologic node on CT: lucent, &gt;1.5 cm, loss of shape. Contrast shows vascularity and relation to vessels; useful for unknown primary and extent.',s:'Slide 17'},
 {q:'For which neck lesions should IV contrast be avoided on CT?',c:['Thyroid lesions','Branchial cleft cysts','Lymphoma','Abscesses'],a:0,e:'"Avoid contrast with thyroid lesions."',s:'Slide 17'},
 {q:'MRI is better than CT for evaluating which area?',c:['Upper neck and skull base','Lower neck','Chest','Thyroid'],a:0,e:'MRI gives similar info to CT; better for upper neck and skull base.',s:'Slide 18'},
 {q:'Ultrasonography of a neck mass is especially useful to:',c:['Determine cystic vs solid and guide FNA (improves accuracy)','Stage lung cancer','Replace FNA','Image the skull base'],a:0,e:'US: cystic vs solid, US-guided FNA improves accuracy.',s:'Slide 19'},
 {q:'An adult has ipsilateral ear pain with a NORMAL otoscopic exam. Where should attention be directed?',c:['Tonsil, tongue base, supraglottis, hypopharynx (referred otalgia)','External auditory canal','Mastoid only','Parotid only'],a:0,e:'Ipsilateral ear pain with normal otoscopy → look at tonsil, tongue base, supraglottis, hypopharynx.',s:'Slide 21'},
 {q:'An adult has UNILATERAL serous otitis media. What must be done?',c:['Fiberoptic scope exam of the nasopharynx','Tympanostomy tube only','Antibiotics only','Observe for 3 months'],a:0,e:'"Unilateral serous otitis media: must use fiberoptic scope to examine nasopharynx" (nasopharyngeal mass can block the eustachian tube).',s:'Slide 21'},
 {q:'Per the adult neck-mass algorithm on slide 4, a suspected INFLAMMATORY/infectious mass is first managed with:',c:['A single course of broad-spectrum antibiotic with close follow-up in 2-4 weeks','Immediate excisional biopsy','Radiation','Observation for 1 year'],a:0,e:'Algorithm: inflammatory → single broad-spectrum antibiotic course + follow-up 2-4 wk; improvement → observe/reassess 2-4 wk; no improvement → CXR + PPD → positive PPD: treat/subspecialist; negative or neoplasm suspicion → contrast CT + FNA → subspecialist. Suspected neoplasm (risk factors incl. age &gt;45) → contrast CT + FNA → endoscopy. Congenital → CT → excisional biopsy.',s:'Slide 4 (AFP algorithm)'},
]);
addN('4.13',[
 {h:'Differential + congenital masses',b:'Congenital · inflammatory · neoplastic.<br><b>Branchial cleft cyst</b>: most common pediatric congenital neck mass; <b>2nd cleft</b> most common.<br><b>Thyroglossal duct cyst</b>: 2nd most common; <b>midline, elevates with swallowing</b>, swells after URI. Tx: <b>Sistrunk</b> (cyst + middle hyoid; tract passes through hyoid, else recurrence).',s:'Slides 3, 6-8'},
 {h:'Inflammatory + neoplastic',b:'<b>Inflammatory</b>: cervical LAD (bacterial, viral, granulomatous: scrofula, cat scratch, sarcoid, fungal), sialadenitis (parotid, submandibular), congenital cysts.<br><b>Neoplastic</b>: metastatic unknown-primary SCC; primary H&amp;N SCC/melanoma; adenocarcinoma; thyroid; lymphoma; salivary; angioma; lipoma; carotid body tumor; rhabdomyosarcoma.<br><b>Adult asymmetric neck mass = malignant until proven otherwise.</b> Ipsilateral otalgia + normal otoscopy → tonsil, tongue base, supraglottis, hypopharynx. Unilateral serous OM → scope nasopharynx.',s:'Slides 5, 9, 20-21'},
 {h:'Workup',b:'History: onset; swallow/voice/ear pain; tobacco/alcohol; prior radiation/surgery. Exam: location, consistency, mobility; flexible fiberoptic nasopharyngolaryngoscopy.<br><b>FNA</b>: standard for any non-abscess mass; small gauge; seeding not a concern.<br><b>CT with contrast</b>: vascularity, vessels, unknown primary, extent; pathologic node = lucent, &gt;1.5 cm, lost shape; <b>no contrast for thyroid lesions</b>.<br><b>MRI</b>: upper neck/skull base. <b>US</b>: cystic vs solid; guides FNA.<br><b>Algorithm (slide 4)</b>: congenital → CT → excision; inflammatory → antibiotics, recheck 2-4 wk → no improvement → CXR + PPD → CT + FNA; neoplasm (age &gt;45, risks) → contrast CT + FNA → endoscopy → manage by histology/stage.',s:'Slides 4, 14-19'},
]);
addQ('4.14',[
 {q:'Bilateral preauricular sinuses with branchial cleft anomalies and renal problems suggest:',c:['Branchio-oto-renal syndrome','Treacher Collins syndrome','Pierre Robin sequence','Apert syndrome'],a:0,e:'Branchio-oto-renal syndrome: bilateral preauricular sinuses, ear abnormalities, branchial cleft anomalies in the neck, renal problems.',s:'Slide 5'},
 {q:'Microtia is strongly associated with:',c:['Inner ear malformations (can have hearing loss)','Renal agenesis','Choanal atresia','Cleft palate only'],a:0,e:'Microtia: strong association with inner ear malformations; hearing loss possible; abnormal branchial arch development, hereditary, intrauterine/teratogen exposures.',s:'Slide 6'},
 {q:'An untreated auricular hematoma (blood between skin and cartilage) can lead to:',c:['Permanent deformity of the pinna','Hearing loss only','Mastoiditis','Facial palsy'],a:0,e:'Hematoma between skin and pinna cartilage can lead to permanent deformity if untreated.',s:'Slide 6'},
 {q:'A child after head trauma has post-auricular bruising and hemotympanum. Diagnosis?',c:['Basilar skull fracture involving the temporal bone (Battle sign)','AOM','Cholesteatoma','Mastoiditis'],a:0,e:'Basilar skull fracture (temporal bone): post-auricular bruising (Battle sign), hemotympanum.',s:'Slide 7'},
 {q:'Pediatric otitis externa (swimmer): treatment and prevention per Dr. Sims?',c:['Fluoroquinolone drops (ofloxacin/ciprofloxacin); dry ears after exposure with a few drops of rubbing alcohol','Oral amoxicillin','Steroid drops alone','Ear irrigation daily'],a:0,e:'Exam: white malodorous discharge, erythematous canal, pain with pinna manipulation; pathogens Pseudomonas, S. aureus; Tx fluoroquinolone drops; prevent by drying with rubbing alcohol drops.',s:'Slide 8'},
 {q:'A child with AOM develops swelling behind the ear that pushes the ear "down and out." Diagnosis and management?',c:['Mastoiditis: admit for IV antibiotics','Otitis externa: drops','Preauricular sinus infection: oral antibiotics','Cholesteatoma: outpatient follow-up'],a:0,e:'Mastoiditis: complication of AOM spreading into mastoid air cells; "down and out" ear; TM changes of AOM; admit + IV antibiotics.',s:'Slide 11'},
 {q:'A child has chronic progressive hearing loss and a white mass behind the TM. Diagnosis?',c:['Cholesteatoma (trapped epithelial tissue; must be removed)','Tympanosclerosis only','OME','Hemotympanum'],a:0,e:'Cholesteatoma: most common and most severe mass lesion of the TM; trapped epithelium behind TM; congenital or from chronic OM; chronic progressive hearing loss; white mass or drainage/perforation; must be removed.',s:'Slide 13'},
 {q:'Treacher Collins syndrome features:',c:['Maxillary hypoplasia, micrognathia and auricular deformity','Craniosynostosis','Bilateral preauricular sinuses with renal anomalies','Macroglossia'],a:0,e:'Treacher Collins: maxillary hypoplasia, micrognathia, auricular deformity. Apert/Crouzon: craniosynostosis → facial, ear, sinus abnormalities. All predispose to ear infections.',s:'Slide 15'},
 {q:'Which sinuses are partially pneumatized at birth?',c:['Maxillary and ethmoid','Frontal and sphenoid','Only frontal','None'],a:0,e:'Maxillary and ethmoid partially pneumatized at birth; sphenoid around 5 y; frontal at 7-8 y.',s:'Slide 17'},
 {q:'Most common cause of URI in children:',c:['Rhinovirus','RSV','Adenovirus','Group A strep'],a:0,e:'URI: most common rhinovirus; also RSV, coronavirus, adenovirus, metapneumovirus, influenza, parainfluenza. Young children may have 7-8 colds/year.',s:'Slide 19'},
 {q:'A parent says their child\'s nasal mucus turned green. Per Dr. Sims, this:',c:['Is NOT indicative of bacterial vs viral infection','Means bacterial sinusitis needing antibiotics','Means allergic rhinitis','Means a foreign body'],a:0,e:'"Change in nasal secretion color or consistency is NOT indicative of bacterial vs viral infection." URI is supportive care; no role for OTC decongestants, antihistamines, cough suppressants; prevent with hand washing.',s:'Slide 19'},
 {q:'Which is true of pediatric URI management?',c:['Supportive care; no role for OTC decongestants, antihistamines or cough suppressants','Antibiotics after 2 days','Decongestants for all infants','Codeine for cough'],a:0,e:'URI lasts ~5-7 days, self-limited; supportive care; no OTC decongestants/antihistamines/cough suppressants; hand washing. Infants 1-3 months are obligate nose breathers.',s:'Slide 19'},
 {q:'URI symptoms persisting beyond how long raise concern for sinusitis that should be treated?',c:['&gt;7-10 days','&gt;2 days','&gt;24 hours','&gt;6 weeks'],a:0,e:'Persistent URI symptoms &gt;7-10 days → concerning for sinusitis → treat. Complications: Pott\'s puffy tumor, epidural abscess, periorbital abscess, orbital abscess.',s:'Slide 20'},
 {q:'Pott\'s puffy tumor is:',c:['Anterior erosion of the frontal sinus from sinusitis: doughy, very painful forehead swelling','A benign lipoma','A nasal dermoid','An encephalocele'],a:0,e:'Pott\'s puffy tumor: complication of sinusitis, anterior frontal sinus erosion, doughy texture, very painful.',s:'Slide 21'},
 {q:'A newborn is cyanotic at rest, pinks up when crying, and a nasal catheter cannot be passed. Diagnosis and immediate relief?',c:['Bilateral choanal atresia; oral airway (or cut-tip nipple) in the mouth','Laryngomalacia; prone positioning','Croup; dexamethasone','Pierre Robin; tracheostomy immediately'],a:0,e:'Bilateral choanal atresia: severe distress after birth, paradoxical cyanosis (relieved by crying, returns at rest), tachypnea, retractions; can\'t pass nasal catheter; confirm with CT; oral airway gives immediate relief. Mostly bony (90%).',s:'Slide 22'},
 {q:'A child has constant UNILATERAL nasal drainage since infancy. Which congenital lesion should be suspected?',c:['Unilateral choanal atresia','Bilateral choanal atresia','Laryngomalacia','Subglottic stenosis'],a:0,e:'"Unilateral: suspect with consistent but UNILATERAL nasal drainage." (Also think foreign body.)',s:'Slide 22'},
 {q:'Nasal polyps in a child should prompt evaluation for:',c:['Cystic fibrosis','Allergic rhinitis only','Diabetes','Immunodeficiency only'],a:0,e:'Nasal polyps (drainage, obstruction, snoring): concern for cystic fibrosis; "Nasal polyps should prompt CF work up."',s:'Slides 24, 44'},
 {q:'What happens if a pediatric nasal septal hematoma is not treated?',c:['Saddle nose deformity','Choanal atresia','Pott\'s puffy tumor','Microtia'],a:0,e:'Nasal trauma: displaced fractures, septal hematomas → saddle nose deformity if untreated.',s:'Slide 25'},
 {q:'A firm midline nasal mass with a central dimple in an infant is most consistent with:',c:['Nasal dermoid','Encephalocele','Nasal polyp','Hemangioma'],a:0,e:'Nasal dermoid: firm mass with central dimple (embryonic cyst). Encephalocele: outpouching of brain through a mid-skull defect.',s:'Slide 23'},
 {q:'Tonsillar and adenoid lymphoid tissue in children:',c:['Is small in infancy, grows until about 8-10 years, then shrinks','Is largest at birth','Never changes','Grows throughout adulthood'],a:0,e:'Small in infants, grow until 8-10 y, then shrink; enlargement can affect breathing, snoring, swallowing.',s:'Slide 27'},
 {q:'Pierre Robin syndrome features:',c:['Micrognathia and cleft palate/lip','Macroglossia','Craniosynostosis','Preauricular sinuses'],a:0,e:'Pierre Robin: micrognathia, cleft palate/lip. High-arched palate: trisomy 13 and 18, some syndromes, excessive pacifier/thumb sucking.',s:'Slide 30'},
 {q:'In a sexually active teen with sore throat, which bacterial cause should be considered besides group A strep?',c:['Neisseria gonorrhoeae','Corynebacterium diphtheriae','Bordetella pertussis','H. influenzae type b'],a:0,e:'Pharyngitis: most common viral; GAS most common bacterial; consider N. gonorrhoeae in teens; GAS uncommon &lt;3 y; EBV/CMV mono. Rapid test with PCR/culture backup.',s:'Slide 31'},
 {q:'Group A strep pharyngitis is uncommon in children younger than:',c:['3 years','10 years','15 years','6 months only'],a:0,e:'"Group A strep is uncommon in kids &lt;3 yo."',s:'Slide 31'},
 {q:'Scarlet fever findings with strep pharyngitis:',c:['Circumoral pallor, strawberry tongue, fine diffuse erythematous maculopapular (sandpaper) rash','Vesicles on palms and soles','Posterior cervical nodes and splenomegaly','Koplik spots'],a:0,e:'Strep: fever, throat pain, LAD. Scarlet fever: circumoral pallor, strawberry tongue, fine diffuse erythematous maculopapular rash. Tx: amoxicillin, to prevent acute rheumatic fever.',s:'Slide 32'},
 {q:'Treatment of strep pharyngitis in children and its main benefit:',c:['Amoxicillin; prevents acute rheumatic fever','Azithromycin; prevents glomerulonephritis','No treatment needed','Steroids; prevents abscess'],a:0,e:'Treatment: amoxicillin. Benefit: prevention of acute rheumatic fever.',s:'Slide 32'},
 {q:'Per Dr. Sims, tonsillectomy for recurrent tonsillitis may be considered with:',c:['&gt;6 episodes in 1 year or 5 episodes per year for 2 years','1 episode per year','2 episodes ever','Any episode of uvulitis'],a:0,e:'Consider tonsil removal with &gt;6 episodes in 1 year or 5/year for 2 years; consider culture for C/G strep; treat carriers/family members.',f:'Dr. Strabbing (4.02 slide 11) lists recurrent tonsillitis as <b>7 in 1 year, 5/yr ×2 years, 3/yr ×3 years</b>; Dr. Sims lists <b>&gt;6 in 1 year or 5/yr ×2 years</b>.',s:'Slide 33'},
 {q:'Uvulitis is most commonly caused by:',c:['Group A strep (managed like strep pharyngitis)','Candida','HSV','H. influenzae'],a:0,e:'Uvulitis: inflammation/swelling of uvula; most commonly GAS; same management as strep pharyngitis.',s:'Slide 33'},
 {q:'A toxic, drooling child sits in the tripod/sniffing position with muffled voice and no cough; lateral neck film shows a thumb sign. Diagnosis?',c:['Epiglottitis: medical emergency (intubation, antibiotics)','Croup','Laryngomalacia','Subglottic stenosis'],a:0,e:'Epiglottitis: high fever, rapid onset, no cough, can\'t swallow, toxic, drooling, tripod, stridor, THUMB sign, leukocytosis → intubation + antibiotics. Rare now due to Hib vaccination.',s:'Slides 34, 37'},
 {q:'Why is epiglottitis now RARE?',c:['Haemophilus influenzae type b vaccination','Better hand washing','Steroids','Tonsillectomy'],a:0,e:'H. influenzae B epiglottitis is rare now due to vaccination (other causes: GAS, S. aureus).',s:'Slide 34'},
 {q:'A 2-year-old has fever, runny nose, barky cough and inspiratory stridor; nontoxic; steeple sign on x-ray. Diagnosis and treatment?',c:['Croup: oral/IM dexamethasone, racemic epinephrine, cool mist','Epiglottitis: intubation','Bacterial tracheitis: antibiotics','Peritonsillar abscess: drainage'],a:0,e:'Croup: most common middle airway infection in children; VIRAL (parainfluenza, RSV); 6 mo-3 y; barky cough, inspiratory stridor, hoarse, fever, URI; steeple sign. Tx dexamethasone, racemic epinephrine, cool mist.',s:'Slides 35, 37'},
 {q:'Which feature distinguishes bacterial tracheitis in Dr. Sims\' table?',c:['Any age, high fever, rapid onset, no URI symptoms, toxic, ragged tracheal border; intubation + antibiotics','6 mo-3 y, steeple sign, nontoxic','&gt;8 y, hot potato voice, trismus','Thumb sign'],a:0,e:'Bacterial tracheitis (S. aureus, M. catarrhalis): any age; high fever, rapid onset, no URI; toxic, anxious, ± stridor/cough; ragged tracheal border; leukocytosis; intubation + antibiotics.',s:'Slide 37'},
 {q:'A 4-year-old has fever, insidious sore throat, no cough, drooling and an arched (hyperextended) neck; x-ray shows thickened prevertebral soft tissue. Diagnosis?',c:['Retropharyngeal abscess: antibiotics + surgical drainage','Croup','Laryngomalacia','Epiglottitis'],a:0,e:'Retropharyngeal abscess (S. aureus, GAS, oral anaerobes): &lt;6 y, fever, insidious, sore throat, no URI/cough, moderately toxic, drooling, arched neck, inflamed pharynx; thickened retropharyngeal space; antibiotics + drainage.',s:'Slide 37'},
 {q:'A 12-year-old has sudden worsening sore throat, trismus, "hot potato" voice, drooling and asymmetric tonsil swelling. Imaging needed?',c:['Peritonsillar abscess; imaging not needed','Retropharyngeal abscess; CT required','Epiglottitis; thumb sign x-ray','Croup; steeple sign'],a:0,e:'PTA (GAS, oral anaerobes): &gt;8 y; fever, sudden worsening, trismus; hot potato voice, drooling, asymmetric tonsil swelling; imaging not needed; antibiotics + surgical drainage.',s:'Slide 37'},
 {q:'SUPRAGLOTTIC vs SUBGLOTTIC obstruction: which features suggest SUPRAGLOTTIC?',c:['Quiet stridor, muffled voice, dysphagia, drooling, tripod/arching posture, toxic, no barking cough','Loud stridor, hoarse voice, barking cough, no drooling','Biphasic stridor only','Expiratory wheeze'],a:0,e:'Supraglottic (epiglottitis, PTA, RPA): quiet stridor, muffled voice, dysphagia, tripod/arching, toxic, some trismus, drooling, no barking cough. Subglottic (croup, angioedema, FB, tracheitis): loud stridor, hoarse, barking cough, nontoxic (unless tracheitis), no drooling.',s:'Slide 39'},
